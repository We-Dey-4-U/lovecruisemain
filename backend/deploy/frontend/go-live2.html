<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>vConnect — Go Live</title>
<link rel="stylesheet" href="css/style.css">
<style>
.start-live-screen {
  min-height: 100vh;
  padding: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.live-wrapper {
  width: 100%;
  max-width: 520px;
}
.live-hero {
  text-align: center;
  margin-bottom: 28px;
}
.live-icon {
  width: 100px;
  height: 100px;
  margin: 0 auto 20px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 46px;
  background: linear-gradient(135deg, rgba(255,61,127,.25), rgba(0,217,181,.20));
  border: 1px solid var(--border);
  backdrop-filter: blur(12px);
}
.live-hero h1 { font-size: 32px; margin-bottom: 10px; }
.live-hero p  { color: var(--text-dim); line-height: 1.6; }
.live-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 28px;
  padding: 24px;
  box-shadow: 0 20px 60px rgba(0,0,0,.25);
}
.form-group { margin-bottom: 18px; }
.form-label { display: block; margin-bottom: 8px; font-size: 13px; font-weight: 700; }
.live-input,
.live-textarea {
  width: 100%;
  border: none;
  outline: none;
  color: var(--text);
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 14px 16px;
  font-size: 14px;
  transition: .2s;
}
.live-input:focus,
.live-textarea:focus {
  border-color: var(--magenta);
  box-shadow: 0 0 0 3px rgba(255,61,127,.12);
}
.live-textarea { min-height: 140px; resize: none; }
.live-tips {
  margin: 20px 0;
  padding: 14px;
  border-radius: 16px;
  background: linear-gradient(135deg, rgba(255,200,87,.10), rgba(255,61,127,.08));
  border: 1px solid rgba(255,200,87,.15);
}
.live-tips h4  { font-size: 13px; margin-bottom: 8px; }
.live-tips ul  { margin: 0; padding-left: 18px; color: var(--text-dim); font-size: 12px; line-height: 1.7; }
.start-live-btn {
  width: 100%;
  height: 56px;
  border: none;
  border-radius: 18px;
  cursor: pointer;
  font-size: 15px;
  font-weight: 800;
}
.start-live-btn:disabled { opacity: .7; cursor: not-allowed; }
.back-link {
  display: flex;
  align-items: center;
  justify-content: center;
  margin-top: 18px;
  color: var(--text-dim);
  text-decoration: none;
  font-size: 13px;
}
.back-link:hover { color: var(--text); }

/* ── Live Mode Picker ── */
.live-mode-picker {
  display: flex; gap: 10px; margin-bottom: 20px;
}
.live-mode-btn {
  flex: 1; border-radius: 18px; padding: 14px 10px;
  border: 2px solid var(--border); background: var(--surface-2);
  color: var(--text); font-size: 12.5px; font-weight: 800;
  cursor: pointer; text-align: center; transition: all .18s;
  display: flex; flex-direction: column; align-items: center; gap: 5px;
}
.live-mode-btn .mode-ico { font-size: 26px; }
.live-mode-btn.active {
  border-color: #a05aff;
  background: rgba(160,90,255,.1);
  color: #c890ff;
}
.live-mode-btn[data-mode="social"].active {
  border-color: #ff3d7f;
  background: rgba(255,61,127,.1);
  color: #ff3d7f;
}

/* ── Podcast extra fields ── */
#podcast-live-fields { display: none; margin-bottom: 18px; }
#podcast-live-fields.show { display: block; }
.pod-field { margin-bottom: 14px; }
.pod-field label {
  display: block; font-size: 10.5px; font-weight: 800;
  color: var(--text-dim); text-transform: uppercase;
  letter-spacing: .06em; margin-bottom: 6px;
}
.pod-input, .pod-select {
  width: 100%; box-sizing: border-box;
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: 14px; color: var(--text); font-size: 14px;
  padding: 11px 14px; outline: none; font-family: inherit;
  transition: border-color .2s;
}
.pod-input:focus, .pod-select:focus { border-color: #a05aff; }

.live-mode-picker {
  display: flex; gap: 10px; padding: 14px 16px 0;
}
.live-mode-btn {
  flex: 1; border-radius: 18px; padding: 14px 10px;
  border: 2px solid var(--border); background: var(--surface);
  color: var(--text); font-size: 12.5px; font-weight: 800;
  cursor: pointer; text-align: center; transition: all .18s;
  display: flex; flex-direction: column; align-items: center; gap: 5px;
}
.live-mode-btn .mode-ico { font-size: 26px; }
.live-mode-btn.active {
  border-color: #a05aff;
  background: rgba(160,90,255,.1);
  color: #c890ff;
}
.live-mode-btn[data-mode="social"].active {
  border-color: #ff3d7f;
  background: rgba(255,61,127,.1);
  color: #ff3d7f;
}

/* Podcast-mode extra fields — hidden unless podcast mode selected */
#podcast-live-fields { display: none; padding: 0 16px; }
#podcast-live-fields.show { display: block; }
.pod-field { margin-bottom: 12px; }
.pod-field label {
  display: block; font-size: 10.5px; font-weight: 800;
  color: var(--text-dim); text-transform: uppercase;
  letter-spacing: .06em; margin-bottom: 6px;
}
.pod-input, .pod-select {
  width: 100%; box-sizing: border-box;
  background: var(--bg); border: 1.5px solid var(--border);
  border-radius: 14px; color: var(--text); font-size: 14px;
  padding: 11px 14px; outline: none; font-family: inherit;
  transition: border-color .2s;
}
.pod-input:focus, .pod-select:focus { border-color: #a05aff; }
</style>
</head>
<body>
<div class="app-shell">
  <div class="screen start-live-screen">
    <div class="live-wrapper">

      <div class="live-hero">
        <div class="live-icon" id="live-icon">📡</div>
        <h1>Go Live</h1>
        <p>Start a live stream, connect with viewers, receive gifts and grow your audience.</p>
      </div>

      <div class="live-card">

        <!-- Mode picker -->
        <div class="live-mode-picker">
          <button class="live-mode-btn active" data-mode="social" id="mode-social">
            <span class="mode-ico">📡</span>
            Social Live
            <span style="font-size:10px;font-weight:600;opacity:.7">Camera + chat</span>
          </button>
          <button class="live-mode-btn" data-mode="podcast" id="mode-podcast">
            <span class="mode-ico">🎙️</span>
            Podcast Live
            <span style="font-size:10px;font-weight:600;opacity:.7">Episode format</span>
          </button>
        </div>

        <div class="form-group">
          <label class="form-label" id="title-label">Live Title</label>
          <input id="live-title" class="live-input" maxlength="120" placeholder="What are you streaming today?">
        </div>
        <div class="form-group">
          <label class="form-label">Description</label>
          <textarea id="live-description" class="live-textarea" maxlength="500"
            placeholder="Tell viewers what this live stream is about..."></textarea>
        </div>

        <!-- Podcast-only fields (hidden by default) -->
        <div id="podcast-live-fields">
          <div class="pod-field">
            <label>Episode Title</label>
            <input class="pod-input" id="pod-live-title" placeholder="e.g. Episode 12 — The Deep Dive" maxlength="150">
          </div>
          <div class="pod-field">
            <label>Show (optional)</label>
            <select class="pod-select" id="pod-live-show">
              <option value="">Standalone / no show</option>
            </select>
          </div>
        </div>

        <div class="live-tips">
          <h4>Tips for better engagement</h4>
          <ul>
            <li>Use a clear and catchy title</li>
            <li>Ensure good lighting and audio</li>
            <li>Interact with viewers in chat</li>
            <li>Encourage gifts and follows</li>
          </ul>
        </div>

        <button id="start-live-btn" class="btn btn-primary start-live-btn">
          🚀 Start Live Stream
        </button>
      </div>

      <a href="discover.html" class="back-link">← Back to Discover</a>

    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
  import "./js/api.js";
  import "./js/app.js";

  if (!requireAuthOrRedirect()) {
    throw new Error("Authentication required");
  }

  let _liveMode = "social";

  /* ── Mode picker ── */
  document.querySelectorAll(".live-mode-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".live-mode-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      _liveMode = btn.dataset.mode;

      const podFields  = document.getElementById("podcast-live-fields");
      const icon       = document.getElementById("live-icon");
      const titleLabel = document.getElementById("title-label");
      const titleInput = document.getElementById("live-title");

      if (_liveMode === "podcast") {
        podFields.classList.add("show");
        icon.textContent        = "🎙️";
        titleLabel.textContent  = "Stream Title";
        titleInput.placeholder  = "e.g. Live Podcast — Season 2 Ep 5";
        populatePodShows();
      } else {
        podFields.classList.remove("show");
        icon.textContent        = "📡";
        titleLabel.textContent  = "Live Title";
        titleInput.placeholder  = "What are you streaming today?";
      }
    });
  });

  /* ── Populate podcast show select ── */
  async function populatePodShows() {
    try {
      const res   = await api.request("/podcasts/shows/mine");
      const shows = res.data || [];
      const sel   = document.getElementById("pod-live-show");
      sel.innerHTML = `<option value="">Standalone / no show</option>`;
      shows.forEach(s => {
        const o = document.createElement("option");
        o.value = s.id; o.textContent = s.title; sel.appendChild(o);
      });
    } catch {}
  }

  /* ── Start live ── */
  async function startLive() {
    const btn         = document.getElementById("start-live-btn");
    const title       = document.getElementById("live-title").value.trim();
    const description = document.getElementById("live-description").value.trim();

    if (!title) {
      showToast("Please enter a live title");
      return;
    }

    try {
      btn.disabled    = true;
      btn.textContent = "Creating Live Room…";

      const response = await api.request("/live/create", {
        method: "POST",
        body: JSON.stringify({ title, description })
      });

      const room = response.data;
      showToast("Live room created!");

      setTimeout(() => {
        if (_liveMode === "podcast") {
          // Grab podcast-specific metadata for the URL
          const podTitle = document.getElementById("pod-live-title").value.trim() || title;
          const showSel  = document.getElementById("pod-live-show");
          const showName = showSel.options[showSel.selectedIndex]?.text || "";

          const params = new URLSearchParams({
            room:  room.id,
            title: podTitle,
            show:  showName,
            mode:  "podcast"
          });
          window.location.href = `podcast-live.html?${params.toString()}`;
        } else {
          window.location.href = `live.html?room=${room.id}`;
        }
      }, 500);

    } catch (err) {
      console.error(err);
      showToast("Failed to create live room");
      btn.disabled    = false;
      btn.textContent = "🚀 Start Live Stream";
    }
  }

  document.getElementById("start-live-btn").addEventListener("click", startLive);
</script>
</body>
</html>

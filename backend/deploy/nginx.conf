# Load balances across API instances. `ip_hash` gives Socket.IO
# long-polling fallback connections session affinity — WebSocket
# upgrades don't strictly need this since the Redis adapter makes
# any instance able to serve any room, but sticky sessions reduce
# unnecessary reconnect churn.
worker_processes auto;

events {
  worker_connections 4096;
}

http {
  upstream lovecruz_api {
    ip_hash;
    server api:3000 max_fails=3 fail_timeout=10s;
  }

  # Basic connection-level DDoS mitigation (perimeter protection
  # should also sit in front of this at the CDN, e.g. Cloudflare).
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

  server {
    listen 80;
    server_name api.lovecruz.fun;

    location /health/ {
      # Health checks bypass rate limiting.
      proxy_pass http://lovecruz_api;
    }

    location /socket.io/ {
      proxy_pass http://lovecruz_api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 3600s; # long-lived WS connections
    }

    location / {
      limit_req zone=api_limit burst=40 nodelay;
      proxy_pass http://lovecruz_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Create Post — vConnect</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="css/style.css">

<style>
.create-wrap{
  padding:20px;
}

textarea{
  width:100%;
  min-height:120px;
  padding:12px;
  border-radius:12px;
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--text);
  resize:none;
}

.media-box{
  margin-top:12px;
  border:1px dashed var(--border);
  border-radius:14px;
  padding:14px;
  text-align:center;
  cursor:pointer;
  color:var(--text-dim);
}

.media-box input{ display:none; }

.preview{
  margin-top:12px;
  display:grid;
  grid-template-columns: repeat(3, 1fr);
  gap:6px;
}

.preview img,
.preview video{
  width:100%;
  height:100px;
  border-radius:10px;
  object-fit:cover;
}

.actions{
  margin-top:16px;
}

.btn{
  width:100%;
  padding:12px;
  border:none;
  border-radius:999px;
  font-weight:700;
  cursor:pointer;
  background:linear-gradient(135deg,var(--magenta),var(--teal));
  color:#fff;
}

.small{
  font-size:12px;
  color:var(--text-dim);
  margin-top:6px;
}
</style>
</head>

<body>

<div class="app-shell">
  <div class="screen">

    <div class="topbar">
      <!-- ✅ NO onclick= here; wired below via addEventListener  help me build this file correctly-->
      <button class="icon-btn" id="backBtn">←</button>
      <div class="brand">Create Post</div>
    </div>

    <div class="create-wrap">
      <textarea id="caption" placeholder="What's on your mind?"></textarea>
      <label class="media-box">
        📷 Upload Images / Videos
        <input type="file" id="file" accept="image/*,video/*" multiple>
      </label>
      <div class="preview" id="preview"></div>
      <div class="small">You can select multiple images/videos</div>
      <div class="actions">
        <!-- ✅ NO onclick= -->
        <button class="btn" id="postBtn">Post</button>
      </div>
    </div>
  </div>
</div>

<script type="module">
  import "./js/api.js";
  import "./js/app.js";

  console.log("[create-post] module loaded ✅");
  console.log("[create-post] CURRENT_USER:", window.CURRENT_USER);

  if (!requireAuthOrRedirect()) { /* stops here if not logged in */ }

  let selectedFiles = [];

  // ── Back button ──────────────────────────────────────────
  document.getElementById("backBtn")
    .addEventListener("click", () => history.back());

  // ── File preview ─────────────────────────────────────────
  document.getElementById("file").addEventListener("change", (e) => {
    selectedFiles = Array.from(e.target.files || []);
    console.log("[create-post] files selected:", selectedFiles.map(f => f.name));

    const preview = document.getElementById("preview");
    preview.innerHTML = "";
    selectedFiles.forEach(file => {
      const url = URL.createObjectURL(file);
      preview.innerHTML += file.type.startsWith("image")
        ? `<img src="${url}">`
        : `<video src="${url}" controls></video>`;
    });
  });

  // ── Submit post ───────────────────────────────────────────
  document.getElementById("postBtn")
    .addEventListener("click", async () => {
      console.log("[create-post] postBtn clicked ✅");

      const caption = document.getElementById("caption").value.trim();
      console.log("[create-post] caption:", caption);
      console.log("[create-post] file count:", selectedFiles.length);

      const formData = new FormData();
      formData.append("caption", caption);
      selectedFiles.forEach(file => formData.append("media", file));

      const btn = document.getElementById("postBtn");
      btn.disabled = true;
      btn.textContent = "Posting…";

      try {
        console.log("[create-post] 🚀 sending POST /posts …");
        const res = await window.api.request("/posts", {
          method: "POST",
          body: formData,
          isFormData: true
        });
        console.log("[create-post] ✅ success:", res);
        showToast("Post created 🎉");
        setTimeout(() => { window.location.href = "home.html"; }, 800);
      } catch (err) {
        console.error("[create-post] ❌ POST /posts failed:", err);
        showToast(err.message || "Failed to create post");
        btn.disabled = false;
        btn.textContent = "Post";
      }
    });

  console.log("[create-post] all listeners attached ✅");
</script>

</body>
</html>

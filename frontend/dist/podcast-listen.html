<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Lovio — Podcasts</title>
<style>
/* ══════════════════════════════════════════
   PODCAST LISTEN PAGE  — v2
══════════════════════════════════════════ */

/* ── now-playing bar ── */
.np-bar {
  position: sticky; top: 0; z-index: 30;
  background: linear-gradient(180deg, var(--surface) 0%, rgba(var(--surface-rgb),.96) 100%);
  border-bottom: 1px solid var(--border);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
}
.np-inner { padding: 10px 14px 0; }
.np-top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }

.np-cover {
  width: 48px; height: 48px; border-radius: 10px;
  object-fit: cover; flex: none;
  background: var(--surface-2); border: 1px solid var(--border);
  box-shadow: 0 4px 12px rgba(0,0,0,.3);
}
.np-info { flex: 1; min-width: 0; }
.np-title {
  font-size: 13px; font-weight: 800; line-height: 1.25;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.np-show { font-size: 11px; color: var(--text-dim); margin-top: 1px; }

.np-controls { display: flex; align-items: center; gap: 8px; }
.np-ctrl {
  width: 34px; height: 34px; border-radius: 50%; flex: none;
  background: rgba(255,255,255,.07); border: 1px solid var(--border);
  color: var(--text); cursor: pointer; font-size: 13px;
  display: flex; align-items: center; justify-content: center;
  transition: background .15s, transform .1s;
}
.np-ctrl:active { transform: scale(.86); }
.np-ctrl.pp {
  width: 40px; height: 40px; font-size: 15px;
  background: linear-gradient(135deg,#ff3d7f,#a05aff);
  border: none; color: #fff;
  box-shadow: 0 4px 16px rgba(255,61,127,.4);
}
.np-ctrl.pp:active { transform: scale(.88); }
.np-right { display: flex; align-items: center; gap: 6px; margin-left: auto; }
.np-speed {
  background: rgba(255,255,255,.07); border: 1px solid var(--border);
  border-radius: 8px; padding: 3px 8px; font-size: 10.5px;
  font-weight: 800; color: var(--text); cursor: pointer; line-height: 1.4;
}
.np-mute { font-size: 14px; cursor: pointer; color: var(--text-dim); background: none; border: none; }

.np-prog-row {
  display: flex; align-items: center; gap: 8px;
  padding: 4px 0 12px;
}
.np-prog-row input[type=range] {
  flex: 1; height: 3px; accent-color: #ff3d7f; cursor: pointer;
  -webkit-appearance: none; appearance: none;
  background: linear-gradient(to right,#ff3d7f 0%,var(--border) 0%);
  border-radius: 2px; outline: none;
}
.np-time { font-size: 10px; color: var(--text-dim); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* ── tabs ── */
.p-tabs {
  display: flex; border-bottom: 1px solid var(--border);
  overflow-x: auto; scrollbar-width: none;
  background: var(--bg); position: sticky; top: 114px; z-index: 20;
}
.p-tabs::-webkit-scrollbar { display: none; }
.ptab {
  flex: none; padding: 11px 18px; font-size: 12.5px; font-weight: 700;
  color: var(--text-dim); border-bottom: 2px solid transparent;
  cursor: pointer; white-space: nowrap; transition: color .2s;
}
.ptab.active { color: var(--text); border-bottom-color: #ff3d7f; }
.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* ── episode cards ── */
.ep-feed { padding: 10px 12px 100px; }

.ep-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 20px; margin-bottom: 14px; overflow: hidden;
  display: flex; flex-direction: column;
  transition: box-shadow .2s, transform .15s;
}
.ep-card:hover { box-shadow: 0 8px 28px rgba(0,0,0,.22); transform: translateY(-1px); }
.ep-card.playing { border-color: rgba(255,61,127,.4); }

.ep-thumb {
  position: relative; height: 170px;
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
  overflow: hidden;
}
.ep-thumb img {
  width: 100%; height: 100%; object-fit: cover; display: block;
  transition: transform .3s;
}
.ep-card:hover .ep-thumb img { transform: scale(1.03); }

.ep-thumb-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(to top, rgba(0,0,0,.6) 0%, transparent 50%);
}
.ep-play-fab {
  position: absolute; bottom: 12px; right: 12px;
  width: 44px; height: 44px; border-radius: 50%; border: none;
  background: linear-gradient(135deg,#ff3d7f,#a05aff);
  color: #fff; font-size: 16px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 16px rgba(255,61,127,.5);
  transition: transform .15s, box-shadow .15s;
}
.ep-play-fab:active { transform: scale(.88); }
.ep-play-fab.playing {
  background: linear-gradient(135deg, #00c9a7, #0072ff);
  box-shadow: 0 4px 16px rgba(0,114,255,.5);
}
.ep-duration-badge {
  position: absolute; bottom: 12px; left: 12px;
  background: rgba(0,0,0,.7); backdrop-filter: blur(6px);
  border-radius: 8px; padding: 3px 8px; font-size: 10.5px;
  font-weight: 700; color: rgba(255,255,255,.9);
}

.ep-body { padding: 12px 14px 14px; }
.ep-show-label {
  font-size: 10px; font-weight: 800; letter-spacing: .06em;
  text-transform: uppercase; color: #ff3d7f; margin-bottom: 4px;
}
.ep-title { font-size: 14px; font-weight: 800; line-height: 1.3; margin-bottom: 5px; }
.ep-meta {
  display: flex; gap: 10px; flex-wrap: wrap;
  font-size: 11px; color: var(--text-dim); margin-bottom: 7px;
}
.ep-meta span { display: flex; align-items: center; gap: 3px; }
.ep-desc {
  font-size: 12.5px; color: var(--text-dim); line-height: 1.55;
  margin-bottom: 12px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.ep-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.ep-btn {
  display: inline-flex; align-items: center; gap: 4px;
  background: rgba(255,255,255,.05); border: 1px solid var(--border);
  border-radius: 20px; padding: 6px 12px; font-size: 11.5px; font-weight: 600;
  color: var(--text-dim); cursor: pointer; transition: background .15s, color .15s;
  white-space: nowrap;
}
.ep-btn:hover { background: rgba(255,255,255,.1); color: var(--text); }
.ep-btn.liked { color: #ff3d7f; border-color: rgba(255,61,127,.3); background: rgba(255,61,127,.07); }
.ep-btn.gift  { color: #ffc857; border-color: rgba(255,200,87,.3); }

/* ── shows grid ── */
.shows-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px 12px 100px; }
.show-tile {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 18px; overflow: hidden; cursor: pointer;
  transition: box-shadow .2s, transform .15s;
}
.show-tile:hover { box-shadow: 0 6px 24px rgba(0,0,0,.2); transform: translateY(-2px); }
.show-tile-cover { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; background: var(--surface-2); }
.show-tile-body { padding: 10px; }
.show-tile-title { font-size: 12.5px; font-weight: 800; margin-bottom: 2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.show-tile-host  { font-size: 10.5px; color: var(--text-dim); }
.show-tile-stats { font-size: 10px; color: var(--text-dim); margin-top: 4px;
  display: flex; gap: 8px; }

/* ── skeletons ── */
.skel { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; margin-bottom: 14px; padding: 14px; }
.skel-img  { height: 160px; background: var(--surface-2); border-radius: 12px; animation: sk 1.6s infinite; }
.skel-line { height: 10px; background: var(--surface-2); border-radius: 5px; margin-top: 10px; animation: sk 1.6s infinite; }
.skel-line.s { width: 60%; } .skel-line.xs { width: 35%; }
@keyframes sk { 0%,100%{opacity:.35} 50%{opacity:.75} }

/* ── empty / error ── */
.empty-box { text-align: center; padding: 60px 20px; color: var(--text-dim); }
.empty-box .ico { font-size: 44px; display: block; margin-bottom: 12px; }
.empty-box p { font-size: 14px; }

/* ── comment sheet ── */
.cmt-bd {
  position: fixed; inset: 0; background: rgba(0,0,0,.75);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  z-index: 400; display: flex; justify-content: center; align-items: flex-end;
}
.cmt-sheet {
  width: 100%; max-width: 480px; max-height: 80vh;
  background: var(--bg); border-radius: 24px 24px 0 0;
  display: flex; flex-direction: column;
  border-top: 1px solid var(--border);
  animation: slideUp .25s cubic-bezier(.34,1.26,.64,1);
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.cmt-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px; border-bottom: 1px solid var(--border); flex: none;
}
.cmt-header h3 { font-size: 14.5px; font-weight: 800; }
.cmt-header .cnt { font-size: 12px; color: var(--text-dim); font-weight: 400; margin-left: 6px; }
.cmt-x {
  width: 28px; height: 28px; border-radius: 50%; border: none;
  background: var(--surface); color: var(--text); cursor: pointer; font-size: 13px;
}
.cmt-list { flex: 1; overflow-y: auto; padding: 10px 16px; }
.cmt-item { display: flex; gap: 10px; margin-bottom: 14px; }
.cmt-av {
  width: 32px; height: 32px; border-radius: 50%;
  object-fit: cover; flex: none; cursor: pointer;
}
.cmt-body { flex: 1; min-width: 0; }
.cmt-name { font-size: 12.5px; font-weight: 800; margin-bottom: 2px; }
.cmt-text { font-size: 13px; line-height: 1.55; word-break: break-word; }
.cmt-meta { display: flex; gap: 12px; margin-top: 4px; font-size: 10.5px; color: var(--text-dim); }
.reply-btn { background: none; border: none; color: var(--text-dim); font-size: 10.5px; font-weight: 700; cursor: pointer; padding: 0; }
.reply-btn:hover { color: #ff3d7f; }
.reply-strip {
  margin: 0 16px 8px; padding: 6px 12px;
  background: rgba(255,61,127,.1); border-radius: 10px;
  display: flex; align-items: center; justify-content: space-between;
  font-size: 11.5px; color: #ff3d7f; flex: none;
}
.reply-strip button { background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 14px; }
.cmt-input-row {
  display: flex; gap: 8px; padding: 10px 14px;
  border-top: 1px solid var(--border); flex: none; align-items: flex-end;
}
.cmt-input-row textarea {
  flex: 1; padding: 9px 13px; background: var(--surface);
  border: 1.5px solid var(--border); border-radius: 18px; color: var(--text);
  font-size: 13px; resize: none; min-height: 38px; max-height: 96px;
  outline: none; font-family: inherit; line-height: 1.4; transition: border-color .2s;
}
.cmt-input-row textarea:focus { border-color: #ff3d7f; }
.cmt-send {
  width: 38px; height: 38px; border-radius: 50%; border: none; flex: none;
  background: linear-gradient(135deg,#ff3d7f,#a05aff); color: #fff; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}

/* ── gift sheet ── */
.gift-bd {
  position: fixed; inset: 0; background: rgba(0,0,0,.65);
  backdrop-filter: blur(6px); z-index: 300;
  opacity: 0; pointer-events: none; transition: opacity .22s;
}
.gift-bd.open { opacity: 1; pointer-events: auto; }
.gift-panel {
  position: fixed; left: 0; right: 0; bottom: -100%;
  max-width: 480px; margin: 0 auto;
  background: var(--surface); border-radius: 24px 24px 0 0;
  z-index: 301; padding: 0 0 36px;
  transition: bottom .3s cubic-bezier(.34,1.26,.64,1);
  border-top: 1px solid var(--border);
}
.gift-panel.open { bottom: 0; }
.gift-handle { width: 36px; height: 4px; background: var(--border); border-radius: 2px; margin: 12px auto 14px; }
.gift-head { display: flex; align-items: center; justify-content: space-between; padding: 0 18px 6px; }
.gift-head h3 { font-size: 14.5px; font-weight: 800; }
.coin-badge {
  display: flex; align-items: center; gap: 4px;
  background: rgba(255,200,87,.1); border: 1px solid rgba(255,200,87,.2);
  border-radius: 16px; padding: 4px 10px; font-size: 11.5px; font-weight: 700; color: #ffc857;
}
.gift-to { padding: 0 18px 10px; font-size: 12px; color: var(--text-dim); }
.gift-to strong { color: #ff3d7f; }
.gift-grid {
  display: grid; grid-template-columns: repeat(4,1fr); gap: 8px;
  padding: 0 14px 14px; max-height: 220px; overflow-y: auto; scrollbar-width: none;
}
.gift-grid::-webkit-scrollbar { display: none; }
.gift-tile {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  background: rgba(255,255,255,.05); border: 1.5px solid transparent;
  border-radius: 14px; padding: 10px 5px; cursor: pointer;
  transition: border-color .15s, background .15s, transform .1s;
}
.gift-tile:active { transform: scale(.9); }
.gift-tile.sel { border-color: #ff3d7f; background: rgba(255,61,127,.1); }
.g-emoji { font-size: 22px; }
.g-name  { font-size: 9px; font-weight: 700; color: rgba(255,255,255,.75); text-align: center; }
.g-price { font-size: 9.5px; font-weight: 800; color: #ffc857; }
.gift-send-btn {
  width: calc(100% - 28px); margin: 0 14px; height: 46px; border-radius: 14px;
  font-size: 13px; font-weight: 800; border: none; cursor: pointer;
  background: linear-gradient(135deg,#ff3d7f,#c2185b); color: #fff; transition: opacity .2s;
}
.gift-send-btn:disabled { opacity: .4; cursor: not-allowed; }

/* ── misc ── */
.empty-sm { text-align: center; padding: 24px; color: var(--text-dim); font-size: 13px; }
.loading-sm { text-align: center; padding: 20px; color: var(--text-dim); font-size: 13px; }
</style>

<div class="app-shell">
  <div class="screen" style="padding:0;overflow-y:auto;">

    <!-- top bar -->
    <div class="home-topbar" style="position:sticky;top:0;z-index:40;background:var(--bg);">
      <div style="display:flex;align-items:center;gap:10px;">
        <button class="hamburger-btn" onclick="history.back()" aria-label="Back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="17" height="17"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
        </button>
        <span style="font-size:17px;font-weight:900;background:linear-gradient(135deg,#ff3d7f,#a05aff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">Podcasts</span>
      </div>
      <div style="display:flex;gap:8px;">
        <a href="podcast-studio.html" class="topbar-icon-btn" title="Studio">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="17" height="17"><path d="M12 2a3 3 0 0 1 3 3v7a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>

          <img class="np-cover" id="player-cover" src="" alt="">

          </div>

      <div class="ptab" data-tab="following">Following</div>

</div>

<!-- comment sheet -->
<div class="cmt-bd" id="cmt-bd" style="display:none;">
  <div class="cmt-sheet">
    <div class="cmt-header">
      <h3>Comments <span class="cnt" id="cmt-count-label"></span></h3>
      <button class="cmt-x" id="cmt-close">✕</button>

      <button id="reply-clear">✕</button>

      <textarea id="cmt-textarea" placeholder="Write a comment…" rows="1"></textarea>
      <button class="cmt-send" id="cmt-send">

      </button>
    </div>
  </div>
</div>

<!-- gift sheet -->

    <h3>Send a Gift</h3>

  <div class="gift-grid" id="gift-grid"></div>
  <button class="gift-send-btn" id="gift-send-btn" disabled>Select a gift</button>
</div>

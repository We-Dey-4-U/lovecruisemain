<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>lovecruise — Discover</title>
<style>
.discover-topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 20px 12px; position: sticky; top: 0; z-index: 10;
  background: var(--bg); border-bottom: 1px solid var(--border);
  backdrop-filter: blur(12px);
}
.discover-topbar .brand {
  display: flex; align-items: center; gap: 8px;
  font-size: 22px; font-weight: 900; letter-spacing: -0.5px;
}
.brand-dot { width: 8px; height: 8px; border-radius: 50%; background: #ff3d7f; box-shadow: 0 0 10px #ff3d7f; }
.topbar-actions { display: flex; align-items: center; gap: 10px; }
.coin-pill {
  display: flex; align-items: center; gap: 5px;
  background: rgba(255,200,87,.12); border: 1px solid rgba(255,200,87,.25);
  border-radius: 20px; padding: 6px 12px; font-size: 13px; font-weight: 700;
  color: #ffc857; cursor: pointer; transition: background .2s;
}
.coin-pill:hover { background: rgba(255,200,87,.2); }
.icon-btn {
  width: 36px; height: 36px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: var(--surface); border: 1px solid var(--border);
  color: var(--text); cursor: pointer; transition: background .2s;
}
.icon-btn:hover { background: var(--surface-2); }

.stories-strip { display: flex; gap: 14px; padding: 16px 20px; overflow-x: auto; scrollbar-width: none; }
.stories-strip::-webkit-scrollbar { display: none; }
.story-item { display: flex; flex-direction: column; align-items: center; gap: 6px; flex: 0 0 auto; cursor: pointer; }
.story-ring {
  width: 60px; height: 60px; border-radius: 50%; padding: 2.5px;
  background: conic-gradient(from 220deg, #ff3d7f, #ffc857, #00d9b5, #ff3d7f);
  transition: transform .2s;
}
.story-ring:hover { transform: scale(1.06); }
.story-item.viewed .story-ring { background: var(--border); }
.story-ring img { width: 100%; height: 100%; border-radius: 50%; border: 2.5px solid var(--bg); object-fit: cover; display: block; }
.story-add {
  width: 60px; height: 60px; border-radius: 50%;
  background: var(--surface); border: 2px dashed var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; cursor: pointer; transition: background .2s;
}
.story-add:hover { background: var(--surface-2); }
.story-item span { font-size: 11px; color: var(--text-dim); max-width: 62px; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.section-header { display: flex; align-items: center; justify-content: space-between; padding: 4px 20px 14px; }
.section-header h2 { font-size: 17px; font-weight: 800; letter-spacing: -0.3px; }
.live-count { font-size: 12px; font-weight: 700; color: #ff3d7f; background: rgba(255,61,127,.1); border-radius: 10px; padding: 3px 9px; }

.filter-tabs { display: flex; gap: 8px; padding: 0 20px 14px; overflow-x: auto; scrollbar-width: none; }
.filter-tabs::-webkit-scrollbar { display: none; }
.filter-tab {
  flex: 0 0 auto; padding: 6px 14px; border-radius: 20px;
  font-size: 12px; font-weight: 700; cursor: pointer;
  background: var(--surface); border: 1px solid var(--border);
  color: var(--text-dim); transition: all .2s;
}
.filter-tab.active { background: #ff3d7f; border-color: #ff3d7f; color: #fff; }

.live-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 14px 120px; }

.live-card {
  position: relative; border-radius: 18px; overflow: hidden;
  aspect-ratio: 9/16; background: var(--surface);
  border: 1px solid rgba(255,255,255,.06);
  display: block; text-decoration: none; color: inherit;
  transition: transform .22s ease, box-shadow .22s ease;
}
.live-card:hover { transform: translateY(-3px); box-shadow: 0 16px 36px rgba(0,0,0,.45); }
.live-card:active { transform: scale(.96); }
.card-host-photo {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover; object-position: center top; display: block;
}
.card-bg-gradient {
  position: absolute; inset: 0;
  background: linear-gradient(160deg, var(--card-color-a, rgba(255,61,127,.6)) 0%, var(--card-color-b, rgba(0,217,181,.4)) 100%);
}
.card-initials {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 48px; font-weight: 900; color: rgba(255,255,255,.3);
  letter-spacing: -2px; user-select: none;
}
.card-scrim {
  position: absolute; inset: 0;
  background: linear-gradient(to bottom, rgba(0,0,0,.12) 0%, rgba(0,0,0,.05) 35%, rgba(0,0,0,.5) 70%, rgba(0,0,0,.88) 100%);
  z-index: 1;
}
.live-badge {
  position: absolute; top: 10px; left: 10px; z-index: 3;
  display: flex; align-items: center; gap: 5px;
  background: #ff3d7f; color: #fff; font-size: 10px; font-weight: 900;
  letter-spacing: .06em; padding: 4px 8px; border-radius: 8px;
}
.live-badge .pulse { width: 5px; height: 5px; border-radius: 50%; background: #fff; animation: pulse-dot 1.4s infinite; flex: none; }
@keyframes pulse-dot { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.8)} }

/* Podcast-mode badge — same shape, violet instead of magenta, so a
   glance at the grid tells you which rooms are podcast rooms before
   you ever tap in. Kept visually distinct from the "LIVE" badge on
   social rooms rather than replacing it, since a room is always
   both live AND (social|podcast). */
.live-badge.mode-podcast {
  background: linear-gradient(135deg, #A05AFF, #6A1ADF);
}

.viewer-chip-card {
  position: absolute; top: 10px; right: 10px; z-index: 3;
  display: flex; align-items: center; gap: 4px;
  background: rgba(0,0,0,.5); backdrop-filter: blur(8px);
  color: #fff; font-size: 10.5px; font-weight: 700;
  padding: 4px 8px; border-radius: 8px;
}
.card-info { position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; padding: 12px 10px 10px; }
.card-host-row { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
.card-host-name {
  font-size: 13px; font-weight: 900; color: #fff;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  flex: 1; min-width: 0; text-shadow: 0 1px 6px rgba(0,0,0,.6);
}
.card-host-live-dot { width: 6px; height: 6px; border-radius: 50%; background: #ff3d7f; flex: none; box-shadow: 0 0 0 2px rgba(255,61,127,.3); }
.card-host-live-dot.mode-podcast { background: #A05AFF; box-shadow: 0 0 0 2px rgba(160,90,255,.3); }
.card-title {
  font-size: 11px; color: rgba(255,255,255,.75); line-height: 1.35;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden; text-shadow: 0 1px 4px rgba(0,0,0,.7);
}
.card-watchers { display: flex; align-items: center; margin-top: 6px; gap: 2px; }
.card-watcher-dot { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.5); margin-left: -4px; object-fit: cover; background: var(--surface-2); }
.card-watcher-dot:first-child { margin-left: 0; }
.card-watchers-label { font-size: 9.5px; color: rgba(255,255,255,.5); margin-left: 6px; font-weight: 700; }

.empty-live { grid-column: 1 / -1; text-align: center; padding: 56px 20px; color: var(--text-dim); }
.empty-live .icon { font-size: 40px; margin-bottom: 12px; }
.empty-live h3 { font-size: 16px; font-weight: 700; margin-bottom: 6px; color: var(--text); }
.empty-live p { font-size: 13px; line-height: 1.5; }

.go-live-fab {
  position: fixed; bottom: 80px; right: 20px; z-index: 99;
  display: flex; align-items: center; gap: 8px;
  background: linear-gradient(135deg, #ff3d7f, #c2185b);
  color: #fff; border: none; border-radius: 28px;
  padding: 14px 20px; font-size: 14px; font-weight: 800;
  box-shadow: 0 8px 24px rgba(255,61,127,.45);
  cursor: pointer; text-decoration: none; letter-spacing: .01em;
  transition: transform .2s, box-shadow .2s;
}
.go-live-fab:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(255,61,127,.55); }
.fab-dot { width: 8px; height: 8px; border-radius: 50%; background: #fff; animation: pulse-dot 1.2s infinite; }

.promo-banner {
  margin: 0 14px 18px; padding: 16px; border-radius: 16px;
  background: linear-gradient(135deg, rgba(255,200,87,.14), rgba(255,61,127,.1));
  border: 1px solid rgba(255,200,87,.2);
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.promo-text h3 { font-size: 13.5px; margin-bottom: 3px; }
.promo-text p { font-size: 12px; color: var(--text-dim); }
.btn-sm { padding: 8px 14px; border-radius: 12px; font-size: 12px; font-weight: 800; border: none; cursor: pointer; white-space: nowrap; background: #ffc857; color: #0a0710; }

.skeleton-card {
  border-radius: 18px; aspect-ratio: 9/16;
  background: linear-gradient(90deg, var(--surface) 25%, var(--surface-2) 50%, var(--surface) 75%);
  background-size: 200% 100%; animation: shimmer 1.5s infinite;
}
@keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
</style>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>vConnect — Payment Result</title>
<style>
* { box-sizing: border-box; }

.result-screen {
  min-height: 100vh;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 24px; text-align: center;
}
.result-icon {
  width: 84px; height: 84px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 40px; margin-bottom: 20px;
}
.result-icon.pending  { background: rgba(255,157,0,.12); }
.result-icon.success  { background: rgba(0,217,181,.12); }
.result-icon.failed   { background: rgba(255,61,127,.12); }

.result-title { font-size: 20px; font-weight: 800; margin-bottom: 8px; }
.result-sub   { font-size: 13.5px; color: var(--text-dim); max-width: 320px; line-height: 1.5; margin-bottom: 28px; }

.result-spinner {
  width: 20px; height: 20px; border: 2.5px solid var(--border);
  border-top-color: var(--magenta); border-radius: 50%;
  animation: spin .8s linear infinite; margin-bottom: 20px;
}
@keyframes spin { to { transform: rotate(360deg); } }

.result-btn {
  height: 50px; padding: 0 28px; border-radius: 14px;
  background: linear-gradient(135deg, #ff3d7f, #c2185b);
  color: #fff; border: none; font-size: 14.5px; font-weight: 800;
  cursor: pointer; text-decoration: none; display: inline-flex;
  align-items: center; justify-content: center;
}
.result-ref {
  margin-top: 18px; font-size: 11px; color: var(--text-dim);
  font-family: monospace; word-break: break-all; max-width: 320px;
}
</style>
  <script type="module" crossorigin src="/assets/success-CKo7AYYo.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/app-CDuEJM5E.js">
  <link rel="stylesheet" crossorigin href="/assets/style-DeXY1gmE.css">
</head>
<body>
<div class="app-shell">
  <div class="result-screen" id="result-screen">
    <div class="result-spinner"></div>
    <div class="result-title">Confirming your payment…</div>
    <div class="result-sub">This usually takes just a few seconds. Please don't close this page.</div>
  </div>
</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lovio — Leaderboard</title>
<style>
.lb-topbar {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 16px 12px; position: sticky; top: 0; z-index: 10;
  background: var(--bg); border-bottom: 1px solid var(--border);
  backdrop-filter: blur(16px);
}
.lb-topbar h1 { font-size: 19px; font-weight: 900; flex: 1; letter-spacing: -.3px; }
.back-btn {
  width: 38px; height: 38px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: var(--surface); border: 1px solid var(--border);
  color: var(--text); cursor: pointer; text-decoration: none; flex: none;
}

/* Hero: your own rank card */
.lb-my-rank {
  margin: 14px 16px 0;
  background: linear-gradient(135deg, rgba(255,61,127,.14), rgba(160,90,255,.10));
  border: 1px solid rgba(255,61,127,.25);
  border-radius: 20px; padding: 16px 18px;
  display: flex; align-items: center; gap: 14px;
}
.lb-my-rank img {
  width: 46px; height: 46px; border-radius: 50%; object-fit: cover;
  border: 2px solid var(--magenta); flex: none;
}
.lb-my-rank .info { flex: 1; min-width: 0; }
.lb-my-rank .lbl { font-size: 11px; color: var(--text-dim); font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
.lb-my-rank .val { font-size: 17px; font-weight: 900; margin-top: 2px; }
.lb-my-rank .rank-badge {
  flex: none; text-align: center; background: rgba(255,255,255,.06);
  border: 1px solid var(--border); border-radius: 14px; padding: 8px 14px;
}
.lb-my-rank .rank-badge .num { font-size: 18px; font-weight: 900; color: #ffc857; }
.lb-my-rank .rank-badge .sub { font-size: 9.5px; color: var(--text-dim); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }

/* Type tabs: Top Gifters / Top Hosts / Biggest Gifts */
.lb-type-tabs {
  display: flex; gap: 8px; padding: 16px 16px 4px; overflow-x: auto; scrollbar-width: none;
}
.lb-type-tabs::-webkit-scrollbar { display: none; }
.lb-type-tab {
  flex: 0 0 auto; padding: 9px 16px; border-radius: 20px;
  font-size: 12.5px; font-weight: 800; cursor: pointer;
  background: var(--surface); border: 1px solid var(--border);
  color: var(--text-dim); transition: all .18s; white-space: nowrap;
}
.lb-type-tab.active { background: var(--magenta); border-color: var(--magenta); color: #fff; }

/* Period chips */
.lb-period-row { display: flex; gap: 7px; padding: 10px 16px 4px; overflow-x: auto; scrollbar-width: none; }
.lb-period-row::-webkit-scrollbar { display: none; }
.lb-period-chip {
  flex: 0 0 auto; padding: 6px 13px; border-radius: 16px;
  font-size: 11.5px; font-weight: 700; cursor: pointer;
  background: transparent; border: 1px solid var(--border);
  color: var(--text-dim); transition: all .15s; white-space: nowrap;
}
.lb-period-chip.active { background: rgba(255,200,87,.15); border-color: #ffc857; color: #ffc857; }

/* Direction toggle (biggest gifts only) */
.lb-direction-row { display: none; gap: 8px; padding: 8px 16px 0; }
.lb-direction-row.show { display: flex; }
.lb-direction-btn {
  flex: 1; padding: 8px; border-radius: 12px; font-size: 12px; font-weight: 800;
  background: var(--surface); border: 1px solid var(--border); color: var(--text-dim); cursor: pointer;
}
.lb-direction-btn.active { background: rgba(0,217,181,.12); border-color: #00d9b5; color: #00d9b5; }

/* List */
.lb-list { padding: 14px 12px 100px; }
.lb-row {
  display: flex; align-items: center; gap: 12px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 16px; padding: 12px 14px; margin-bottom: 8px;
  cursor: pointer; transition: transform .15s, box-shadow .15s;
}
.lb-row:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(0,0,0,.18); }
.lb-row.me { border-color: var(--magenta); background: rgba(255,61,127,.06); }
.lb-rank-num {
  flex: none; width: 30px; text-align: center; font-size: 15px; font-weight: 900; color: var(--text-dim);
}
.lb-rank-num.top1 { color: #ffd54f; font-size: 20px; }
.lb-rank-num.top2 { color: #cfd8dc; font-size: 18px; }
.lb-rank-num.top3 { color: #ff9d5c; font-size: 17px; }
.lb-row img { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; flex: none; border: 2px solid var(--border); }
.lb-row .name-block { flex: 1; min-width: 0; }
.lb-row .name-block strong { font-size: 14px; font-weight: 800; display: flex; align-items: center; gap: 4px; }
.lb-row .name-block small { font-size: 11.5px; color: var(--text-dim); }
.lb-row .coins { flex: none; text-align: right; }
.lb-row .coins .amt { font-size: 14.5px; font-weight: 900; color: #ffc857; }
.lb-row .coins .amt::after { content: " 🪙"; }
.lb-row .coins .sub { font-size: 10px; color: var(--text-dim); }
.verified-dot-sm {
  width: 13px; height: 13px; border-radius: 50%; background: var(--teal, #00d9b5);
  display: inline-flex; align-items: center; justify-content: center; flex: none;
}
.verified-dot-sm svg { width: 8px; height: 8px; color: #fff; }

.lb-gift-row { display: flex; align-items: center; gap: 6px; }
.lb-gift-emoji { font-size: 20px; flex: none; }

.empty-lb { text-align: center; padding: 60px 20px; color: var(--text-dim); }
.empty-lb .icon { font-size: 40px; margin-bottom: 12px; }

.skel-lb-row {
  height: 66px; border-radius: 16px; margin-bottom: 8px;
  background: linear-gradient(90deg, var(--surface) 25%, var(--surface-2) 50%, var(--surface) 75%);
  background-size: 200% 100%; animation: lb-shimmer 1.5s infinite;
}
@keyframes lb-shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
</style>

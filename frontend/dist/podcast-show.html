<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lovio — Show</title>
<style>
/* ══════════════════════════════════════════
   PODCAST SHOW PAGE  — v2
══════════════════════════════════════════ */

/* ── hero ── */
.show-hero {
  position: relative; overflow: hidden;
  min-height: 280px; display: flex; align-items: flex-end;
}
.hero-bg {
  position: absolute; inset: 0;
  background-size: cover; background-position: center;
  filter: blur(32px) brightness(.25) saturate(1.6);
  transform: scale(1.15);
}
.hero-gradient {
  position: absolute; inset: 0;
  background: linear-gradient(to bottom, transparent 30%, rgba(0,0,0,.7) 100%);
}
.hero-inner {
  position: relative; z-index: 2;
  width: 100%; padding: 24px 18px 22px;
  display: flex; gap: 16px; align-items: flex-end;
}
.hero-cover {
  width: 100px; height: 100px; border-radius: 18px;
  object-fit: cover; flex: none;
  border: 2px solid rgba(255,255,255,.2);
  box-shadow: 0 10px 36px rgba(0,0,0,.5);
}
.hero-info { flex: 1; min-width: 0; }
.hero-cat {
  font-size: 10px; font-weight: 800; letter-spacing: .08em;
  text-transform: uppercase; color: #ff3d7f; margin-bottom: 5px;
}
.hero-title {
  font-size: 20px; font-weight: 900; line-height: 1.2; margin-bottom: 4px;
  text-shadow: 0 2px 8px rgba(0,0,0,.6);
}
.hero-host { font-size: 12px; color: rgba(255,255,255,.7); margin-bottom: 10px; }
.hero-stats { display: flex; gap: 16px; margin-bottom: 14px; font-size: 11.5px; color: rgba(255,255,255,.65); }
.hero-stats strong { color: #fff; font-size: 13px; }
.hero-btns { display: flex; gap: 8px; }
.follow-btn {
  padding: 9px 22px; border-radius: 22px; font-size: 12.5px; font-weight: 800;
  border: none; cursor: pointer; transition: all .15s;
  background: linear-gradient(135deg,#ff3d7f,#a05aff); color: #fff;
  box-shadow: 0 4px 14px rgba(255,61,127,.35);
}
.follow-btn:active { transform: scale(.93); }
.follow-btn.following {
  background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.3);
  color: #fff; box-shadow: none;
}
.gift-host-btn {
  padding: 9px 16px; border-radius: 22px; font-size: 12.5px; font-weight: 800;
  border: 1px solid rgba(255,255,255,.25); cursor: pointer;
  background: rgba(255,255,255,.1); color: #fff;
  transition: background .15s;
}
.gift-host-btn:hover { background: rgba(255,255,255,.18); }

/* ── sticky mini player ── */
.mini-player {
  position: sticky; top: 0; z-index: 30;
  background: var(--surface); border-bottom: 1px solid var(--border);
  display: none;
}
.mini-player.on { display: block; }
.mp-inner { padding: 8px 14px; }
.mp-row1 { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.mp-cover {
  width: 38px; height: 38px; border-radius: 8px;
  object-fit: cover; flex: none; background: var(--surface-2);
}
.mp-info { flex: 1; min-width: 0; }
.mp-title {
  font-size: 12.5px; font-weight: 800;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.mp-time { font-size: 10px; color: var(--text-dim); }
.mp-ctrls { display: flex; align-items: center; gap: 6px; }
.mp-btn {
  width: 32px; height: 32px; border-radius: 50%; flex: none;
  background: rgba(255,255,255,.07); border: 1px solid var(--border);
  color: var(--text); cursor: pointer; font-size: 12px;
  display: flex; align-items: center; justify-content: center;
  transition: background .15s, transform .1s;
}
.mp-btn:active { transform: scale(.86); }
.mp-btn.pp {
  width: 38px; height: 38px; font-size: 14px;
  background: linear-gradient(135deg,#ff3d7f,#a05aff);
  border: none; color: #fff;
}
.mp-speed {
  background: rgba(255,255,255,.07); border: 1px solid var(--border);
  border-radius: 7px; padding: 2px 7px; font-size: 10px;
  font-weight: 800; color: var(--text); cursor: pointer;
}
.mp-prog {
  width: 100%; height: 3px; accent-color: #ff3d7f; cursor: pointer;
  -webkit-appearance: none; appearance: none;
  background: linear-gradient(to right,#ff3d7f 0%,var(--border) 0%);
  border-radius: 2px; outline: none;
}

/* ── tabs ── */
.show-tabs {
  display: flex; border-bottom: 1px solid var(--border);
  background: var(--bg); position: sticky; top: 0; z-index: 20;
}
.show-tab {
  flex: 1; padding: 11px 8px; font-size: 12.5px; font-weight: 700;
  color: var(--text-dim); border-bottom: 2px solid transparent;
  cursor: pointer; text-align: center; transition: color .2s;
}
.show-tab.active { color: var(--text); border-bottom-color: #ff3d7f; }
.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* ── episode rows ── */
.ep-list { padding: 0 0 100px; }
.ep-row {
  display: flex; gap: 12px; align-items: flex-start;
  padding: 14px 16px; border-bottom: 1px solid var(--border);
  cursor: pointer; transition: background .15s;
}
.ep-row:hover { background: rgba(255,255,255,.03); }
.ep-row.now-playing { background: rgba(255,61,127,.06); }
.ep-num {
  width: 24px; font-size: 11.5px; color: var(--text-dim);
  text-align: center; padding-top: 3px; flex: none;
  font-variant-numeric: tabular-nums;
}
.ep-row.now-playing .ep-num { color: #ff3d7f; font-weight: 800; }
.ep-main { flex: 1; min-width: 0; }
.ep-row-title {
  font-size: 13.5px; font-weight: 700; margin-bottom: 3px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.ep-row.now-playing .ep-row-title { color: #ff3d7f; }
.ep-row-meta { font-size: 11px; color: var(--text-dim); margin-bottom: 5px; display: flex; gap: 10px; flex-wrap: wrap; }
.ep-row-desc {
  font-size: 12px; color: var(--text-dim); line-height: 1.5;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  margin-bottom: 8px;
}
.ep-row-acts { display: flex; gap: 6px; }
.ep-mini {
  display: inline-flex; align-items: center; gap: 3px;
  background: rgba(255,255,255,.05); border: 1px solid var(--border);
  border-radius: 12px; padding: 4px 10px; font-size: 11px; font-weight: 600;
  color: var(--text-dim); cursor: pointer; transition: background .15s;
}
.ep-mini:hover { background: rgba(255,255,255,.1); color: var(--text); }
.ep-mini.liked { color: #ff3d7f; border-color: rgba(255,61,127,.25); background: rgba(255,61,127,.06); }
.ep-play-col { display: flex; align-items: center; justify-content: center; width: 38px; flex: none; }
.ep-play-circle {
  width: 38px; height: 38px; border-radius: 50%; flex: none;
  background: rgba(255,255,255,.08); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; cursor: pointer; color: var(--text);
  transition: background .15s, transform .1s;
}
.ep-play-circle:active { transform: scale(.86); }
.ep-row.now-playing .ep-play-circle {
  background: linear-gradient(135deg,#ff3d7f,#a05aff);
  border: none; color: #fff;
}

/* ── about tab ── */
.about-pad { padding: 20px 16px 100px; }
.about-text { font-size: 13.5px; line-height: 1.75; color: var(--text-dim); margin-bottom: 20px; }
.info-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 12px 0; border-bottom: 1px solid var(--border); font-size: 13px;
}
.info-row:last-child { border-bottom: none; }
.info-label { color: var(--text-dim); font-size: 12px; }

/* ── skeletons ── */
.skel-row { padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; gap: 12px; }
.skel-n { width: 20px; height: 12px; background: var(--surface-2); border-radius: 3px; animation: sk 1.6s infinite; margin-top: 3px; }
.skel-b { flex: 1; }
.skel-ln { height: 10px; background: var(--surface-2); border-radius: 4px; margin-bottom: 7px; animation: sk 1.6s infinite; }
.skel-ln.s { width: 60%; } .skel-ln.xs { width: 35%; }
@keyframes sk { 0%,100%{opacity:.35} 50%{opacity:.75} }

/* ── gift sheet ── */
.gift-bd { position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(6px);z-index:300;opacity:0;pointer-events:none;transition:opacity .22s; }
.gift-bd.open { opacity:1;pointer-events:auto; }
.gift-panel { position:fixed;left:0;right:0;bottom:-100%;max-width:480px;margin:0 auto;background:var(--surface);border-radius:24px 24px 0 0;z-index:301;padding:0 0 36px;transition:bottom .3s cubic-bezier(.34,1.26,.64,1);border-top:1px solid var(--border); }
.gift-panel.open { bottom:0; }
.gift-handle { width:36px;height:4px;background:var(--border);border-radius:2px;margin:12px auto 14px; }
.gift-head { display:flex;align-items:center;justify-content:space-between;padding:0 18px 6px; }
.gift-head h3 { font-size:14.5px;font-weight:800; }
.coin-badge { display:flex;align-items:center;gap:4px;background:rgba(255,200,87,.1);border:1px solid rgba(255,200,87,.2);border-radius:16px;padding:4px 10px;font-size:11.5px;font-weight:700;color:#ffc857; }
.gift-to { padding:0 18px 10px;font-size:12px;color:var(--text-dim); }
.gift-to strong { color:#ff3d7f; }
.gift-grid { display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 14px 14px;max-height:220px;overflow-y:auto;scrollbar-width:none; }
.gift-tile { display:flex;flex-direction:column;align-items:center;gap:3px;background:rgba(255,255,255,.05);border:1.5px solid transparent;border-radius:14px;padding:10px 5px;cursor:pointer;transition:border-color .15s,background .15s,transform .1s; }
.gift-tile:active { transform:scale(.9); }
.gift-tile.sel { border-color:#ff3d7f;background:rgba(255,61,127,.1); }
.g-emoji { font-size:22px; } .g-name { font-size:9px;font-weight:700;color:rgba(255,255,255,.75);text-align:center; } .g-price { font-size:9.5px;font-weight:800;color:#ffc857; }
.gift-send-btn { width:calc(100% - 28px);margin:0 14px;height:46px;border-radius:14px;font-size:13px;font-weight:800;border:none;cursor:pointer;background:linear-gradient(135deg,#ff3d7f,#c2185b);color:#fff;transition:opacity .2s; }
.gift-send-btn:disabled { opacity:.4;cursor:not-allowed; }

.empty-box { text-align:center;padding:60px 20px;color:var(--text-dim); }
.empty-box .ico { font-size:44px;display:block;margin-bottom:12px; }
</style>

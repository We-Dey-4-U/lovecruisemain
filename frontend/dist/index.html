<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>lovecruise — Welcome</title>
<style>
  .auth-hero{
    position:relative;
    height:280px;
    overflow:hidden;
    display:flex; align-items:flex-end;
    background:
      radial-gradient(circle at 30% 20%, rgba(255,61,127,0.5), transparent 55%),
      radial-gradient(circle at 80% 0%, rgba(0,217,181,0.35), transparent 50%),
      linear-gradient(180deg, #1C1426, #120D1A);
  }
  .auth-hero .orb{
    position:absolute; border-radius:50%; filter:blur(2px);
    animation:float 7s ease-in-out infinite;
  }
  .auth-hero .orb.o1{ width:54px; height:54px; background:radial-gradient(circle,#FF6F9C,#FF3D7F); top:30px; left:30px; animation-delay:0s; }
  .auth-hero .orb.o2{ width:30px; height:30px; background:radial-gradient(circle,#FFE08A,#FFC857); top:70px; right:50px; animation-delay:1.2s; }
  .auth-hero .orb.o3{ width:38px; height:38px; background:radial-gradient(circle,#5CFFE0,#00D9B5); bottom:90px; right:30px; animation-delay:2s; }
  @keyframes float{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-14px);} }
  .auth-hero-content{ padding:0 24px 26px; position:relative; z-index:2; }
  .auth-eyebrow{
    font-family:var(--font-mono); font-size:11.5px; color:var(--gold);
    letter-spacing:.12em; text-transform:uppercase; margin-bottom:10px; display:block;
  }
  .auth-hero h1{ font-size:30px; line-height:1.12; max-width:280px; }
  .auth-hero h1 span{ color:var(--magenta); }

  .auth-body{ padding:24px 24px 32px; flex:1; display:flex; flex-direction:column; }
  .auth-tabs{
    display:flex; background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius-pill); padding:4px; margin-bottom:24px;
  }
  .auth-tabs button{
    flex:1; border:none; background:transparent; color:var(--text-dim);
    font-weight:700; font-size:14px; padding:10px 0; border-radius:var(--radius-pill);
    transition:background .2s, color .2s;
  }
  .auth-tabs button.active{ background:var(--magenta); color:#1A0B12; }

  .auth-form{ display:none; }
  .auth-form.active{ display:block; animation:fadeIn .25s ease; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }

  .divider{ display:flex; align-items:center; gap:12px; color:var(--text-faint); font-size:12px; margin:22px 0; }
  .divider::before,.divider::after{ content:""; flex:1; height:1px; background:var(--border); }

  .oauth-row{ display:flex; gap:10px; }
  .oauth-btn{
    flex:1; display:flex; align-items:center; justify-content:center; gap:8px;
    background:var(--surface); border:1px solid var(--border); color:var(--text);
    padding:12px; border-radius:var(--radius-sm); font-weight:600; font-size:13.5px;
  }
  .oauth-btn:hover{ border-color:var(--text-dim); }
  .oauth-btn svg{ width:17px; height:17px; }

  .auth-footnote{ text-align:center; color:var(--text-faint); font-size:12px; margin-top:auto; padding-top:24px; }
  .auth-footnote a{ color:var(--gold); font-weight:600; }
</style>
  <script type="module" crossorigin src="/assets/index-B_vAc9xw.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/app-C0dFVt1v.js">
  <link rel="stylesheet" crossorigin href="/assets/style-Ch_tpJ14.css">
</head>
<body>
<div class="app-shell">
  <div class="screen no-tabbar">

    <div class="auth-hero">
      <span class="orb o1"></span>
      <span class="orb o2"></span>
      <span class="orb o3"></span>
      <div class="auth-hero-content">
        <span class="auth-eyebrow">Live · Chat · Earn</span>
        <h1>Go live, send <span>gifts</span>, build your circle.</h1>
      </div>
    </div>

    <div class="auth-body">
      <div class="auth-tabs">
        <button class="active" data-tab="login" onclick="switchAuthTab('login')">Log in</button>
        <button data-tab="signup" onclick="switchAuthTab('signup')">Sign up</button>
      </div>

      <!-- LOGIN -->
      <form class="auth-form active" id="login-form" onsubmit="return handleLogin(event)">
        <div class="field">
          <label for="login-email">Email</label>
         <input
         id="login-email"
           name="email"
           type="email"
             placeholder="you@example.com"
           required>
        </div>
        <div class="field">
          <label for="login-password">Password</label>
         <input
id="login-password"
name="password"
type="password"
placeholder="••••••••"
required
minlength="8">
        </div>
        <button class="btn btn-primary btn-block" type="submit">Log in</button>
      </form>

      <!-- SIGNUP -->
      <form class="auth-form" id="signup-form" onsubmit="return handleSignup(event)">
        <div class="field">
          <label for="signup-username">Username</label>
        <input id="signup-username"
name="username"
type="text"
placeholder="yourhandle"
required minlength="3">
        </div>
        <div class="field">
          <label for="signup-email">Email</label>
         <input id="signup-email"
name="email"
type="email"
placeholder="you@example.com"
required>
        </div>
        <div class="field">
          <label for="signup-password">Password</label>
        <input id="signup-password"
name="password"
type="password"
placeholder="At least 8 characters"
required minlength="8">
          <span class="field-hint">Use 8+ characters. We never share your password.</span>
        </div>
        <button class="btn btn-primary btn-block" type="submit">Create account</button>
      </form>

      <div class="divider">or continue with</div>
      <div class="oauth-row">
        <button class="oauth-btn" onclick="mockOAuth('Google')">
          <svg viewBox="0 0 24 24" fill="none"><path d="M22 12.2c0-.7-.06-1.4-.18-2H12v3.8h5.6a4.8 4.8 0 0 1-2.08 3.15v2.6h3.36C20.86 18 22 15.36 22 12.2Z" fill="#FFC857"/><path d="M12 22c2.7 0 4.97-.9 6.62-2.43l-3.36-2.6c-.93.63-2.13 1-3.26 1-2.5 0-4.62-1.7-5.38-3.97H3.16v2.65A10 10 0 0 0 12 22Z" fill="#00D9B5"/><path d="M6.62 13.99A5.99 5.99 0 0 1 6.3 12c0-.69.12-1.36.32-1.99V7.36H3.16A10 10 0 0 0 2 12c0 1.6.38 3.13 1.16 4.64l3.46-2.65Z" fill="#FF3D7F"/><path d="M12 5.98c1.47 0 2.78.5 3.82 1.49l2.86-2.86C16.96 2.99 14.7 2 12 2A10 10 0 0 0 3.16 7.36l3.46 2.65C7.38 7.74 9.5 5.98 12 5.98Z" fill="#F4F0FA"/></svg>
          Google
        </button>
        <button class="oauth-btn" onclick="mockOAuth('Facebook')">
          <svg viewBox="0 0 24 24" fill="none"><path d="M22 12.06C22 6.5 17.5 2 12 2S2 6.5 2 12.06C2 17.08 5.66 21.23 10.44 22v-7.03H7.9v-2.9h2.54V9.85c0-2.5 1.49-3.89 3.77-3.89 1.1 0 2.24.2 2.24.2v2.46h-1.26c-1.24 0-1.63.77-1.63 1.56v1.88h2.78l-.45 2.9h-2.33V22C18.34 21.23 22 17.08 22 12.06Z" fill="#00D9B5"/></svg>
          Facebook
        </button>
      </div>

      <p class="auth-footnote">By continuing you agree to vConnect's <a href="#">Terms</a> &amp; <a href="#">Privacy Policy</a>.</p>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Post Viewer</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:Inter, sans-serif;
}

.viewer{
  height:100vh;
  display:flex;
  flex-direction:column;
}

.topbar{
  padding:12px;
  display:flex;
  align-items:center;
  gap:10px;
  background:rgba(0,0,0,0.6);
  position:sticky;
  top:0;
}

.back{
  background:none;
  border:none;
  color:#fff;
  font-size:18px;
  cursor:pointer;
}

.slider{
  flex:1;
  display:flex;
  overflow-x:auto;
  scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch;
}

.slide{
  min-width:100%;
  height:100%;
  scroll-snap-align:center;
  display:flex;
  align-items:center;
  justify-content:center;
}

.slide img,
.slide video{
  width:100%;
  height:100%;
  object-fit:contain;
}

.counter{
  position:absolute;
  bottom:20px;
  right:20px;
  background:rgba(0,0,0,0.5);
  padding:6px 12px;
  border-radius:20px;
  font-size:13px;
}

</style>
  <script type="module" crossorigin src="/assets/post-CAhLtMYX.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/app-C0dFVt1v.js">
  <link rel="stylesheet" crossorigin href="/assets/style-Ch_tpJ14.css">
</head>

<body>

<div class="viewer">

  <div class="topbar">
    <button class="back" onclick="history.back()">←</button>
    <div id="title">Post</div>
  </div>

  <div class="slider" id="slider"></div>

  <div class="counter" id="counter"></div>

</div>

<!-- AFTER -->

</body>
</html>

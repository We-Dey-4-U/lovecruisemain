<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>vConnect — Withdraw Earnings</title>
<link rel="stylesheet" href="css/style.css">
<style>
* { box-sizing: border-box; }

.wd-topbar { display: flex; align-items: center; gap: 12px; padding: 16px 20px 10px; }
.wd-topbar h1 { font-size: 19px; font-weight: 800; flex: 1; }

.wd-hero {
  margin: 8px 20px 6px;
  background: linear-gradient(135deg, rgba(0,217,181,.14), rgba(255,200,87,.1));
  border: 1px solid rgba(0,217,181,.3);
  border-radius: 20px; padding: 20px; text-align: center;
}
.wd-hero .lbl { font-size: 12px; color: var(--text-dim); font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
.wd-hero .amt { font-size: 32px; font-weight: 900; margin-top: 6px; color: #00d9b5; }

.wd-breakdown { display: flex; gap: 10px; margin: 14px 20px 4px; }
.wd-breakdown .b-card { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 12px; text-align: center; }
.wd-breakdown .b-icon { font-size: 16px; }
.wd-breakdown .b-lbl { font-size: 10.5px; color: var(--text-dim); font-weight: 700; margin-top: 4px; }
.wd-breakdown .b-amt { font-size: 15px; font-weight: 900; margin-top: 2px; }
.wd-breakdown .gift .b-amt { color: #ff3d7f; }
.wd-breakdown .market .b-amt { color: #00d9b5; }

.section-label { padding: 18px 20px 10px; font-size: 13px; font-weight: 800; color: var(--text-dim); text-transform: uppercase; letter-spacing: .05em; }

.wd-form { padding: 0 20px; }
.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: 11px; font-weight: 800; color: var(--text-dim); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 7px; }
.form-group input, .form-group select { width: 100%; box-sizing: border-box; background: var(--surface); border: 1.5px solid var(--border); border-radius: 14px; color: var(--text); font-size: 14px; padding: 11px 14px; outline: none; font-family: inherit; }
.form-group input:focus, .form-group select:focus { border-color: var(--magenta); }
.form-hint { font-size: 11.5px; color: var(--text-dim); margin-top: 6px; line-height: 1.5; }

.wd-submit-btn {
  width: calc(100% - 40px); margin: 8px 20px 0; height: 50px; border-radius: 16px; border: none;
  background: linear-gradient(135deg, #00d9b5, #00a98e); color: #00231d; font-size: 14.5px; font-weight: 800; cursor: pointer;
}
.wd-submit-btn:disabled { opacity: .45; cursor: not-allowed; }

.wd-history-section { margin-top: 24px; }
.wd-history-row {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
  padding: 12px 14px; margin: 0 20px 10px;
}
.wd-history-row .h-info { font-size: 12.5px; }
.wd-history-row .h-info .h-amt { font-weight: 800; font-size: 14px; }
.wd-history-row .h-info .h-sub { color: var(--text-dim); font-size: 11px; margin-top: 2px; }
.pill { display: inline-block; font-size: 10.5px; font-weight: 800; padding: 3px 10px; border-radius: 10px; text-transform: uppercase; letter-spacing: .03em; }
.pill-pending { background: rgba(255,200,87,.15); color: #ffc857; }
.pill-approved, .pill-paid { background: rgba(0,217,181,.15); color: #00d9b5; }
.pill-rejected { background: rgba(255,68,85,.15); color: #ff4455; }
.wd-empty { text-align: center; padding: 30px 20px; color: var(--text-dim); font-size: 13px; }

.toast {
  position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
  background: rgba(0,0,0,.88); color: #fff; padding: 10px 20px; border-radius: 20px;
  font-size: 13px; font-weight: 600; z-index: 200; opacity: 0; pointer-events: none;
  transition: opacity .25s; white-space: nowrap;
}
.toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="app-shell">
  <div class="screen" style="padding-bottom: 60px;">

    <div class="wd-topbar">
      <button class="icon-btn" id="backBtn" aria-label="Back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
      </button>
      <h1>Withdraw Earnings</h1>
    </div>

    <div class="wd-hero">
      <div class="lbl">Total Withdrawable</div>
      <div class="amt">🪙 <span id="total-earnings">0</span></div>
    </div>

    <div class="wd-breakdown">
      <div class="b-card gift">
        <div class="b-icon">🎁</div>
        <div class="b-lbl">From gifts</div>
        <div class="b-amt" id="gift-earnings">0</div>
      </div>
      <div class="b-card market">
        <div class="b-icon">🛍️</div>
        <div class="b-lbl">From marketplace</div>
        <div class="b-amt" id="market-earnings">0</div>
      </div>
    </div>

    <div class="section-label">Request a withdrawal</div>
    <div class="wd-form">
      <div class="form-group">
        <label>Amount (coins)</label>
        <input type="number" id="wd-amount" placeholder="e.g. 5000" min="1">
        <div class="form-hint" id="wd-amount-hint">You can withdraw up to your total earnings balance.</div>
      </div>
      <div class="form-group">
        <label>Currency</label>
        <select id="wd-currency">
          <option value="NGN">NGN (₦)</option>
          <option value="USD">USD ($)</option>
        </select>
      </div>
      <div class="form-group"><label>Bank name</label><input type="text" id="wd-bank-name" placeholder="e.g. GTBank"></div>
      <div class="form-group"><label>Account name</label><input type="text" id="wd-account-name" placeholder="Name on the account"></div>
      <div class="form-group"><label>Account number</label><input type="text" id="wd-account-number" placeholder="0123456789"></div>
    </div>

    <button class="wd-submit-btn" id="wd-submit-btn">Submit withdrawal request</button>

    <div class="wd-history-section">
      <div class="section-label">Past requests</div>
      <div id="wd-history-list"><div class="wd-empty">Loading…</div></div>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import "./js/api.js";
import "./js/app.js";

if (!requireAuthOrRedirect()) { throw new Error("auth required"); }

let TOTAL_EARNINGS = 0;

document.getElementById("backBtn")?.addEventListener("click", () => history.back());

async function loadSummary() {
  try {
    const res = await window.api.request("/wallet/earnings-summary");
    const { giftEarnings = 0, marketplaceEarnings = 0, totalEarnings = 0 } = res.data || {};
    TOTAL_EARNINGS = totalEarnings;
    document.getElementById("gift-earnings").textContent   = formatCoins(giftEarnings);
    document.getElementById("market-earnings").textContent = formatCoins(marketplaceEarnings);
    document.getElementById("total-earnings").textContent  = formatCoins(totalEarnings);
    document.getElementById("wd-amount-hint").textContent  =
      `You can withdraw up to ${formatCoins(totalEarnings)} 🪙 (your combined gift + marketplace earnings).`;
  } catch (err) {
    console.warn("[withdrawal] could not load earnings summary:", err);
    const legacy = Number(window.CURRENT_USER?.earningsBalance ?? window.CURRENT_USER?.earnings_balance ?? 0);
    TOTAL_EARNINGS = legacy;
    document.getElementById("gift-earnings").textContent   = "—";
    document.getElementById("market-earnings").textContent = "—";
    document.getElementById("total-earnings").textContent  = formatCoins(legacy);
  }
}

async function loadHistory() {
  const list = document.getElementById("wd-history-list");
  try {
    // Assumes a user-facing GET /withdrawals/mine endpoint alongside the
    // existing admin /admin/withdrawals management routes.
    const res = await window.api.request("/withdrawals/mine");
    const rows = res.data || [];
    if (!rows.length) { list.innerHTML = `<div class="wd-empty">No withdrawal requests yet</div>`; return; }
    list.innerHTML = rows.map(w => `
      <div class="wd-history-row">
        <div class="h-info">
          <div class="h-amt">🪙 ${formatCoins(w.coins_requested)}</div>
          <div class="h-sub">${escapeHtml(w.bank_name || "")} · ${timeAgo(w.created_at)} ago</div>
        </div>
        <span class="pill pill-${w.status}">${escapeHtml(w.status)}</span>
      </div>`).join("");
  } catch (err) {
    list.innerHTML = `<div class="wd-empty">Couldn't load withdrawal history</div>`;
  }
}

document.getElementById("wd-submit-btn").addEventListener("click", async () => {
  const amount        = Number(document.getElementById("wd-amount").value);
  const currency      = document.getElementById("wd-currency").value;
  const bankName      = document.getElementById("wd-bank-name").value.trim();
  const accountName   = document.getElementById("wd-account-name").value.trim();
  const accountNumber = document.getElementById("wd-account-number").value.trim();

  if (!amount || amount <= 0) return showToast("Enter a valid amount");
  if (amount > TOTAL_EARNINGS) return showToast("Amount exceeds your withdrawable balance");
  if (!bankName || !accountName || !accountNumber) return showToast("Fill in all bank details");

  const btn = document.getElementById("wd-submit-btn");
  btn.disabled = true; btn.textContent = "Submitting…";
  try {
    await window.api.request("/withdrawals", {
      method: "POST",
      body: JSON.stringify({
        coinsRequested: amount,
        currency,
        bankName,
        bankAccountName: accountName,
        bankAccountNumber: accountNumber,
      }),
    });
    showToast("Withdrawal request submitted ✓");
    document.getElementById("wd-amount").value = "";
    document.getElementById("wd-bank-name").value = "";
    document.getElementById("wd-account-name").value = "";
    document.getElementById("wd-account-number").value = "";
    loadHistory();
    loadSummary();
  } catch (err) {
    showToast(err.message || "Could not submit request");
  } finally {
    btn.disabled = false; btn.textContent = "Submit withdrawal request";
  }
});

loadSummary();
loadHistory();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>vConnect — Live</title>
<link rel="stylesheet" href="css/style.css">
<style>
/* ============================================================
   vConnect Social Live — SECTIONED REDESIGN (v9: seat-grid overflow fix,
   bigger self-controls, sharper edges)
   ------------------------------------------------------------
   Pure UI/UX redesign. No WebRTC / mediasoup / Socket.IO / room /
   seat-assignment / mute-kick logic lives here or was changed.
   Every id/class js/live.js and js/live-mic-ring.js read or write
   still exists under the exact same name.

   ROOT CAUSE FOUND IN v8: the "Host"/"Guests"/"Mic Seats" caption
   (.section-label) and the host name+pulse-dot tag (.stage-label)
   were both normal block-flow elements sitting ABOVE/BELOW the
   frame inside the same flex column. Every pixel of their own
   height was a pixel the frame itself did NOT get, even though the
   frame was already "100% of its section" — that 100% was 100% of
   whatever was left over after the labels, not 100% of the section.

   FIX: both are now `position: absolute` overlay badges (the same
   technique the Male/Female guest-tag already used) — floating on
   top of the frame/section instead of taking their own row:
     - .section-label: small pill, top-left of the section.
     - .stage-label (host name): small pill, bottom-left of the
       host frame itself.
   Neither reserves any flow height anymore, so .host-card-wrap /
   .guest-frames / #participants-strip — each still the sole
   flex:1 child of its section — now expand to the section's FULL
   height, and the frames inside them (already height:100%) follow
   suit. That's what lets the host frame's top edge sit right at
   the divider under the header, and the guest frames' top edge
   sit right at the divider under the host section.

   WHOLE BLOCK ALSO PUSHED UP (more room for chat):
     .host-section   34dvh → 30dvh
     .guest-section  24dvh → 20dvh
     .seats-section  20dvh → 18dvh
   Even with these section heights trimmed, the frames read as
   BIGGER than before, because they're no longer sharing that
   space with a label row. Short-viewport breakpoint (max-height:
   640px) rescaled to match: host 26dvh, guest 17dvh, seats 15dvh.

   .stage stays flex:0 0 auto so none of this is undone by chat
   content — host/guest/seats always get their exact fixed height;
   only chat scrolls.

   ------------------------------------------------------------
   v9 CHANGES (this pass — 3 fixes, all CSS-only, no DOM/JS contract
   touched):

   1) SEAT GRID OVERFLOWING PAST THE RIGHT EDGE ON SMALL SCREENS
      ROOT CAUSE: .seat-slot-frame used `width: auto; height: 100%;
      aspect-ratio: 1/1; max-width: 100%`. Because HEIGHT was the
      definite side, aspect-ratio computed WIDTH from it — and that
      computed width could be wider than the seat's actual grid
      column (1/6 of a narrow phone width minus gaps). max-width:100%
      only clamps against the *frame's own* box, not the column, so
      on narrow screens every seat became slightly too wide and the
      last column(s) got pushed clean off the right edge of the
      screen instead of just looking a bit stretched.
      FIX: flipped which side is definite. Now `width: 100%; height:
      auto; aspect-ratio: 1/1; max-height: 100%`. Width is always
      exactly the grid column's width (can never exceed it, so
      nothing can push past the right edge), and aspect-ratio derives
      height from that, clamped by max-height so it can't blow out
      the row either. Also switched the grid's columns/rows from
      `repeat(6, 1fr)` to `repeat(6, minmax(0, 1fr))` (and added
      `min-width: 0` to .seat-slot) — a standard grid-blowout
      safeguard so a track can never grow past its fair share because
      of a child's intrinsic size, belt-and-braces with the fix above.

   2) MUTE / LEAVE BUTTONS TOO SMALL & TOO CLOSE ON SEATS
      They were 15x15px with only 2px between them — an easy
      mis-tap that leaves the seat when the user only meant to mute.
      Bumped to 21x21px with 7px gap, larger icons, and moved the
      row down slightly so it still clears the avatar circle. Also
      grew the seat-mute-indicator dot to match.

   3) EDGES LOOKED DULL — SHARPENED
      Border alpha values across host frame / guest frames / seat
      circles were quite low (.25–.4), reading as soft/hazy at small
      sizes. Raised the base + occupied border opacity, thickened
      seat borders from 2px to 2.5px, and added a crisp 1px inner
      highlight (inset box-shadow) alongside the outer glow so edges
      read as bright, defined lines instead of a soft haze — done
      purely via border-color/box-shadow, no layout impact.
   ============================================================ */
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --accent: #9D5CFF;
  --accent-2: #FF3D7F;
  --bg-0: #08050F;
  --bg-1: #0d0718;
  --bg-2: #120a1f;
  --line: rgba(157,92,255,.14);
  --radius-lg: 16px;
  --radius-md: 12px;
  --radius-sm: 9px;
  --gap: clamp(6px, 1.8vw, 11px);
}

body, .app-shell, .live-screen {
  height: 100dvh; overflow: hidden; background: var(--bg-0);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

.live-screen {
  position: relative; width: 100%; max-width: 480px; margin: 0 auto;
  display: flex; flex-direction: column; height: 100dvh;
  background: var(--bg-0); overflow: hidden;
}

/* ══════════════════════════
   SECTION 1 — HEADER (single compact row for everyone; host-only
   controls used to live here as a second row — they now live
   beside the host frame instead, see #host-controls below)
══════════════════════════ */
.live-header {
  flex: 0 0 auto;
  display: flex; flex-direction: column; gap: 4px;
  padding: 6px 10px 6px;
  background: var(--bg-1);
  border-bottom: 1px solid var(--line);
}

.header-row { display: flex; align-items: center; gap: 6px; width: 100%; }
.header-row-top { justify-content: space-between; }

.host-chip { display: flex; align-items: center; gap: 6px; min-width: 0; flex: 1 1 auto; }
.host-chip img {
  width: 24px; height: 24px; border-radius: 50%;
  border: 1.5px solid rgba(255,61,127,.6); object-fit: cover; flex: none; cursor: pointer;
}
.host-chip .ht { min-width: 0; }
.host-chip .name {
  display: block; font-size: 11px; font-weight: 800; color: #fff;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 24vw;
}
.host-chip .sub { font-size: 8.5px; color: rgba(255,255,255,.55); }

.follow-btn {
  flex: none; background: linear-gradient(135deg,#FF3D7F,#9D5CFF); color: #fff; border: none;
  border-radius: 12px; padding: 3px 8px; font-size: 10px;
  font-weight: 800; cursor: pointer; transition: transform .15s; white-space: nowrap;
}
.follow-btn:active { transform: scale(.94); }
.follow-btn.active { background: rgba(255,255,255,.16); }

.header-top-right { display: flex; align-items: center; gap: 5px; flex: none; }

.live-badge {
  display: flex; align-items: center; gap: 3px;
  background: linear-gradient(135deg,#FF3D7F,#9D5CFF);
  border-radius: 10px; padding: 3px 7px;
  color: #fff; font-size: 8.5px; font-weight: 900; letter-spacing: .05em; white-space: nowrap;
}
.live-badge .dot { width: 4px; height: 4px; border-radius: 50%; background: #fff; animation: pulse-anim 1.4s infinite; }
@keyframes pulse-anim { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.75)} }

.live-timer { font-size: 9.5px; font-weight: 700; color: rgba(255,255,255,.8); white-space: nowrap; }

.viewer-chip {
  display: flex; align-items: center; gap: 3px;
  background: rgba(255,255,255,.08); border: none;
  border-radius: 10px; padding: 3px 7px;
  color: #fff; font-size: 9.5px; font-weight: 700; cursor: pointer;
}
#network-badge {
  font-size: 8px; font-weight: 900; padding: 2px 5px;
  border-radius: 6px; background: rgba(0,200,100,.7); color: #fff; white-space: nowrap;
}
.close-btn {
  width: 22px; height: 22px; border-radius: 50%;
  background: rgba(255,255,255,.08);
  display: flex; align-items: center; justify-content: center;
  color: #fff; border: none; cursor: pointer; flex: none;
}

/* top gifters strip — kept in the DOM (for anything that reads
   #top-gifters) but hidden by default so the header stays exactly
   one visible row and doesn't eat extra vertical space. */
.top-gifters-row { display: none; }

/* ══════════════════════════
   STAGE — wraps host / guest / seat blocks. Kept as #arena for
   js/live.js's DOM contract. Each stage-section gets an explicit
   dvh-based height so host + guests + all 12 seats are ALWAYS
   simultaneously visible with no scrolling here — only the chat
   section below scrolls internally.
══════════════════════════ */
.stage {
  /* flex: 0 0 auto (not 1 1 auto) — .stage never competes with
     .chat-section for space, so host/guest/seats always get their
     exact fixed dvh height no matter how much chat content there
     is. .chat-section is the only flexible element in the column. */
  flex: 0 0 auto; overflow: hidden;
  display: flex; flex-direction: column;
  background: linear-gradient(180deg, var(--bg-2) 0%, var(--bg-0) 100%);
  position: relative;
}

#arena-particles {
  position: absolute; inset: 0; z-index: 1; pointer-events: none;
}
#connection-lines {
  position: absolute; inset: 0; z-index: 2; pointer-events: none;
  width: 100%; height: 100%;
}

.stage-section {
  position: relative; z-index: 3;
  flex: 0 0 auto;
  padding: 1px 10px;
  border-bottom: 1px solid var(--line);
  display: flex; flex-direction: column; min-height: 0;
}
.section-label {
  position: absolute; top: 3px; left: 10px; z-index: 5;
  font-size: 7.5px; font-weight: 800; letter-spacing: .06em;
  color: rgba(255,255,255,.7); text-transform: uppercase;
  background: rgba(0,0,0,.4); padding: 2px 7px; border-radius: 8px;
  pointer-events: none;
}

/* ── SECTION 2 — HOST FRAME ─────────────────────────────
   Rectangular tile, rounded corners, fixed position — never
   rotates, never orbits, never moves. Speaking state only changes
   the border glow / shadow / outline.

   SIZING (v5 — final): width is a real, direct percentage of the
   row (97%) — NOT derived from height — so it can never be
   silently clamped down the way an aspect-ratio-from-height value
   could be. Height is 100% of host-card-wrap, which is itself
   flex:1 inside host-section, so the frame's bottom edge sits
   right at the divider line under this section. #stage-video uses
   object-fit: cover, so filling both axes this way never distorts
   the picture — it just uses the full space instead of leaving a
   clamped, narrower box. */
.host-section { height: 30dvh; }
.host-card-wrap {
  width: 100%; height: 100%; flex: 1; min-height: 0;
  display: flex; flex-direction: column; align-items: center;
  position: relative;
}
.host-frame {
  position: relative;
  height: 100%; flex: 1 1 auto; min-height: 0;
  width: 80%; max-width: 80%;
  border-radius: var(--radius-lg); overflow: hidden;
  background: #120a1f;
  border: 2px solid rgba(157,92,255,.5);
  box-shadow: 0 0 0 1px rgba(255,255,255,.05) inset, 0 4px 16px rgba(0,0,0,.4), 0 0 14px rgba(157,92,255,.12);
  transition: border-color .25s, box-shadow .25s;
}
.host-card-wrap.speaking .host-frame {
  border-color: rgba(255,61,127,.85);
  box-shadow: 0 0 0 1px rgba(255,255,255,.06) inset, 0 0 0 3px rgba(255,61,127,.3), 0 4px 20px rgba(255,61,127,.32);
}
#stage-video { width: 100%; height: 100%; object-fit: cover; display: block; }
.stage-offline {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 4px;
  background: #120a1f; color: rgba(255,255,255,.4); font-size: 10px; text-align: center; padding: 6px;
}
.stage-offline .icon { font-size: 22px; }
.host-online-dot {
  position: absolute; bottom: 6px; right: 6px; z-index: 2;
  width: 10px; height: 10px; border-radius: 50%;
  background: #00c864; border: 2px solid var(--bg-2);
}
.stage-label {
  position: absolute; bottom: 6px; left: 8px; z-index: 5;
  display: flex; align-items: center; gap: 4px;
  font-size: 9px; font-weight: 800; color: #fff;
  background: rgba(0,0,0,.45); padding: 3px 8px; border-radius: 10px;
  pointer-events: none;
}
.stage-label .pulse-dot { width: 4px; height: 4px; border-radius: 50%; background: #FF3D7F; animation: pulse-anim 1.4s infinite; flex: none; }

/* Host-only controls float in the space beside the (now wide)
   host frame instead of taking a second header row. Same 6
   buttons, same ids, same body.host-mode visibility contract —
   only their position changed. .stage-section already establishes
   the position:relative containing block these are absolutely
   positioned against. */
#host-controls {
  position: absolute; inset: 0;
  z-index: 6; pointer-events: none;
  display: none;
}
body.host-mode #host-controls { display: block; }

.h-ctrl {
  position: absolute; transform: translateY(-50%);
  display: flex; align-items: center; justify-content: center;
  background: none; border: none; color: rgba(255,255,255,.85);
  cursor: pointer; pointer-events: auto; padding: 0;
}
.h-ctrl .h-ctrl-icon {
  width: 30px; height: 30px; border-radius: 50%;
  background: rgba(0,0,0,.55); border: 1px solid var(--line);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;
}
.h-ctrl.muted .h-ctrl-icon, .h-ctrl.off .h-ctrl-icon { background: rgba(255,61,127,.4); border-color: rgba(255,61,127,.5); }
.h-ctrl.end .h-ctrl-icon { background: rgba(255,61,127,.9); border-color: transparent; }

/* left column — beside the left edge of the host frame */
#camera-btn        { left: 4px; top: calc(50% - 40px); }
#switch-camera-btn { left: 4px; top: 50%; }
#mic-btn            { left: 4px; top: calc(50% + 40px); }

/* right column — beside the right edge of the host frame */
#beauty-btn        { right: 4px; top: calc(50% - 40px); }
#header-share-btn  { right: 4px; top: 50%; }
#end-live-btn      { right: 4px; top: calc(50% + 40px); }

.mic-wrap {
  position: absolute; top: -3px; right: 2px;
  width: 3px; height: 16px; background: rgba(255,255,255,.12);
  border-radius: 3px; overflow: hidden;
}
#mic-level {
  position: absolute; bottom: 0; left: 0; width: 100%;
  background: #FF3D7F; border-radius: 3px; height: 0%;
  transition: height .08s;
}

/* ── SECTION 3 — GUEST FRAMES ───────────────────────────
   Two tiles, same design language as the host frame, equal size,
   fixed positions, never circular.

   SIZING (v5 — final): each tile's width is a real, direct
   calc() of the row (50% minus half the gap) — NOT derived from
   height — so the two tiles always exactly fill the row edge to
   edge with no leftover side gutters and can never be silently
   clamped narrower. Height is 100% of guest-frames, which is
   itself flex:1 inside guest-section, so both tiles' bottom edges
   sit right at the divider line under this section. The video
   tiles inside use object-fit: cover, so filling both axes this
   way never distorts the picture. */
.guest-section { height: 20dvh; }
.guest-frames {
  flex: 1; min-height: 0;
  display: flex; align-items: stretch; justify-content: center; gap: var(--gap);
}
.guest-frame {
  position: relative; min-height: 0;
  height: 100%; width: calc(44% - (var(--gap) / 2)); flex: 0 0 auto;
  border-radius: var(--radius-md);
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, rgba(157,92,255,.16), rgba(255,255,255,.04));
  border: 2px dashed rgba(157,92,255,.55);
  cursor: pointer; overflow: hidden;
  transition: border-color .2s, background .2s, transform .15s;
}
.guest-frame:active { transform: scale(.98); }
.guest-frame.occupied { border-style: solid; border-color: rgba(157,92,255,.75); background: #120a1f; box-shadow: 0 0 0 1px rgba(255,255,255,.05) inset; }
.guest-frame.occupied.speaking { border-color: #FF3D7F; box-shadow: 0 0 0 1px rgba(255,255,255,.05) inset, 0 0 0 3px rgba(255,61,127,.3); }
.guest-placeholder { font-size: clamp(20px, 6vw, 30px); color: rgba(255,255,255,.32); pointer-events: none; }
.guest-frame.occupied .guest-placeholder { display: none; }
.guest-tag {
  position: absolute; top: 5px; left: 6px;
  font-size: 8px; font-weight: 800; padding: 1px 6px; border-radius: 8px;
  background: rgba(0,0,0,.55); color: #fff; white-space: nowrap; pointer-events: none; z-index: 2;
}
.guest-frame[data-slot="male"] .guest-tag { color: #6FC7FF; }
.guest-frame[data-slot="female"] .guest-tag { color: #FF8FD1; }

.participant-tile, #local-tile { width: 100%; height: 100%; }
.participant-tile.docked, #local-tile.docked { display: block; }
.participant-tile video, #local-video { width: 100%; height: 100%; object-fit: cover; display: block; background: #120a1f; }
.local-tile-controls {
  position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%);
  display: flex; align-items: center; justify-content: center; gap: 4px; z-index: 3;
}
.local-ctrl-btn {
  width: 20px; height: 20px; border-radius: 50%;
  background: rgba(0,0,0,.75); border: 1px solid rgba(255,255,255,.2);
  display: flex; align-items: center; justify-content: center;
  color: #fff; cursor: pointer; font-size: 9px; padding: 0; line-height: 1;
}
.local-ctrl-btn.muted { background: rgba(157,92,255,.75); border-color: rgba(157,92,255,.5); }
#local-name {
  position: absolute; top: 5px; right: 6px; z-index: 3;
  font-size: 8px; font-weight: 700; color: rgba(255,255,255,.8);
  background: rgba(0,0,0,.5); padding: 1px 5px; border-radius: 7px;
}

.guest-self-controls {
  position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%);
  display: none; align-items: center; justify-content: center; gap: 3px; z-index: 4;
}
.guest-self-btn {
  width: 19px; height: 19px; border-radius: 50%;
  background: rgba(0,0,0,.8); border: 1px solid rgba(255,255,255,.2);
  display: flex; align-items: center; justify-content: center;
  color: #fff; cursor: pointer; font-size: 9px; padding: 0; line-height: 1;
}
.guest-self-btn:active { transform: scale(.85); }
.guest-mute-btn:disabled { opacity: .5; cursor: not-allowed; }
.guest-leave-btn { background: rgba(255,61,127,.75); border-color: rgba(255,61,127,.5); }
.guest-mute-indicator {
  position: absolute; bottom: 5px; right: 6px; z-index: 3;
  width: 16px; height: 16px; border-radius: 50%;
  background: rgba(0,0,0,.75); border: 1px solid rgba(255,255,255,.15);
  display: none; align-items: center; justify-content: center; font-size: 8px;
}
.guest-frame.guest-muted { border-color: rgba(255,61,127,.5); }
.guest-frame.guest-host-muted { border-color: rgba(255,61,127,.8); box-shadow: 0 0 0 3px rgba(255,61,127,.25); }

/* ── SECTION 4 — 12 MIC SEATS ───────────────────────────
   6x2 grid, circular avatars, even spacing, equal sizing.

   v9 OVERFLOW FIX: the grid's own columns/rows now use
   minmax(0, 1fr) instead of a bare 1fr, and .seat-slot gets
   min-width: 0 — standard grid-blowout guards so a track can never
   be forced wider than its fair share by a child's intrinsic size.
   The real fix, though, is on .seat-slot-frame below: width is now
   the definite (100%-of-column) side and height derives from it via
   aspect-ratio, clamped by max-height — see that rule's comment. */
.seats-section { height: 18dvh; }
#participants-strip { flex: 1; min-height: 0; width: 100%; display: flex; }
.seats-grid {
  flex: 1; width: 100%; min-height: 0;
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  grid-template-rows: repeat(2, minmax(0, 1fr));
  gap: 2px calc(var(--gap) * .6);
}
.seat-slot {
  position: relative; min-width: 0; min-height: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
}
.seat-slot-frame {
  position: relative;
  /* width is the DEFINITE side (always exactly the grid column's
     width, so it can never exceed it and push the seat off-screen);
     height derives from width via aspect-ratio and is capped by
     max-height so it also can't blow out the row. See v9 comment
     above the .seats-grid rule for the full root-cause writeup. */
  width: 100%; height: auto;
  aspect-ratio: 1 / 1;
  max-height: 100%;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  border: 2.5px dashed rgba(157,92,255,.55);
  background: rgba(255,255,255,.04);
  cursor: pointer; overflow: hidden;
  transition: border-color .2s, background .2s, transform .15s;
}
.seat-slot:active .seat-slot-frame { transform: scale(.92); }
.seat-slot:not(.occupied) .seat-slot-frame:hover { border-color: rgba(157,92,255,.85); background: rgba(157,92,255,.08); }
.seat-plus { font-size: 14px; font-weight: 300; color: rgba(255,255,255,.32); pointer-events: none; }
.seat-slot-num { font-size: 7.5px; font-weight: 800; color: rgba(255,255,255,.4); flex: 0 0 auto; }
.seat-slot.occupied .seat-slot-frame { border-style: solid; border-color: rgba(157,92,255,.8); background: transparent; box-shadow: 0 0 0 1px rgba(255,255,255,.06) inset; }
.seat-slot.occupied .seat-slot-num, .seat-slot.occupied .seat-plus { display: none; }
.seat-slot.speaking .seat-slot-frame { border-color: #FF3D7F; box-shadow: 0 0 0 1px rgba(255,255,255,.06) inset, 0 0 0 3px rgba(255,61,127,.32); }
.seat-slot.seat-muted .seat-slot-frame { border-color: rgba(255,61,127,.55); }
.seat-slot.seat-host-muted .seat-slot-frame { border-color: rgba(255,61,127,.85); box-shadow: 0 0 0 1px rgba(255,255,255,.06) inset, 0 0 0 2px rgba(255,61,127,.28); }
.seat-avatar { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: none; }

.seat-mute-indicator {
  position: absolute; bottom: -2px; right: -2px; z-index: 3;
  width: 16px; height: 16px; border-radius: 50%;
  background: #170B2E; border: 1.5px solid var(--bg-0);
  display: none; align-items: center; justify-content: center; font-size: 8px;
}
/* v9: self-controls (mute / leave) bumped from 15px to 21px with a
   wider 7px gap so the two buttons are no longer close enough to
   mis-tap "leave" while reaching for "mute". Nudged down slightly
   (-9px instead of -6px) to keep clearing the avatar circle at the
   new size. */
.seat-self-controls {
  position: absolute; bottom: -9px; left: 50%; transform: translateX(-50%);
  display: none; align-items: center; justify-content: center; gap: 7px; z-index: 5;
}
.seat-self-btn {
  width: 21px; height: 21px; border-radius: 50%;
  background: rgba(0,0,0,.85); border: 1.5px solid rgba(255,255,255,.25);
  display: flex; align-items: center; justify-content: center;
  color: #fff; cursor: pointer; font-size: 10px; padding: 0; line-height: 1;
}
.seat-self-btn:active { transform: scale(.85); }
.seat-mute-btn:disabled { opacity: .5; cursor: not-allowed; }
.seat-leave-btn { background: rgba(255,61,127,.8); border-color: rgba(255,61,127,.6); }

.host-ctrl-overlay { position: absolute; inset: 0; z-index: 6; display: none; pointer-events: none; }
body.host-mode .seat-slot.occupied .host-ctrl-overlay,
body.host-mode .guest-frame.occupied .host-ctrl-overlay { display: block; }
.host-ctrl-overlay.hidden-self { display: none !important; }
.host-ctrl-btn {
  position: absolute; width: 14px; height: 14px; border-radius: 50%;
  border: 1.5px solid rgba(255,255,255,.5);
  display: flex; align-items: center; justify-content: center;
  font-size: 7px; line-height: 1; background: rgba(0,0,0,.85); color: #fff;
  cursor: pointer; pointer-events: auto; padding: 0;
}
.host-ctrl-btn:active { transform: scale(.85); }
.host-ctrl-mute { top: -3px; left: -3px; }
.host-ctrl-kick { top: -3px; right: -3px; background: rgba(255,61,127,.9); border-color: rgba(255,61,127,.6); }
.guest-frame .host-ctrl-btn { width: 18px; height: 18px; font-size: 9px; }
.guest-frame .host-ctrl-mute { top: 5px; left: 5px; }
.guest-frame .host-ctrl-kick { top: 5px; right: 5px; }

/* gift fx layers — decorative, transient animation only */
.fx-layer { position: absolute; inset: 0; pointer-events: none; z-index: 8; overflow: hidden; }
.fx-particle {
  position: absolute; bottom: 30px; font-size: 18px;
  animation: float-up 2.7s ease-out forwards; will-change: transform,opacity;
}
@keyframes float-up {
  0%{transform:translateY(0) rotate(0deg);opacity:1}
  60%{opacity:1}
  100%{transform:translateY(-140px) translateX(var(--drift)) rotate(var(--rot));opacity:0}
}
.gift-streak-layer {
  position: absolute; bottom: 4px; left: 0; right: 0; z-index: 9;
  pointer-events: none; display: flex; flex-direction: column;
  align-items: flex-start; gap: 4px; padding: 0 12px;
}
.gift-banner {
  display: flex; align-items: center; gap: 6px;
  background: rgba(0,0,0,.7); border: 1px solid rgba(157,92,255,.25);
  border-radius: 16px; padding: 4px 10px;
  animation: slide-in-left .35s ease-out, fade-out 2.6s .4s ease-in forwards;
  max-width: 90%;
}
.gift-banner-avatar { font-size: 15px; flex: none; }
.gift-banner-icon { width: 18px; height: 18px; object-fit: contain; flex: none; }
.gift-banner-text { font-size: 10px; color: #fff; line-height: 1.3; }
.gift-banner-text strong { font-weight: 800; }
.gift-banner-text em { font-style: normal; color: #FF3D7F; font-weight: 700; }
@keyframes slide-in-left { from{transform:translateX(-16px);opacity:0} to{transform:translateX(0);opacity:1} }
@keyframes fade-out { 0%{opacity:1} 100%{opacity:0} }

#tile-holding-bay { display: none; }

/* stream title strip — hidden to free vertical space for the
   guest/seats sections. #stream-title / #stream-desc still exist
   in the DOM under it, so the inline script (which fills them
   from the URL's ?title= / ?description= params) still runs
   exactly as before — the bar itself just no longer takes up
   screen space. Flip this back to "display:flex" any time it's
   needed again. */
.stream-meta-bar {
  display: none;
  flex: 0 0 auto; align-items: baseline; gap: 6px;
  padding: 4px 10px; background: var(--bg-1);
  border-bottom: 1px solid var(--line);
  overflow: hidden;
}
.stream-title { font-size: 11px; font-weight: 900; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; }
.stream-desc { font-size: 9.5px; color: rgba(255,255,255,.5); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1 1 auto; min-width: 0; }

/* ── SECTION 5 — LIVE CHAT ──────────────────────────────
   Its own dedicated section, scrollable only inside itself
   (this is the one place scrolling is expected/allowed). */
.chat-section {
  /* The ONLY flex:1 element in .live-screen (see .stage above) —
     it absorbs whatever vertical space is left after the fixed
     header, fixed stage (host+guests+seats), and bottom controls.
     It never shrinks host/guest/seats, and .comments-scroll inside
     it is what actually scrolls, so long chat threads stay
     contained right here. */
  flex: 1 1 auto; min-height: 40px;
  display: flex; flex-direction: column;
  background: var(--bg-0);
  border-bottom: 1px solid var(--line);
}
.comments-wrap {
  flex: 1; overflow: hidden; position: relative;
  -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 14%);
  mask-image: linear-gradient(to bottom, transparent 0%, black 14%);
}
.comments-scroll {
  height: 100%; overflow-y: auto; display: flex; flex-direction: column;
  gap: 5px; padding: 8px 12px; scrollbar-width: none;
}
.comments-scroll::-webkit-scrollbar { display: none; }
.comment-row { display: flex; align-items: flex-start; gap: 6px; animation: comment-in .2s ease-out; }
@keyframes comment-in { from{opacity:0;transform:translateY(5px)} to{opacity:1;transform:translateY(0)} }
.comment-row img { width: 20px; height: 20px; border-radius: 50%; object-fit: cover; flex: none; margin-top: 2px; }
.comment-row .bubble {
  background: rgba(255,255,255,.06); border-radius: 11px; padding: 4px 8px;
  font-size: 11px; color: rgba(255,255,255,.9); line-height: 1.35; max-width: 88%; word-break: break-word;
}
.comment-row .uname { display: inline; font-weight: 800; color: #FF3D7F; margin-right: 4px; }
.comment-row.gift-row .bubble { background: rgba(157,92,255,.16); border: 1px solid rgba(157,92,255,.28); }
.comment-row.system .bubble { background: rgba(157,92,255,.12); color: rgba(255,255,255,.7); font-size: 10px; }

/* ── SECTION 6 — BOTTOM CONTROLS ────────────────────────
   Pinned as the final section in normal flex flow. */
.bottom-controls {
  flex: 0 0 auto;
  display: flex; flex-direction: column; gap: 6px;
  padding: 6px 10px calc(8px + env(safe-area-inset-bottom));
  background: var(--bg-1);
}
.comment-bar {
  display: flex; align-items: center;
  background: rgba(255,255,255,.07); border: 1px solid var(--line);
  border-radius: 20px; padding: 0 5px 0 12px; height: 34px; gap: 5px;
}
.comment-bar input { flex: 1; background: none; border: none; outline: none; color: #fff; font-size: 12px; }
.comment-bar input::placeholder { color: rgba(255,255,255,.38); }
.comment-send {
  background: linear-gradient(135deg,#FF3D7F,#9D5CFF); border: none; color: #fff;
  font-size: 11px; font-weight: 800; cursor: pointer; flex: none;
  border-radius: 16px; padding: 6px 12px;
}
.quick-actions { display: flex; align-items: center; justify-content: space-between; gap: 5px; }
.ctrl-icon {
  flex: 1 1 0; min-width: 0; height: 32px; border-radius: 12px;
  background: rgba(255,255,255,.06); border: 1px solid var(--line);
  display: flex; align-items: center; justify-content: center; gap: 4px;
  color: #fff; cursor: pointer; font-size: 13px;
}
.ctrl-icon .ci-label { font-size: 9px; font-weight: 700; color: rgba(255,255,255,.7); }
.ctrl-icon:active { transform: scale(.95); }

/* ══════════════════════════
   MODALS (gift sheet / viewers) — unchanged behavior.
══════════════════════════ */
.sheet-backdrop, .viewers-backdrop {
  position: fixed; inset: 0; background: rgba(0,0,0,.6);
  z-index: 50; opacity: 0; pointer-events: none; transition: opacity .25s;
}
.sheet-backdrop.open, .viewers-backdrop.open { opacity: 1; pointer-events: auto; }

.gift-sheet, .viewers-modal {
  position: fixed; bottom: -100%; left: 0; right: 0;
  max-width: 480px; margin: 0 auto; z-index: 51;
  background: #100a1c; border-radius: 20px 20px 0 0;
  transition: bottom .3s cubic-bezier(.34,1.56,.64,1);
  border-top: 1px solid var(--line);
}
.gift-sheet { padding: 0 0 28px; }
.gift-sheet.open, .viewers-modal.open { bottom: 0; }
.sheet-handle { width: 36px; height: 4px; background: rgba(255,255,255,.2); border-radius: 2px; margin: 10px auto 0; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 18px 4px; }
.sheet-head h3 { font-size: 14px; font-weight: 800; color: #fff; }
.gift-target-row { padding: 0 18px 10px; font-size: 11px; color: rgba(255,255,255,.5); }
#gift-target-name { color: #FF3D7F; font-weight: 700; }
.coin-pill-sm { display: flex; align-items: center; gap: 4px; background: rgba(157,92,255,.12); border: 1px solid rgba(157,92,255,.25); border-radius: 16px; padding: 4px 10px; font-size: 11.5px; font-weight: 700; color: #C890FF; }
.gift-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; padding: 0 14px 14px; max-height: 220px; overflow-y: auto; scrollbar-width: none; }
.gift-grid::-webkit-scrollbar { display: none; }
.gift-tile { display: flex; flex-direction: column; align-items: center; gap: 3px; background: rgba(255,255,255,.06); border: 1.5px solid transparent; border-radius: 14px; padding: 9px 5px; cursor: pointer; }
.gift-tile.selected { border-color: #FF3D7F; background: rgba(255,61,127,.15); }
.gift-tile .emoji { font-size: 18px; }
.gift-tile .gift-icon-img { width: 24px; height: 24px; object-fit: contain; }
.gift-tile .name { font-size: 9px; font-weight: 700; color: rgba(255,255,255,.8); text-align: center; }
.gift-tile .price { font-size: 9px; font-weight: 800; color: #C890FF; background: rgba(157,92,255,.12); border-radius: 6px; padding: 2px 5px; }
.send-gift-btn { width: calc(100% - 28px); margin: 0 14px; height: 44px; border-radius: 14px; font-size: 12.5px; font-weight: 800; border: none; cursor: pointer; background: linear-gradient(135deg,#FF3D7F,#9D5CFF); color: #fff; }
.send-gift-btn:disabled { opacity: .4; cursor: not-allowed; }
.insufficient-cta { display: none; margin: 0 14px 10px; padding: 8px 12px; background: rgba(255,61,127,.1); border: 1px solid rgba(255,61,127,.25); border-radius: 10px; font-size: 11px; color: #FF8FD1; align-items: center; justify-content: space-between; gap: 8px; }
.insufficient-cta.show { display: flex; }
.insufficient-cta button { background: #FF8FD1; color: #1a0a2e; border: none; border-radius: 8px; padding: 5px 10px; font-size: 10.5px; font-weight: 800; cursor: pointer; flex: none; }

.viewers-modal { max-height: 70vh; display: flex; flex-direction: column; }
.viewers-modal-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px 10px; border-bottom: 1px solid var(--line); flex: 0 0 auto; }
.viewers-modal-head h3 { font-size: 14px; font-weight: 800; color: #fff; }
.viewers-modal-head button { width: 26px; height: 26px; border-radius: 50%; background: rgba(255,255,255,.08); border: none; color: #fff; cursor: pointer; font-size: 12px; flex: none; }
.viewers-list { overflow-y: auto; padding: 10px 12px 20px; display: flex; flex-direction: column; gap: 6px; flex: 1; scrollbar-width: none; }
.viewers-list::-webkit-scrollbar { display: none; }
.viewers-empty { padding: 30px 10px; text-align: center; color: rgba(255,255,255,.4); font-size: 12px; }
.viewer-row { display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,.04); border-radius: 14px; padding: 8px 10px; }
.viewer-row img { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; flex: none; }
.viewer-info { flex: 1; min-width: 0; }
.viewer-name { font-size: 12px; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.viewer-badge { font-size: 10px; color: rgba(255,255,255,.5); font-weight: 600; margin-top: 1px; }
.viewer-kick-btn { flex: none; background: rgba(255,61,127,.85); color: #fff; border: none; border-radius: 10px; padding: 6px 10px; font-size: 10.5px; font-weight: 800; cursor: pointer; }

.toast {
  position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
  background: rgba(0,0,0,.88); color: #fff; padding: 9px 18px; border-radius: 18px;
  font-size: 12.5px; font-weight: 600; z-index: 200; opacity: 0; pointer-events: none;
  transition: opacity .25s; white-space: nowrap;
}
.toast.show { opacity: 1; }

@media (prefers-reduced-motion: reduce) {
  .live-badge .dot, .stage-label .pulse-dot { animation: none !important; }
}

/* very short viewports: shave the fixed sections down a touch */
@media (max-height: 640px) {
  .host-section { height: 26dvh; }
  .guest-section { height: 17dvh; }
  .seats-section { height: 15dvh; }
  #camera-btn, #beauty-btn { top: calc(50% - 32px); }
  #mic-btn, #end-live-btn { top: calc(50% + 32px); }
}

/* narrow phones: side controls need a touch less offset from
   center so they don't crowd the header/label above the frame */
@media (max-width: 360px) {
  .h-ctrl .h-ctrl-icon { width: 26px; height: 26px; font-size: 12px; }
}
</style>
</head>
<body>
<div class="app-shell">
<div class="live-screen">

  <!-- ============ SECTION 1 — HEADER (single row) ============ -->
  <header class="live-header">
    <div class="header-row header-row-top">
      <div class="host-chip">
        <img id="host-avatar" src="" alt="">
        <div class="ht">
          <span class="name" id="host-name"></span>
          <span class="sub">Live · <span id="live-duration">00:00</span></span>
        </div>
        <button class="follow-btn" id="follow-btn">Follow</button>
      </div>
      <div class="header-top-right">
        <div class="live-badge"><span class="dot"></span>LIVE</div>
        <button class="viewer-chip" id="viewers-btn">👥 <span id="viewer-count">0</span></button>
        <span id="network-badge">HD</span>
        <button class="close-btn" id="close-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" width="11" height="11">
            <path d="m6 6 12 12M18 6 6 18"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="top-gifters-row">
      <span class="label">Top Gifters</span>
      <div id="top-gifters"></div>
    </div>
  </header>

  <!-- ============ STAGE (host / guests / seats) ============ -->
  <div class="stage" id="arena">
    <canvas id="arena-particles"></canvas>
    <svg id="connection-lines"></svg>

    <!-- ============ SECTION 2 — HOST FRAME ============
         Host-only controls (#host-controls) float beside the
         frame — left column: camera / switch camera / mic.
         right column: beauty / share / end live. Same ids as
         before, only their position moved. -->
    <div class="stage-section host-section">
      <div class="section-label">Host</div>

      <div class="host-controls-overlay" id="host-controls">
        <button class="h-ctrl" id="camera-btn" title="Camera off"><span class="h-ctrl-icon">📷</span></button>
        <button class="h-ctrl" id="switch-camera-btn" title="Flip camera"><span class="h-ctrl-icon">🔄</span></button>
        <button class="h-ctrl" id="mic-btn" title="Mute mic">
          <span class="mic-wrap"><span id="mic-level"></span></span>
          <span class="h-ctrl-icon">🎤</span>
        </button>
        <button class="h-ctrl" id="beauty-btn" title="Beauty filter"><span class="h-ctrl-icon">✨</span></button>
        <button class="h-ctrl" id="header-share-btn" title="Share"><span class="h-ctrl-icon">📤</span></button>
        <button class="h-ctrl end" id="end-live-btn" title="End live"><span class="h-ctrl-icon">⛔</span></button>
      </div>

      <div class="host-card-wrap" id="host-card-wrap">
        <div class="host-frame">
          <video id="stage-video" autoplay playsinline></video>
          <div class="stage-offline" id="stage-offline">
            <span class="icon">📡</span>
            <span>Waiting for host…</span>
          </div>
          <span class="host-online-dot"></span>
        </div>
        <div class="stage-label">
          <span class="pulse-dot"></span>
          <span id="stage-host-label">Host</span>
        </div>
      </div>
    </div>

    <!-- ============ SECTION 3 — GUEST FRAMES ============ -->
    <div class="stage-section guest-section">
      <div class="section-label">Guests</div>
      <div class="guest-frames" id="guest-frames">
        <div class="guest-frame" id="guest-frame-male" data-slot="male">
          <span class="guest-placeholder">♂</span>
          <span class="guest-tag">Male</span>
        </div>
        <div class="guest-frame" id="guest-frame-female" data-slot="female">
          <span class="guest-placeholder">♀</span>
          <span class="guest-tag">Female</span>
        </div>
      </div>
    </div>

    <!-- ============ SECTION 4 — 12 MIC SEATS ============ -->
    <div class="stage-section seats-section">
      <div class="section-label">Mic Seats</div>
      <div id="participants-strip"><!-- filled by js/live-mic-ring.js as a 6x2 grid --></div>
    </div>

    <!-- hidden home for the local video tile when it isn't docked
         into a guest frame -->
    <div id="tile-holding-bay">
      <div id="local-tile">
        <video id="local-video" autoplay playsinline muted></video>
        <div class="local-tile-controls">
          <button class="local-ctrl-btn" id="local-mic-btn" title="Mute mic">🎤</button>
          <button class="local-ctrl-btn" id="local-camera-btn" title="Camera off">📷</button>
        </div>
        <div id="local-name">You</div>
      </div>
    </div>

    <div class="fx-layer" id="fx-layer"></div>
    <div class="gift-streak-layer" id="gift-streak-layer"></div>
  </div>

  <!-- Kept in the DOM (hidden via CSS) purely so #stream-title /
       #stream-desc still exist for the inline script below to
       fill in — see .stream-meta-bar's comment in the CSS. -->
  <div class="stream-meta-bar">
    <div class="stream-title" id="stream-title"></div>
    <div class="stream-desc" id="stream-desc"></div>
  </div>

  <!-- ============ SECTION 5 — LIVE CHAT (only scrollable section) ============ -->
  <section class="chat-section">
    <div class="comments-wrap">
      <div class="comments-scroll" id="comments-scroll"></div>
    </div>
  </section>

  <!-- ============ SECTION 6 — BOTTOM CONTROLS ============ -->
  <div class="bottom-controls">
    <div class="comment-bar">
      <input type="text" id="comment-input" placeholder="Say something…" maxlength="200">
      <button class="comment-send" id="comment-send-btn">➤ Send</button>
    </div>
    <div class="quick-actions">
      <button class="ctrl-icon" id="heart-btn"><span>❤️</span></button>
      <button class="ctrl-icon" id="emoji-btn"><span>😊</span></button>
      <button class="ctrl-icon" id="gift-btn"><span>🎁</span></button>
      <button class="ctrl-icon" id="share-btn"><span>📤</span></button>
      <button class="ctrl-icon" id="fire-btn"><span>🔥</span></button>
    </div>
  </div>

  <span id="viewer-count-label" style="display:none;">0 online</span>
</div>
</div>

<div class="sheet-backdrop" id="sheet-backdrop"></div>
<div class="gift-sheet" id="gift-sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-head">
    <h3>Support the Host</h3>
    <div class="coin-pill-sm">🪙 <span id="sheet-coin-balance">0</span></div>
  </div>
  <div class="gift-target-row">Gifting: <span id="gift-target-name">Host</span></div>
  <div class="insufficient-cta" id="insufficient-cta">
    <span>Not enough coins for this gift.</span>
    <button id="topup-btn">Top up</button>
  </div>
  <div class="gift-grid" id="gift-grid"></div>
  <button class="send-gift-btn" id="send-gift-btn" disabled>Select a gift to send</button>
</div>

<div class="viewers-backdrop" id="viewers-backdrop"></div>
<div class="viewers-modal" id="viewers-modal">
  <div class="viewers-modal-head">
    <h3>Everyone here (<span id="viewers-total-count">0</span>)</h3>
    <button id="viewers-close-btn">✕</button>
  </div>
  <div class="viewers-list" id="viewers-list"></div>
</div>

<div class="toast" id="toast"></div>

<div id="gift-engine-root"></div>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<script>
  /* Room title/description from URL — unchanged behavior. */
  const _params = new URLSearchParams(window.location.search);
  const _titleEl = document.getElementById("stream-title");
  const _descEl  = document.getElementById("stream-desc");

  const _titleParam = _params.get("title");
  const _descParam  = _params.get("description");

  if (_titleParam) _titleEl.textContent = decodeURIComponent(_titleParam);
  if (_descParam)  _descEl.textContent  = decodeURIComponent(_descParam);

  /* Beauty / Share are new UI-only controls added for this redesign.
     They don't touch any WebRTC/socket/room logic — just a small
     local toast so they aren't dead clicks. */
  function _uiToast(msg) {
    const t = document.getElementById("toast");
    if (!t) return;
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(_uiToast._t);
    _uiToast._t = setTimeout(() => t.classList.remove("show"), 1600);
  }
  document.getElementById("beauty-btn")?.addEventListener("click", () => _uiToast("Beauty filter coming soon"));
  document.getElementById("header-share-btn")?.addEventListener("click", () => _uiToast("Share link copied"));
  document.getElementById("share-btn")?.addEventListener("click", () => _uiToast("Share link copied"));
  document.getElementById("emoji-btn")?.addEventListener("click", () => _uiToast("Emoji picker coming soon"));
</script>

<script type="module" src="/js/live.js"></script>
<script type="module" src="/js/live-mic-ring.js"></script>

<script type="module">
  import { GiftAnimationManager } from "./gift-engine/GiftAnimationManager.js";
  window.__giftEngine = new GiftAnimationManager(document.getElementById("gift-engine-root"));
</script>
</body>
</html>

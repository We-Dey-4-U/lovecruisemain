<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>vConnect — Live</title>
<link rel="stylesheet" href="css/style.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body, .app-shell, .live-screen {
  height: 100dvh; overflow: hidden; background: #000;
}

.live-screen {
  position: relative; width: 100%; max-width: 480px; margin: 0 auto;
  display: flex; flex-direction: column; height: 100dvh;
}

/* ══════════════════════════
   STAGE — host video (top)
══════════════════════════ */
.stage-panel {
  position: relative; flex: 0 0 52%;
  background: #0a0a0f; overflow: hidden;
}

#stage-video {
  width: 100%; height: 100%;
  object-fit: cover; object-position: center top; display: block;
}

.stage-offline {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 10px;
  background: #0a0a0f; color: rgba(255,255,255,.4); font-size: 13px;
}
.stage-offline .icon { font-size: 36px; }

.stage-label {
  position: absolute; bottom: 10px; left: 12px;
  display: flex; align-items: center; gap: 6px;
  background: rgba(0,0,0,.6); backdrop-filter: blur(8px);
  border-radius: 20px; padding: 5px 10px;
  font-size: 12px; font-weight: 800; color: #fff;
}

.gift-tile .gift-icon-img { width: 26px; height: 26px; object-fit: contain; }
.gift-banner-icon { width: 22px; height: 22px; object-fit: contain; flex: none; }
.stage-label .pulse-dot {
  width: 5px; height: 5px; border-radius: 50%; background: #ff3d7f;
  animation: pulse-anim 1.4s infinite; flex: none;
}
@keyframes pulse-anim { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.75)} }

/* ══════════════════════════
   TOP BAR (overlaid on stage)
══════════════════════════ */
.live-top {
  position: absolute; top: 0; left: 0; right: 0; z-index: 20;
  display: flex; align-items: flex-start; justify-content: space-between;
  padding: 12px 12px 0; gap: 8px;
  background: linear-gradient(to bottom, rgba(0,0,0,.5) 0%, transparent 100%);
}

.host-chip {
  display: flex; align-items: center; gap: 8px;
  background: rgba(0,0,0,.55); backdrop-filter: blur(10px);
  border-radius: 28px; padding: 5px 10px 5px 5px;
  max-width: calc(100% - 130px); min-width: 0;
}
.host-chip img {
  width: 32px; height: 32px; border-radius: 50%;
  border: 2px solid rgba(255,255,255,.4); object-fit: cover; flex: none; cursor: pointer;
}
.host-chip .ht { min-width: 0; flex: 1; }
.host-chip .name {
  display: block; font-size: 12px; font-weight: 800; color: #fff;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.host-chip .sub { font-size: 10px; color: rgba(255,255,255,.65); }

.follow-btn {
  flex: none; background: #ff3d7f; color: #fff; border: none;
  border-radius: 14px; padding: 4px 10px; font-size: 11px;
  font-weight: 800; cursor: pointer; transition: background .2s; white-space: nowrap;
}
.follow-btn.active { background: rgba(255,255,255,.25); }

.live-top-right {
  display: flex; align-items: center; gap: 6px; flex: none;
}
.viewer-chip {
  display: flex; align-items: center; gap: 4px;
  background: rgba(0,0,0,.5); backdrop-filter: blur(8px);
  border-radius: 14px; padding: 5px 8px;
  color: #fff; font-size: 11px; font-weight: 700;
}
#network-badge {
  font-size: 9px; font-weight: 900; padding: 3px 6px;
  border-radius: 7px; background: rgba(0,200,100,.7); color: #fff;
}
.close-btn {
  width: 30px; height: 30px; border-radius: 50%;
  background: rgba(0,0,0,.5); backdrop-filter: blur(8px);
  display: flex; align-items: center; justify-content: center;
  color: #fff; border: none; cursor: pointer; flex: none;
}
.end-live-btn {
  display: none; align-items: center; gap: 5px;
  background: rgba(255,61,127,.9); color: #fff; border: none;
  border-radius: 14px; padding: 5px 10px; font-size: 11px;
  font-weight: 800; cursor: pointer; white-space: nowrap;
}

/* TOP GIFTERS */
.top-gifters {
  position: absolute; top: 54px; left: 12px; z-index: 10;
  display: flex; align-items: center;
}
.top-gifters img {
  width: 26px; height: 26px; border-radius: 50%;
  border: 2px solid rgba(0,0,0,.5); object-fit: cover; margin-left: -5px;
}
.top-gifters img:first-child { margin-left: 0; }
.top-gifters .label { font-size: 10px; color: rgba(255,255,255,.65); margin-left: 7px; font-weight: 700; }

/* HOST CONTROLS (only shown in host-mode) */
#host-controls {
  display: none; position: absolute; top: 54px; right: 12px;
  z-index: 20; flex-direction: column; gap: 6px;
}
.host-mode #host-controls { display: flex; }
.h-ctrl {
  width: 36px; height: 36px; border-radius: 50%;
  background: rgba(0,0,0,.6); backdrop-filter: blur(8px);
  border: 1px solid rgba(255,255,255,.15);
  display: flex; align-items: center; justify-content: center;
  color: #fff; cursor: pointer; font-size: 14px;
}

/* MIC LEVEL (host stage only) */
.mic-wrap {
  position: absolute; bottom: 50px; right: 12px; z-index: 20;
  width: 4px; height: 48px; background: rgba(255,255,255,.1);
  border-radius: 4px; overflow: hidden; display: none;
}
.host-mode .mic-wrap { display: block; }
#mic-level {
  position: absolute; bottom: 0; width: 100%;
  background: #00c864; border-radius: 4px; height: 0%;
  transition: height .08s;
}

/* ══════════════════════════
   PARTICIPANTS STRIP
══════════════════════════ */
.participants-section {
  flex: 0 0 auto; background: #0d0d14;
  border-top: 1px solid rgba(255,255,255,.08);
}

.participants-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 6px 12px 4px;
}
.participants-header span {
  font-size: 11px; font-weight: 700; color: rgba(255,255,255,.5);
  text-transform: uppercase; letter-spacing: .06em;
}

#participants-strip {
  display: flex; gap: 8px;
  padding: 4px 12px 10px; overflow-x: auto; scrollbar-width: none;
}
#participants-strip::-webkit-scrollbar { display: none; }

/* ── LOCAL (self) tile ── */
#local-tile {
  display: none; flex: 0 0 72px; flex-direction: column;
  align-items: center; gap: 0; position: relative;
}

#local-video {
  width: 72px; height: 96px; border-radius: 12px;
  object-fit: cover; border: 2px solid #ff3d7f; background: #111; display: block;
}

#local-name {
  font-size: 9px; color: rgba(255,255,255,.6); font-weight: 700;
  text-align: center; max-width: 72px; margin-top: 3px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* ── LOCAL TILE CONTROLS (mic + camera — for ALL participants) ── */
.local-tile-controls {
  position: absolute; bottom: 20px; left: 0; right: 0;
  display: flex; align-items: center; justify-content: center; gap: 4px;
  z-index: 5;
}

.local-ctrl-btn {
  width: 24px; height: 24px; border-radius: 50%;
  background: rgba(0,0,0,.72); backdrop-filter: blur(6px);
  border: 1px solid rgba(255,255,255,.2);
  display: flex; align-items: center; justify-content: center;
  color: #fff; cursor: pointer; font-size: 11px;
  transition: background .15s, transform .1s;
  padding: 0; line-height: 1;
}
.local-ctrl-btn:active { transform: scale(.85); }
.local-ctrl-btn.muted {
  background: rgba(255,61,127,.7);
  border-color: rgba(255,61,127,.5);
}

/* ── REMOTE participant tiles ── */
.participant-tile {
  flex: 0 0 72px; position: relative;
}
.participant-tile video {
  width: 72px; height: 96px; border-radius: 12px;
  object-fit: cover; border: 2px solid rgba(255,255,255,.15);
  background: #111; display: block;
}
.ptile-name {
  position: absolute; bottom: 4px; left: 0; right: 0;
  text-align: center; font-size: 9px; font-weight: 700;
  color: #fff; text-shadow: 0 1px 4px #000;
  padding: 0 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* Muted badge overlaid on remote tile */
.ptile-muted-badge {
  position: absolute; top: 5px; left: 5px; z-index: 4;
  width: 18px; height: 18px; border-radius: 50%;
  background: rgba(0,0,0,.72); backdrop-filter: blur(4px);
  display: none; /* toggled by JS */ align-items: center; justify-content: center;
  font-size: 9px; line-height: 1;
}

/* Empty strip hint */
.strip-empty-hint {
  color: rgba(255,255,255,.25); font-size: 11px;
  display: flex; align-items: center; padding: 10px 4px;
}

/* ══════════════════════════
   LOWER PANEL
══════════════════════════ */
.lower-panel {
  flex: 1; position: relative; overflow: hidden; display: flex; flex-direction: column;
  background: linear-gradient(to bottom, #0d0d14 0%, #0a0a10 100%);
}

.fx-layer {
  position: absolute; inset: 0; pointer-events: none; z-index: 6; overflow: hidden;
}
.fx-particle {
  position: absolute; bottom: 80px; font-size: 20px;
  animation: float-up 2.7s ease-out forwards; will-change: transform,opacity;
}
@keyframes float-up {
  0%{transform:translateY(0) rotate(0deg);opacity:1}
  60%{opacity:1}
  100%{transform:translateY(-180px) translateX(var(--drift)) rotate(var(--rot));opacity:0}
}

.gift-streak-layer {
  position: absolute; bottom: 70px; left: 0; right: 0; z-index: 7;
  pointer-events: none; display: flex; flex-direction: column;
  align-items: flex-start; gap: 6px; padding: 0 12px;
}
.gift-banner {
  display: flex; align-items: center; gap: 8px;
  background: rgba(0,0,0,.65); backdrop-filter: blur(10px);
  border-radius: 20px; padding: 6px 12px;
  animation: slide-in-left .35s ease-out, fade-out 2.6s .4s ease-in forwards;
  max-width: 85%;
}
.gift-banner-avatar { font-size: 18px; flex: none; }
.gift-banner-text { font-size: 11px; color: #fff; line-height: 1.4; }
.gift-banner-text strong { font-weight: 800; }
.gift-banner-text em { font-style: normal; color: #ffc857; font-weight: 700; }
@keyframes slide-in-left { from{transform:translateX(-16px);opacity:0} to{transform:translateX(0);opacity:1} }
@keyframes fade-out { 0%{opacity:1} 100%{opacity:0} }

.comments-wrap {
  flex: 1; overflow: hidden; position: relative;
  -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 22%);
  mask-image: linear-gradient(to bottom, transparent 0%, black 22%);
}
.comments-scroll {
  height: 100%; overflow-y: auto; display: flex; flex-direction: column;
  justify-content: flex-end; gap: 5px; padding: 8px 12px;
  scrollbar-width: none;
}
.comments-scroll::-webkit-scrollbar { display: none; }
.comment-row { display: flex; align-items: flex-start; gap: 6px; animation: comment-in .2s ease-out; }
@keyframes comment-in { from{opacity:0;transform:translateY(5px)} to{opacity:1;transform:translateY(0)} }
.comment-row img { width: 22px; height: 22px; border-radius: 50%; object-fit: cover; flex: none; margin-top: 2px; }
.comment-row .bubble {
  background: rgba(0,0,0,.45); backdrop-filter: blur(6px);
  border-radius: 12px; padding: 5px 9px; font-size: 11.5px;
  color: rgba(255,255,255,.9); line-height: 1.4; max-width: 88%; word-break: break-word;
}
.comment-row .uname { display: inline; font-weight: 800; color: #fff; margin-right: 4px; }
.comment-row.gift-row .bubble { background: rgba(255,200,87,.18); border: 1px solid rgba(255,200,87,.28); }
.comment-row.system .bubble { background: rgba(0,217,181,.12); color: rgba(255,255,255,.7); font-size: 10.5px; }

/* Bottom control bar */
.live-controls {
  flex: 0 0 auto; display: flex; align-items: center; gap: 8px;
  padding: 8px 12px 20px;
  border-top: 1px solid rgba(255,255,255,.06);
}
.comment-bar {
  flex: 1; display: flex; align-items: center;
  background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.12);
  border-radius: 22px; padding: 0 12px; height: 40px; gap: 6px;
}
.comment-bar input {
  flex: 1; background: none; border: none; outline: none;
  color: #fff; font-size: 13px;
}
.comment-bar input::placeholder { color: rgba(255,255,255,.38); }
.comment-send {
  background: none; border: none; color: #ff3d7f;
  font-size: 12px; font-weight: 800; cursor: pointer; flex: none;
}
.ctrl-icon {
  width: 40px; height: 40px; border-radius: 50%;
  background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.12);
  display: flex; align-items: center; justify-content: center;
  color: #fff; cursor: pointer; flex: none;
  transition: background .15s, transform .1s; font-size: 17px;
}
.ctrl-icon:active { transform: scale(.88); }

/* ══════════════════════════
   GIFT SHEET
══════════════════════════ */
.sheet-backdrop {
  position: fixed; inset: 0; background: rgba(0,0,0,.6);
  backdrop-filter: blur(4px); z-index: 50;
  opacity: 0; pointer-events: none; transition: opacity .25s;
}
.sheet-backdrop.open { opacity: 1; pointer-events: auto; }
.gift-sheet {
  position: fixed; bottom: -100%; left: 0; right: 0;
  max-width: 480px; margin: 0 auto; z-index: 51;
  background: #0d0912; border-radius: 24px 24px 0 0;
  padding: 0 0 36px; transition: bottom .3s cubic-bezier(.34,1.56,.64,1);
  border-top: 1px solid rgba(255,255,255,.1);
}
.gift-sheet.open { bottom: 0; }
.sheet-handle { width: 36px; height: 4px; background: rgba(255,255,255,.2); border-radius: 2px; margin: 12px auto 0; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px 4px; }
.sheet-head h3 { font-size: 15px; font-weight: 800; }
.gift-target-row { padding: 0 18px 10px; font-size: 11.5px; color: rgba(255,255,255,.5); }
#gift-target-name { color: #ff3d7f; font-weight: 700; }
.coin-pill-sm { display: flex; align-items: center; gap: 4px; background: rgba(255,200,87,.12); border: 1px solid rgba(255,200,87,.25); border-radius: 18px; padding: 4px 10px; font-size: 12px; font-weight: 700; color: #ffc857; }
.gift-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; padding: 0 14px 14px; max-height: 240px; overflow-y: auto; scrollbar-width: none; }
.gift-grid::-webkit-scrollbar { display: none; }
.gift-tile { display: flex; flex-direction: column; align-items: center; gap: 3px; background: rgba(255,255,255,.06); border: 1.5px solid transparent; border-radius: 14px; padding: 10px 5px; cursor: pointer; transition: border-color .15s, background .15s, transform .1s; }
.gift-tile:active { transform: scale(.92); }
.gift-tile.selected { border-color: #ff3d7f; background: rgba(255,61,127,.12); }
.gift-tile .emoji { font-size: 20px; }
.gift-tile .name { font-size: 9.5px; font-weight: 700; color: rgba(255,255,255,.8); text-align: center; }
.gift-tile .price { font-size: 9.5px; font-weight: 800; color: #ffc857; background: rgba(255,200,87,.12); border-radius: 7px; padding: 2px 5px; }
.send-gift-btn { width: calc(100% - 28px); margin: 0 14px; height: 46px; border-radius: 14px; font-size: 13px; font-weight: 800; border: none; cursor: pointer; background: linear-gradient(135deg,#ff3d7f,#c2185b); color: #fff; transition: opacity .2s; }
.send-gift-btn:disabled { opacity: .4; cursor: not-allowed; }
.insufficient-cta { display: none; margin: 0 14px 10px; padding: 9px 12px; background: rgba(255,200,87,.1); border: 1px solid rgba(255,200,87,.25); border-radius: 10px; font-size: 11.5px; color: #ffc857; align-items: center; justify-content: space-between; gap: 8px; }
.insufficient-cta.show { display: flex; }
.insufficient-cta button { background: #ffc857; color: #1a0a00; border: none; border-radius: 8px; padding: 5px 10px; font-size: 11px; font-weight: 800; cursor: pointer; flex: none; }

/* Toast */
.toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,.88); color: #fff; padding: 9px 18px; border-radius: 18px; font-size: 12.5px; font-weight: 600; z-index: 200; opacity: 0; pointer-events: none; transition: opacity .25s; white-space: nowrap; }
.toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="app-shell">
<div class="live-screen">

  <!-- ══ STAGE PANEL — host video ══ -->
  <div class="stage-panel">
    <video id="stage-video" autoplay playsinline></video>

    <div class="stage-offline" id="stage-offline">
      <span class="icon">📡</span>
      <span>Waiting for host to start…</span>
    </div>

    <div class="live-top">
      <div class="host-chip">
        <img id="host-avatar" src="" alt="">
        <div class="ht">
          <span class="name" id="host-name">Loading…</span>
          <span class="sub">Live · <span id="live-duration">00:00</span></span>
        </div>
        <button class="follow-btn" id="follow-btn">Follow</button>
      </div>
      <div class="live-top-right">
        <button id="end-live-btn" class="end-live-btn">End Live</button>
        <span id="network-badge">HD</span>
        <span class="viewer-chip">👁 <span id="viewer-count">0</span></span>
        <button class="close-btn" id="close-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" width="14" height="14">
            <path d="m6 6 12 12M18 6 6 18"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="top-gifters" id="top-gifters">
      <span class="label">Top Gifters</span>
    </div>

    <!-- Host-only media controls (shown via .host-mode class on body) -->
    <div id="host-controls">
      <button class="h-ctrl" id="mic-btn" title="Mute mic">🎤</button>
      <button class="h-ctrl" id="camera-btn" title="Camera off">📷</button>
      <button class="h-ctrl" id="switch-camera-btn" title="Flip camera">🔄</button>
    </div>

    <div class="mic-wrap"><div id="mic-level"></div></div>

    <div class="stage-label">
      <span class="pulse-dot"></span>
      <span id="stage-host-label">Host</span>
    </div>
  </div>

  <!-- ══ PARTICIPANTS STRIP ══ -->
  <div class="participants-section">
    <div class="participants-header">
      <span>Participants</span>
      <span id="viewer-count-label" style="font-size:11px;color:rgba(255,255,255,.35);">0 online</span>
    </div>
    <div id="participants-strip">

      <!-- ── LOCAL (self) TILE ──
           Shown for ALL participants once camera starts.
           Mic + camera buttons let anyone toggle their own AV. -->
      <div id="local-tile">
        <video id="local-video" autoplay playsinline muted></video>

        <!-- Controls overlaid on the local tile -->
        <div class="local-tile-controls">
          <button class="local-ctrl-btn" id="local-mic-btn" title="Mute mic">🎤</button>
          <button class="local-ctrl-btn" id="local-camera-btn" title="Camera off">📷</button>
        </div>

        <div id="local-name">You</div>
      </div>

      <div class="strip-empty-hint" id="strip-hint">Nobody else here yet</div>
    </div>
  </div>

  <!-- ══ LOWER PANEL — comments + controls ══ -->
  <div class="lower-panel">
    <div class="fx-layer" id="fx-layer"></div>
    <div class="gift-streak-layer" id="gift-streak-layer"></div>

    <div class="comments-wrap">
      <div class="comments-scroll" id="comments-scroll"></div>
    </div>

    <div class="live-controls">
      <div class="comment-bar">
        <input type="text" id="comment-input" placeholder="Say something…" maxlength="200">
        <button class="comment-send" id="comment-send-btn">Send</button>
      </div>
      <button class="ctrl-icon" id="heart-btn">❤️</button>
      <button class="ctrl-icon" id="gift-btn">🎁</button>
      <button class="ctrl-icon" id="fire-btn">🔥</button>
    </div>
  </div>

</div><!-- /live-screen -->
</div><!-- /app-shell -->

<!-- Gift sheet -->
<div class="sheet-backdrop" id="sheet-backdrop"></div>
<div class="gift-sheet" id="gift-sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-head">
    <h3>Send a Gift</h3>
    <div class="coin-pill-sm">🪙 <span id="sheet-coin-balance">0</span></div>
  </div>
  <div class="gift-target-row">Gifting: <span id="gift-target-name">Host</span></div>
  <div class="insufficient-cta" id="insufficient-cta">
    <span>Not enough coins for this gift.</span>
    <button id="topup-btn">Top up</button>
  </div>
  <div class="gift-grid" id="gift-grid"></div>
  <button class="send-gift-btn" id="send-gift-btn" disabled>Select a gift to send</button>
</div>

<div class="toast" id="toast"></div>

<!-- ════════════════════════════════════════════════════════
     NEW: 3D Gift Animation Engine mount point.
     Fixed/fullscreen, pointer-events disabled inside the
     engine itself, so it never blocks taps on anything above
     (stage, comments, gift sheet, controls).
     ════════════════════════════════════════════════════════ -->
<div id="gift-engine-root"></div>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<!--<script src="js/api.js"></script>-->
<!--script src="js/app.js"></script>-->
<script>
  /* Strip observer — keeps "Nobody else here" hint and online count accurate */
  const _strip = document.getElementById("participants-strip");
  const _hint  = document.getElementById("strip-hint");
  const _obs   = new MutationObserver(() => {
    const hasPeers  = _strip.querySelector(".participant-tile");
    const localShown = document.getElementById("local-tile").style.display !== "none";
    if (_hint) _hint.style.display = (hasPeers || localShown) ? "none" : "flex";
    const count      = _strip.querySelectorAll(".participant-tile").length;
    const countLabel = document.getElementById("viewer-count-label");
    if (countLabel) countLabel.textContent = (count + (localShown ? 1 : 0)) + " online";
  });
  _obs.observe(_strip, { childList: true, subtree: true, attributes: true });
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lovio — Notifications</title>
<link rel="stylesheet" href="css/style.css">
<style>
.notif-topbar {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 16px 12px; position: sticky; top: 0; z-index: 10;
  background: var(--bg); border-bottom: 1px solid var(--border);
  backdrop-filter: blur(16px);
}
.notif-topbar h1 { font-size: 20px; font-weight: 900; flex: 1; letter-spacing: -.3px; }
.back-btn {
  width: 38px; height: 38px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: var(--surface); border: 1px solid var(--border);
  color: var(--text); cursor: pointer; text-decoration: none; flex: none;
}
.mark-all-btn {
  background: none; border: none; color: var(--magenta); font-size: 12.5px;
  font-weight: 700; cursor: pointer; padding: 6px 10px; border-radius: 8px;
  transition: background .15s;
}
.mark-all-btn:hover { background: rgba(255,61,127,.1); }

.notif-tabs {
  display: flex; border-bottom: 1px solid var(--border); padding: 0 16px;
}
.notif-tab {
  padding: 12px 16px; font-size: 13px; font-weight: 700; cursor: pointer;
  color: var(--text-dim); border-bottom: 2px solid transparent;
  transition: color .15s, border-color .15s;
}
.notif-tab.active { color: var(--magenta); border-bottom-color: var(--magenta); }

.notif-list { padding: 8px 0 100px; }

.notif-item {
  display: flex; align-items: center; gap: 13px;
  padding: 13px 16px; cursor: pointer;
  transition: background .15s; border-left: 3px solid transparent;
  position: relative;
}
.notif-item:hover { background: rgba(255,255,255,.03); }
.notif-item.unread { background: rgba(255,61,127,.04); border-left-color: var(--magenta); }

.notif-av-wrap { position: relative; flex: none; }
.notif-av-wrap img {
  width: 46px; height: 46px; border-radius: 50%; object-fit: cover;
  border: 2px solid var(--border);
}
.notif-type-icon {
  position: absolute; bottom: -2px; right: -2px;
  width: 20px; height: 20px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; border: 2px solid var(--bg);
}
.notif-type-icon.like { background: #ff3d7f; }
.notif-type-icon.comment { background: #2196F3; }
.notif-type-icon.follow { background: #00d9b5; }
.notif-type-icon.gift { background: #ffc857; }
.notif-type-icon.live { background: #ff5500; }
.notif-type-icon.system { background: #6c63ff; }

.notif-body { flex: 1; min-width: 0; }
.notif-title { font-size: 13.5px; font-weight: 700; color: var(--text); margin-bottom: 2px; line-height: 1.4; }
.notif-item.unread .notif-title { font-weight: 800; }
.notif-subtitle { font-size: 12px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.notif-time { font-size: 11px; color: var(--text-dim); flex: none; margin-top: 1px; }
.notif-unread-dot {
  width: 8px; height: 8px; border-radius: 50%; background: var(--magenta); flex: none;
}

.notif-thumb {
  width: 46px; height: 46px; border-radius: 10px; object-fit: cover;
  flex: none;
}

.notif-section-label {
  font-size: 11px; font-weight: 800; color: var(--text-dim);
  text-transform: uppercase; letter-spacing: .08em;
  padding: 16px 16px 6px;
}

.empty-notif { text-align: center; padding: 70px 24px; color: var(--text-dim); }
.empty-notif .icon { font-size: 48px; margin-bottom: 16px; }
.empty-notif h3 { font-size: 17px; font-weight: 700; color: var(--text); margin-bottom: 8px; }

.skeleton-notif {
  display: flex; align-items: center; gap: 13px;
  padding: 13px 16px;
}
.skel-av { width: 46px; height: 46px; border-radius: 50%; background: var(--surface-2); animation: skel-pulse 1.5s infinite; flex: none; }
.skel-block { flex: 1; }
.skel-line { height: 10px; background: var(--surface-2); border-radius: 6px; margin-bottom: 6px; animation: skel-pulse 1.5s infinite; }
.skel-line.w60 { width: 60%; }
.skel-line.w80 { width: 80%; }
@keyframes skel-pulse { 0%,100%{opacity:.4} 50%{opacity:.9} }
</style>
</head>
<body>
<div class="app-shell">
  <div class="screen" style="padding:0;">

    <div class="notif-topbar">
      <a href="home.html" class="back-btn" aria-label="Back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" width="16" height="16">
          <path d="M19 12H5M12 5l-7 7 7 7"/>
        </svg>
      </a>
      <h1>Notifications</h1>
      <button class="mark-all-btn" id="mark-all-btn">Mark all read</button>
    </div>

    <div class="notif-tabs">
      <div class="notif-tab active" data-tab="all">All</div>
      <div class="notif-tab" data-tab="likes">Likes</div>
      <div class="notif-tab" data-tab="comments">Comments</div>
      <div class="notif-tab" data-tab="follows">Follows</div>
      <div class="notif-tab" data-tab="gifts">Gifts</div>
    </div>

    <div class="notif-list" id="notif-list">
      <!-- skeleton -->
      <div class="skeleton-notif"><div class="skel-av"></div><div class="skel-block"><div class="skel-line w80"></div><div class="skel-line w60"></div></div></div>
      <div class="skeleton-notif"><div class="skel-av"></div><div class="skel-block"><div class="skel-line w80"></div><div class="skel-line w60"></div></div></div>
      <div class="skeleton-notif"><div class="skel-av"></div><div class="skel-block"><div class="skel-line w80"></div><div class="skel-line w60"></div></div></div>
      <div class="skeleton-notif"><div class="skel-av"></div><div class="skel-block"><div class="skel-line w80"></div><div class="skel-line w60"></div></div></div>
    </div>

  </div>

  <nav class="tabbar">
    <a class="tab" href="home.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Home
    </a>
    <a class="tab" href="discover.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      Discover
    </a>
    <a class="tab tab-mid" href="go-live.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" width="22" height="22"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg>
      Live
    </a>
    <a class="tab" href="chat.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><path d="M21 11.5a8.5 8.5 0 0 1-12.4 7.55L3 20l1.05-5.4A8.5 8.5 0 1 1 21 11.5Z"/></svg>
      Chat
    </a>
    <a class="tab" href="profile.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-4 5-6 8-6s6.5 2 8 6"/></svg>
      Profile
    </a>
  </nav>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import "./js/api.js";
import "./js/app.js";
</script>
<script>
if (!requireAuthOrRedirect()) { /* stops */ }

/* ══════════════════════════════════════════

══════════════════════════════════════════ */

  },
  {
    id: "n6", type: "like",
    actor_name: "Chiamaka Obi", actor_username: "chiamaka",
    actor_avatar: "https://i.pravatar.cc/100?img=32",
    actor_id: "u1",
    title: "Chiamaka Obi and 12 others liked your post",
    body: '"New stream setup just dropped 🎙️🔥"',
    is_read: true,

    reference_type: "post"
  },
  {
    id: "n7", type: "comment",
    actor_name: "Tega Live", actor_username: "tegastar",
    actor_avatar: "https://i.pravatar.cc/100?img=12",
    actor_id: "u2",
    title: "Tega Live replied to your comment",
    body: '"Drop that mix link when it drops 🔊"',
    is_read: true,
    created_at: new Date(Date.now() - 28 * 3600000).toISOString(),
    reference_type: "post"
  },
  {

    actor_name: "Lovio",
    actor_avatar: "",
    actor_id: "",
    title: "Your account was verified ✅",
    body: "Your identity has been confirmed. You now have a verified badge.",
    is_read: true,
    created_at: new Date(Date.now() - 2 * 86400000).toISOString(),
    reference_type: "system"
  }
];

const TYPE_ICON = {
  like:    { emoji: "❤️", cls: "like" },
  comment: { emoji: "💬", cls: "comment" },
  follow:  { emoji: "👤", cls: "follow" },
  gift:    { emoji: "🎁", cls: "gift" },
  live:    { emoji: "🔴", cls: "live" },
  system:  { emoji: "💡", cls: "system" }
};

let allNotifs  = [];
let activeTab  = "all";

/* ══════════════════════════════════════════
   TABS
══════════════════════════════════════════ */
document.querySelectorAll(".notif-tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".notif-tab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    activeTab = tab.dataset.tab;
    renderNotifs();
  });
});

/* ══════════════════════════════════════════
   LOAD
══════════════════════════════════════════ */
async function loadNotifs() {
  try {
    const res = await api.request("/notifications");
    allNotifs = res.data || [];
    renderNotifs();
  } catch {
    allNotifs = MOCK_NOTIFS;
    renderNotifs();
  }
}

function renderNotifs() {
  const list = document.getElementById("notif-list");
  let filtered = allNotifs;

  if (activeTab !== "all") {
    const MAP = { likes: "like", comments: "comment", follows: "follow", gifts: "gift" };
    const t   = MAP[activeTab];
    filtered  = allNotifs.filter(n => n.type === t);
  }

  if (!filtered.length) {
    list.innerHTML = `<div class="empty-notif"><div class="icon">🔔</div><h3>No notifications yet</h3><p style="font-size:13px;">When someone likes your post or follows you, it'll show up here.</p></div>`;
    return;
  }

  // Group by day
  const today    = new Date(); today.setHours(0,0,0,0);
  const yesterday = new Date(today); yesterday.setDate(today.getDate()-1);

  const groups = { Today: [], Yesterday: [], Earlier: [] };
  filtered.forEach(n => {
    const d = new Date(n.created_at); d.setHours(0,0,0,0);
    if (d >= today) groups.Today.push(n);
    else if (d >= yesterday) groups.Yesterday.push(n);
    else groups.Earlier.push(n);
  });

  let html = "";
  for (const [label, items] of Object.entries(groups)) {
    if (!items.length) continue;
    html += `<div class="notif-section-label">${label}</div>`;
    html += items.map(n => buildNotifHTML(n)).join("");
  }

  list.innerHTML = html;

  list.querySelectorAll(".notif-item").forEach(el => {
    el.addEventListener("click", () => handleNotifClick(el.dataset.id));
  });
}

function buildNotifHTML(n) {
  const icon = TYPE_ICON[n.type] || { emoji: "📣", cls: "system" };
  const avatar = n.actor_avatar ||
    `https://ui-avatars.com/api/?name=${encodeURIComponent(n.actor_name || "L")}&background=ff3d7f&color=fff&size=80`;

  return `<div class="notif-item ${n.is_read ? "" : "unread"}" data-id="${n.id}" data-type="${n.type}" data-ref="${n.reference_id || ""}" data-actor="${n.actor_id || ""}">
    <div class="notif-av-wrap">
      <img src="${escapeHtml(avatar)}" alt="" onerror="this.src='https://i.pravatar.cc/80'">
      <span class="notif-type-icon ${icon.cls}">${icon.emoji}</span>
    </div>
    <div class="notif-body">
      <div class="notif-title">${escapeHtml(n.title)}</div>
      ${n.body ? `<div class="notif-subtitle">${escapeHtml(n.body)}</div>` : ""}
    </div>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none;">
      <span class="notif-time">${timeAgo(n.created_at)}</span>
      ${!n.is_read ? '<span class="notif-unread-dot"></span>' : ""}
    </div>
  </div>`;
}

async function handleNotifClick(notifId) {
  const n = allNotifs.find(x => x.id === notifId);
  if (!n) return;

  // Mark as read
  if (!n.is_read) {
    n.is_read = true;
    const el = document.querySelector(`.notif-item[data-id="${notifId}"]`);
    el?.classList.remove("unread");
    el?.querySelector(".notif-unread-dot")?.remove();
    try {
      await api.request(`/notifications/${notifId}/read`, { method: "PATCH" });
    } catch { /* ignore */ }
  }

  // Navigate
  if (n.reference_type === "post" && n.reference_id) {
    window.location.href = `post.html?id=${n.reference_id}`;
  } else if (n.reference_type === "user" && n.actor_id) {
    window.location.href = `profile.html?id=${n.actor_id}`;
  } else if (n.reference_type === "live_room" && n.reference_id) {
    window.location.href = `live.html?room=${n.reference_id}`;
  } else if (n.actor_id) {
    window.location.href = `profile.html?id=${n.actor_id}`;
  }
}

document.getElementById("mark-all-btn").addEventListener("click", async () => {
  allNotifs.forEach(n => { n.is_read = true; });
  renderNotifs();
  try {
    await api.request("/notifications/read-all", { method: "PATCH" });
    showToast("All marked as read");
  } catch {
    showToast("Marked as read");
  }
});

loadNotifs();
</script>
</body>

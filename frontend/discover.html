<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>lovecruise — Discover</title>
<link rel="stylesheet" href="css/style.css">
<style>
.discover-topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 20px 12px; position: sticky; top: 0; z-index: 10;
  background: var(--bg); border-bottom: 1px solid var(--border);
  backdrop-filter: blur(12px);
}
.discover-topbar .brand {
  display: flex; align-items: center; gap: 8px;
  font-size: 22px; font-weight: 900; letter-spacing: -0.5px;
}
.brand-dot { width: 8px; height: 8px; border-radius: 50%; background: #ff3d7f; box-shadow: 0 0 10px #ff3d7f; }
.topbar-actions { display: flex; align-items: center; gap: 10px; }
.coin-pill {
  display: flex; align-items: center; gap: 5px;
  background: rgba(255,200,87,.12); border: 1px solid rgba(255,200,87,.25);
  border-radius: 20px; padding: 6px 12px; font-size: 13px; font-weight: 700;
  color: #ffc857; cursor: pointer; transition: background .2s;
}
.coin-pill:hover { background: rgba(255,200,87,.2); }
.icon-btn {
  width: 36px; height: 36px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: var(--surface); border: 1px solid var(--border);
  color: var(--text); cursor: pointer; transition: background .2s;
}
.icon-btn:hover { background: var(--surface-2); }

.stories-strip { display: flex; gap: 14px; padding: 16px 20px; overflow-x: auto; scrollbar-width: none; }
.stories-strip::-webkit-scrollbar { display: none; }
.story-item { display: flex; flex-direction: column; align-items: center; gap: 6px; flex: 0 0 auto; cursor: pointer; }
.story-ring {
  width: 60px; height: 60px; border-radius: 50%; padding: 2.5px;
  background: conic-gradient(from 220deg, #ff3d7f, #ffc857, #00d9b5, #ff3d7f);
  transition: transform .2s;
}
.story-ring:hover { transform: scale(1.06); }
.story-item.viewed .story-ring { background: var(--border); }
.story-ring img { width: 100%; height: 100%; border-radius: 50%; border: 2.5px solid var(--bg); object-fit: cover; display: block; }
.story-add {
  width: 60px; height: 60px; border-radius: 50%;
  background: var(--surface); border: 2px dashed var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; cursor: pointer; transition: background .2s;
}
.story-add:hover { background: var(--surface-2); }
.story-item span { font-size: 11px; color: var(--text-dim); max-width: 62px; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.section-header { display: flex; align-items: center; justify-content: space-between; padding: 4px 20px 14px; }
.section-header h2 { font-size: 17px; font-weight: 800; letter-spacing: -0.3px; }
.live-count { font-size: 12px; font-weight: 700; color: #ff3d7f; background: rgba(255,61,127,.1); border-radius: 10px; padding: 3px 9px; }

.filter-tabs { display: flex; gap: 8px; padding: 0 20px 14px; overflow-x: auto; scrollbar-width: none; }
.filter-tabs::-webkit-scrollbar { display: none; }
.filter-tab {
  flex: 0 0 auto; padding: 6px 14px; border-radius: 20px;
  font-size: 12px; font-weight: 700; cursor: pointer;
  background: var(--surface); border: 1px solid var(--border);
  color: var(--text-dim); transition: all .2s;
}
.filter-tab.active { background: #ff3d7f; border-color: #ff3d7f; color: #fff; }

.live-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 14px 120px; }

.live-card {
  position: relative; border-radius: 18px; overflow: hidden;
  aspect-ratio: 9/16; background: var(--surface);
  border: 1px solid rgba(255,255,255,.06);
  display: block; text-decoration: none; color: inherit;
  transition: transform .22s ease, box-shadow .22s ease;
}
.live-card:hover { transform: translateY(-3px); box-shadow: 0 16px 36px rgba(0,0,0,.45); }
.live-card:active { transform: scale(.96); }
.card-host-photo {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover; object-position: center top; display: block;
}
.card-bg-gradient {
  position: absolute; inset: 0;
  background: linear-gradient(160deg, var(--card-color-a, rgba(255,61,127,.6)) 0%, var(--card-color-b, rgba(0,217,181,.4)) 100%);
}
.card-initials {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 48px; font-weight: 900; color: rgba(255,255,255,.3);
  letter-spacing: -2px; user-select: none;
}
.card-scrim {
  position: absolute; inset: 0;
  background: linear-gradient(to bottom, rgba(0,0,0,.12) 0%, rgba(0,0,0,.05) 35%, rgba(0,0,0,.5) 70%, rgba(0,0,0,.88) 100%);
  z-index: 1;
}
.live-badge {
  position: absolute; top: 10px; left: 10px; z-index: 3;
  display: flex; align-items: center; gap: 5px;
  background: #ff3d7f; color: #fff; font-size: 10px; font-weight: 900;
  letter-spacing: .06em; padding: 4px 8px; border-radius: 8px;
}
.live-badge .pulse { width: 5px; height: 5px; border-radius: 50%; background: #fff; animation: pulse-dot 1.4s infinite; flex: none; }
@keyframes pulse-dot { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.8)} }

/* Podcast-mode badge — same shape, violet instead of magenta, so a
   glance at the grid tells you which rooms are podcast rooms before
   you ever tap in. Kept visually distinct from the "LIVE" badge on
   social rooms rather than replacing it, since a room is always
   both live AND (social|podcast). */
.live-badge.mode-podcast {
  background: linear-gradient(135deg, #A05AFF, #6A1ADF);
}

.viewer-chip-card {
  position: absolute; top: 10px; right: 10px; z-index: 3;
  display: flex; align-items: center; gap: 4px;
  background: rgba(0,0,0,.5); backdrop-filter: blur(8px);
  color: #fff; font-size: 10.5px; font-weight: 700;
  padding: 4px 8px; border-radius: 8px;
}
.card-info { position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; padding: 12px 10px 10px; }
.card-host-row { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
.card-host-name {
  font-size: 13px; font-weight: 900; color: #fff;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  flex: 1; min-width: 0; text-shadow: 0 1px 6px rgba(0,0,0,.6);
}
.card-host-live-dot { width: 6px; height: 6px; border-radius: 50%; background: #ff3d7f; flex: none; box-shadow: 0 0 0 2px rgba(255,61,127,.3); }
.card-host-live-dot.mode-podcast { background: #A05AFF; box-shadow: 0 0 0 2px rgba(160,90,255,.3); }
.card-title {
  font-size: 11px; color: rgba(255,255,255,.75); line-height: 1.35;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden; text-shadow: 0 1px 4px rgba(0,0,0,.7);
}
.card-watchers { display: flex; align-items: center; margin-top: 6px; gap: 2px; }
.card-watcher-dot { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.5); margin-left: -4px; object-fit: cover; background: var(--surface-2); }
.card-watcher-dot:first-child { margin-left: 0; }
.card-watchers-label { font-size: 9.5px; color: rgba(255,255,255,.5); margin-left: 6px; font-weight: 700; }

.empty-live { grid-column: 1 / -1; text-align: center; padding: 56px 20px; color: var(--text-dim); }
.empty-live .icon { font-size: 40px; margin-bottom: 12px; }
.empty-live h3 { font-size: 16px; font-weight: 700; margin-bottom: 6px; color: var(--text); }
.empty-live p { font-size: 13px; line-height: 1.5; }

.go-live-fab {
  position: fixed; bottom: 80px; right: 20px; z-index: 99;
  display: flex; align-items: center; gap: 8px;
  background: linear-gradient(135deg, #ff3d7f, #c2185b);
  color: #fff; border: none; border-radius: 28px;
  padding: 14px 20px; font-size: 14px; font-weight: 800;
  box-shadow: 0 8px 24px rgba(255,61,127,.45);
  cursor: pointer; text-decoration: none; letter-spacing: .01em;
  transition: transform .2s, box-shadow .2s;
}
.go-live-fab:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(255,61,127,.55); }
.fab-dot { width: 8px; height: 8px; border-radius: 50%; background: #fff; animation: pulse-dot 1.2s infinite; }

.promo-banner {
  margin: 0 14px 18px; padding: 16px; border-radius: 16px;
  background: linear-gradient(135deg, rgba(255,200,87,.14), rgba(255,61,127,.1));
  border: 1px solid rgba(255,200,87,.2);
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.promo-text h3 { font-size: 13.5px; margin-bottom: 3px; }
.promo-text p { font-size: 12px; color: var(--text-dim); }
.btn-sm { padding: 8px 14px; border-radius: 12px; font-size: 12px; font-weight: 800; border: none; cursor: pointer; white-space: nowrap; background: #ffc857; color: #0a0710; }

.skeleton-card {
  border-radius: 18px; aspect-ratio: 9/16;
  background: linear-gradient(90deg, var(--surface) 25%, var(--surface-2) 50%, var(--surface) 75%);
  background-size: 200% 100%; animation: shimmer 1.5s infinite;
}
@keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
</style>
</head>
<body>
<div class="app-shell">
  <div class="screen" style="padding:0;">

    <div class="discover-topbar">
      <div class="brand">
        <span class="brand-dot"></span>
        lovecruise
      </div>
      <div class="topbar-actions">
        <div class="coin-pill" id="coin-pill-btn">
          🪙 <span id="coin-balance">0</span>
        </div>
        <div class="icon-btn" id="notif-btn" aria-label="Notifications">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="18" height="18">
            <path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.7 21a2 2 0 0 1-3.4 0"/>
          </svg>
        </div>
      </div>
    </div>

    <div class="stories-strip" id="stories-container">
      <div class="story-item">
        <div class="story-add" id="add-story-btn">＋</div>
        <span>Add Story</span>
      </div>
    </div>

    <div class="promo-banner">
      <div class="promo-text">
        <h3>🎁 Top up &amp; get 15% bonus coins</h3>
        <p>Limited offer on the Value Pack today</p>
      </div>
      <button class="btn-sm" id="promo-topup-btn">Top up</button>
    </div>

    <div class="section-header">
      <h2>Lovio</h2>
      <span class="live-count" id="live-count">— live</span>
    </div>

    <div class="filter-tabs" id="filter-tabs">
      <div class="filter-tab active" data-filter="all">🔥 All</div>
      <div class="filter-tab" data-filter="trending">📈 Trending</div>
      <div class="filter-tab" data-filter="music">🎵 Music</div>
      <div class="filter-tab" data-filter="gaming">🎮 Gaming</div>
      <div class="filter-tab" data-filter="talk">💬 Talk</div>
    </div>

    <div class="live-grid" id="live-grid">
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
    </div>

  </div>

  <a class="go-live-fab" href="go-live.html">
    <span class="fab-dot"></span>
    Go Live
  </a>

  <nav class="tabbar">
    <a class="tab" href="home.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Home
    </a>
    <a class="tab active" href="discover.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      Discover
    </a>
    <a class="tab tab-mid" href="go-live.html" aria-label="Go live">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" width="22" height="22"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg>
      Live
    </a>
    <a class="tab" href="chat.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><path d="M21 11.5a8.5 8.5 0 0 1-12.4 7.55L3 20l1.05-5.4A8.5 8.5 0 1 1 21 11.5Z"/></svg>
      Chat
    </a>
    <a class="tab" href="profile.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-4 5-6 8-6s6.5 2 8 6"/></svg>
      Profile
    </a>
  </nav>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import "./js/api.js";
import "./js/app.js";

if (!window.requireAuthOrRedirect()) { throw new Error("Auth required"); }

document.getElementById("coin-balance").textContent =
  window.formatCoins(window.CURRENT_USER.coinBalance || window.CURRENT_USER.coin_balance || 0);

const CARD_PALETTES = [
  ["rgba(255,61,127,.7)",  "rgba(120,0,255,.5)"],
  ["rgba(0,217,181,.65)", "rgba(0,100,255,.5)"],
  ["rgba(255,160,0,.65)", "rgba(255,61,127,.5)"],
  ["rgba(100,0,255,.65)", "rgba(0,217,181,.5)"],
  ["rgba(0,180,255,.6)",  "rgba(0,60,180,.5)"],
  ["rgba(255,80,80,.65)", "rgba(200,0,100,.5)"],
];

let allRooms     = [];
let activeFilter = "all";

document.getElementById("filter-tabs").addEventListener("click", (e) => {
  const tab = e.target.closest(".filter-tab");
  if (!tab) return;
  activeFilter = tab.dataset.filter;
  document.querySelectorAll(".filter-tab").forEach(t => t.classList.remove("active"));
  tab.classList.add("active");
  renderLiveGrid(allRooms);
});

document.getElementById("coin-pill-btn").addEventListener("click", () => { window.location.href = "coins.html"; });
document.getElementById("notif-btn").addEventListener("click", () => { window.showToast("No new notifications"); });
document.getElementById("add-story-btn").addEventListener("click", () => { window.showToast("Story creation coming soon"); });
document.getElementById("promo-topup-btn").addEventListener("click", () => { window.location.href = "coins.html"; });

/* ============================================================
   ROOM MODE ROUTING
   ------------------------------------------------------------
   A room is either "social" (camera + chat, live.html) or
   "podcast" (episode format, podcast-live.html). The mode is
   set once at creation time in go-live.html and must be sent
   back by the backend on every room object in GET /live —
   we read it defensively under a couple of likely field names
   so this keeps working whichever key the API settles on.
   Anything that isn't explicitly "podcast" is treated as social,
   so older rooms created before this field existed still route
   correctly to live.html.
   ============================================================ */
function roomMode(room) {
  const raw = (room.mode || room.room_type || room.roomType || room.live_type || "").toLowerCase();
  return raw === "podcast" ? "podcast" : "social";
}

function buildRoomHref(room, mode) {
  const roomId = encodeURIComponent(room.id);
  if (mode === "podcast") {
    const params = new URLSearchParams({
      room:  room.id,
      title: room.title || room.pod_title || "Live Podcast",
      show:  room.show_name || room.pod_show_name || "",
      cover: room.cover_image_url || room.cover_image || ""
    });
    return `podcast-live.html?${params.toString()}`;
  }
  return `live.html?room=${roomId}`;
}

function renderLiveGrid(rooms) {
  const grid    = document.getElementById("live-grid");
  const countEl = document.getElementById("live-count");
  countEl.textContent = rooms.length ? `${rooms.length} live` : "No live";

  if (!rooms.length) {
    grid.innerHTML = `
      <div class="empty-live">
        <div class="icon">📡</div>
        <h3>Nobody's live right now</h3>
        <p>Be the first to go live and grow your audience.</p>
      </div>`;
    return;
  }

  grid.innerHTML = rooms.map((room, i) => {
    const roomId   = room.id;
    if (!roomId) return "";
    const mode     = roomMode(room);
    const href     = buildRoomHref(room, mode);
    const palette  = CARD_PALETTES[i % CARD_PALETTES.length];
    const avatar   = room.avatar_url || "";
    const coverSrc = room.cover_image_url || room.cover_image || avatar;
    const username = room.username || room.display_name || "Host";
    const title    = room.title || (mode === "podcast" ? "Live Podcast" : "Live Stream");
    const viewers  = room.viewer_count || 0;
    const initials = username.split(" ").map(w => w[0] || "").join("").slice(0, 2).toUpperCase();
    const hasPhoto = coverSrc.trim().length > 0;
    const badgeCls = mode === "podcast" ? "live-badge mode-podcast" : "live-badge";
    const badgeTxt = mode === "podcast" ? "PODCAST" : "LIVE";
    const dotCls   = mode === "podcast" ? "card-host-live-dot mode-podcast" : "card-host-live-dot";

    return `
      <a class="live-card" href="${href}"
         style="--card-color-a:${palette[0]};--card-color-b:${palette[1]};">
        <div class="card-bg-gradient"></div>
        ${!hasPhoto ? `<div class="card-initials">${window.escapeHtml(initials)}</div>` : ""}
        ${hasPhoto  ? `<img class="card-host-photo" src="${window.escapeHtml(coverSrc)}" alt="" loading="lazy">` : ""}
        <div class="card-scrim"></div>
        <span class="${badgeCls}"><span class="pulse"></span>${badgeTxt}</span>
        <span class="viewer-chip-card">👁 ${window.formatCoins(viewers)}</span>
        <div class="card-info">
          <div class="card-host-row">
            <span class="${dotCls}"></span>
            <span class="card-host-name">${window.escapeHtml(username)}</span>
          </div>
          <div class="card-title">${window.escapeHtml(title)}</div>
          ${viewers > 1 ? `
          <div class="card-watchers">
            ${[...Array(Math.min(3, viewers))].map(() => `<div class="card-watcher-dot" style="background:${randomPastel()}"></div>`).join("")}
            <span class="card-watchers-label">${viewers > 3 ? `+${viewers - 3} watching` : "watching"}</span>
          </div>` : ""}
        </div>
      </a>`;
  }).join("");
}

function randomPastel() {
  return `hsl(${Math.floor(Math.random() * 360)},60%,55%)`;
}

async function loadLiveRooms() {
  try {
    const response = await window.api.request("/live");
    allRooms = response.data || [];
    renderLiveGrid(allRooms);
  } catch (err) {
    console.error("Load live rooms error:", err);
    document.getElementById("live-grid").innerHTML = `
      <div class="empty-live">
        <div class="icon">⚠️</div>
        <h3>Couldn't load streams</h3>
        <p>Check your connection and try again.</p>
      </div>`;
  }
}

async function loadStories() {
  try {
    const response  = await window.api.request("/stories/feed");
    const stories   = response.data || [];
    const container = document.getElementById("stories-container");
    const myAvatar  = window.CURRENT_USER.avatarUrl || window.CURRENT_USER.avatar_url ||
      `https://ui-avatars.com/api/?name=${encodeURIComponent(window.CURRENT_USER.username || "Me")}&background=ff3d7f&color=fff&size=80`;

    let html = `
      <div class="story-item">
        <div class="story-add" id="add-story-btn">＋</div>
        <span>Add Story</span>
      </div>
      <div class="story-item" id="my-story-btn">
        <div class="story-ring"><img src="${window.escapeHtml(myAvatar)}" alt="Your story"></div>
        <span>You</span>
      </div>`;

    html += stories.map(s => `
      <div class="story-item ${s.viewed ? "viewed" : ""}" data-story-id="${s.id}">
        <div class="story-ring"><img src="${window.escapeHtml(s.avatar_url || "https://i.pravatar.cc/100")}" alt="${window.escapeHtml(s.username || "")}"></div>
        <span>${window.escapeHtml(s.username || "User")}</span>
      </div>`).join("");

    container.innerHTML = html;

    document.getElementById("add-story-btn")?.addEventListener("click", () => { window.showToast("Story creation coming soon"); });
    document.getElementById("my-story-btn")?.addEventListener("click", () => { window.showToast("Your story"); });
    container.querySelectorAll("[data-story-id]").forEach(el => {
      el.addEventListener("click", () => openStory(el.dataset.storyId));
    });
  } catch (err) {
    console.error("Load stories error:", err);
  }
}

function openStory(id) {
  window.api.request(`/stories/${id}/view`, { method: "POST" }).catch(() => {});
  window.showToast("Story viewer coming soon");
}

loadLiveRooms();
loadStories();
setInterval(loadLiveRooms, 30_000);
</script>
</body>
</html>

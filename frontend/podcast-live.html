<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>vConnect — Podcast Live</title>
<link rel="stylesheet" href="css/style.css">
<style>
/* ============================================================
   vConnect Podcast Live Arena — FIXED, canonical layout
   ------------------------------------------------------------
   THIS FILE IS THE FIX for the "seat placeholders render as bare
   numbers instead of proper seat frames" bug reported for
   viewers joining an already-live stream.

   Root cause of that bug: js/live-mic-ring.js always creates the
   8 seat-slot DOM elements the same way for every client (host or
   viewer) — a .seat-slot > .seat-slot-frame > .seat-plus, plus a
   .seat-slot-num. That part was never the problem; the backend
   sync (guestSeatsUpdated / micSeatsUpdated, sent immediately on
   join per stream.socket.js) was never the problem either.

   The problem was a STALE copy of this HTML file that had no CSS
   rules at all for .seat-slot / .seat-slot-frame / .seat-plus /
   .seat-slot-num. With no matching styles, those elements have no
   border, no background, no sizing — so only the raw text (the
   seat number, plus a small "+") was visible. That reads exactly
   like "just seat numbers with no proper placeholder." It was a
   missing-stylesheet problem, not a host-vs-viewer logic problem.

   This file restores full styling for every seat element AND
   fixes host/guest frame sizing so nothing overlaps on any screen:
     1. Host card / guest frames use clamp() so they shrink
        continuously with viewport width instead of a fixed size
        that a small screen can't accommodate.
     2. The 8 mic seats are NOT positioned in a circle around the
        host. They live in their own flex-wrap row pinned to the
        bottom of the arena (#participants-strip), entirely
        separate from the host and guest frames above. On narrow
        phones the row wraps to two lines of smaller circles; on
        wide screens it's one loose row. Overlap is structurally
        impossible regardless of screen size — js/live-mic-ring.js
        never computes seat x/y, CSS flexbox does it.

   Palette:
     --arena-bg-1     #08050F  (near-black violet, base)
     --arena-bg-2     #170B2E  (deep violet, mid gradient)
     --arena-bg-3     #2A0D4E  (royal violet, glow source)
     --arena-accent   #A05AFF  (podcast violet — aura / lines / particles)
     --arena-accent-2 #6A1ADF  (deep violet — aura / lines gradient end)
     --arena-gold     #C890FF  (value / highlight accent, podcast-tinted)
   ============================================================ */
* { box-sizing: border-box; margin: 0; padding: 0; }

body, .app-shell, .live-screen {
  height: 100dvh; overflow: hidden; background: #08050F;
}

.live-screen {
  position: relative; width: 100%; max-width: 480px; margin: 0 auto;
  display: flex; flex-direction: column; height: 100dvh;
  background: #08050F;
}

/* ══════════════════════════
   ARENA — gradient bg, particle canvas, energy lines, host card,
   guest frames, mic-seat row.
══════════════════════════ */
.arena {
  position: relative; flex: 0 0 64%;
  overflow: hidden;
  --arena-accent: #A05AFF;
  --arena-accent-2: #6A1ADF;
  background:
    radial-gradient(circle at 50% 26%, #2A0D4E 0%, transparent 58%),
    radial-gradient(circle at 12% 88%, rgba(160,90,255,.12) 0%, transparent 45%),
    radial-gradient(circle at 90% 80%, rgba(106,26,223,.14) 0%, transparent 42%),
    linear-gradient(180deg, #12081F 0%, #08050F 100%);
}
@media (max-height: 680px) {
  .arena { flex-basis: 58%; }
}

#arena-particles {
  position: absolute; inset: 0; z-index: 1; pointer-events: none;
}

#connection-lines {
  position: absolute; inset: 0; z-index: 3; pointer-events: none;
  width: 100%; height: 100%;
}

.arena-blob {
  position: absolute; border-radius: 50%; filter: blur(38px);
  opacity: .32; z-index: 0; pointer-events: none;
}
.arena-blob.b1 { width: 170px; height: 170px; background: #6A1ADF; top: -40px; left: -45px; animation: blob-drift 15s ease-in-out infinite; }
.arena-blob.b2 { width: 130px; height: 130px; background: #A05AFF; bottom: -25px; right: -25px; animation: blob-drift 18s ease-in-out infinite reverse; }
@keyframes blob-drift {
  0%,100% { transform: translate(0,0) scale(1); }
  50% { transform: translate(14px,-10px) scale(1.08); }
}

/* ══════════════════════════
   TOP BAR (overlaid on arena)
══════════════════════════ */
.live-top {
  position: absolute; top: 0; left: 0; right: 0; z-index: 20;
  display: flex; align-items: flex-start; justify-content: space-between;
  padding: 12px 12px 0; gap: 8px;
  background: linear-gradient(to bottom, rgba(0,0,0,.5) 0%, transparent 100%);
}

.gift-tile .gift-icon-img { width: 26px; height: 26px; object-fit: contain; }
.gift-banner-icon { width: 22px; height: 22px; object-fit: contain; flex: none; }

.host-chip {
  display: flex; align-items: center; gap: 8px;
  background: rgba(0,0,0,.6); backdrop-filter: blur(10px);
  border: 1px solid rgba(160,90,255,.25);
  border-radius: 28px; padding: 5px 10px 5px 5px;
  max-width: calc(100% - 150px); min-width: 0;
}
.host-chip img {
  width: 32px; height: 32px; border-radius: 50%;
  border: 2px solid rgba(160,90,255,.6); object-fit: cover; flex: none; cursor: pointer;
}
.host-chip .ht { min-width: 0; flex: 1; }
.host-chip .name {
  display: block; font-size: 12px; font-weight: 800; color: #fff;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.host-chip .sub { font-size: 10px; color: rgba(255,255,255,.65); }

.follow-btn {
  flex: none; background: linear-gradient(135deg,#A05AFF,#6A1ADF); color: #fff; border: none;
  border-radius: 14px; padding: 4px 10px; font-size: 11px;
  font-weight: 800; cursor: pointer; transition: background .2s, transform .15s; white-space: nowrap;
}
.follow-btn:active { transform: scale(.94); }
.follow-btn.active { background: rgba(255,255,255,.2); }

.live-top-right {
  display: flex; align-items: center; gap: 6px; flex: none;
}
.viewer-chip {
  display: flex; align-items: center; gap: 4px;
  background: rgba(0,0,0,.5); backdrop-filter: blur(8px);
  border-radius: 14px; padding: 5px 8px;
  color: #fff; font-size: 11px; font-weight: 700;
}
#network-badge {
  font-size: 9px; font-weight: 900; padding: 3px 6px;
  border-radius: 7px; background: rgba(0,200,100,.7); color: #fff;
}
.close-btn {
  width: 30px; height: 30px; border-radius: 50%;
  background: rgba(0,0,0,.5); backdrop-filter: blur(8px);
  display: flex; align-items: center; justify-content: center;
  color: #fff; border: none; cursor: pointer; flex: none;
}
.end-live-btn {
  display: none; align-items: center; gap: 5px;
  background: rgba(255,61,127,.9); color: #fff; border: none;
  border-radius: 14px; padding: 5px 10px; font-size: 11px;
  font-weight: 800; cursor: pointer; white-space: nowrap;
}

.live-badge {
  display: flex; align-items: center; gap: 4px;
  background: linear-gradient(135deg,#A05AFF,#6A1ADF);
  border-radius: 14px; padding: 5px 9px;
  color: #fff; font-size: 10px; font-weight: 900; letter-spacing: .05em;
  white-space: nowrap;
}
.live-badge .dot {
  width: 5px; height: 5px; border-radius: 50%; background: #fff;
  animation: pulse-anim 1.4s infinite;
}
@keyframes pulse-anim { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.75)} }

.top-gifters {
  position: absolute; top: 54px; left: 12px; z-index: 20;
  display: flex; align-items: center;
}
.top-gifters img {
  width: 26px; height: 26px; border-radius: 50%;
  border: 2px solid rgba(0,0,0,.5); object-fit: cover; margin-left: -5px;
}
.top-gifters img:first-child { margin-left: 0; }
.top-gifters .label { font-size: 10px; color: rgba(255,255,255,.65); margin-left: 7px; font-weight: 700; }

#host-controls {
  display: none; position: absolute; top: 54px; right: 12px;
  z-index: 20; flex-direction: column; gap: 6px;
}
.host-mode #host-controls { display: flex; }
.h-ctrl {
  width: 36px; height: 36px; border-radius: 50%;
  background: rgba(0,0,0,.6); backdrop-filter: blur(8px);
  border: 1px solid rgba(160,90,255,.3);
  display: flex; align-items: center; justify-content: center;
  color: #fff; cursor: pointer; font-size: 14px;
}

.mic-wrap {
  position: absolute; bottom: 8px; right: 12px; z-index: 20;
  width: 4px; height: 40px; background: rgba(255,255,255,.1);
  border-radius: 4px; overflow: hidden; display: none;
}
.host-mode .mic-wrap { display: block; }
#mic-level {
  position: absolute; bottom: 0; width: 100%;
  background: #A05AFF; border-radius: 4px; height: 0%;
  transition: height .08s;
}

/* ══════════════════════════
   HOST CARD — clamp()-sized, scales continuously with viewport
   width so it never crowds the guest frames / seat row on a
   small screen.
══════════════════════════ */
.host-card-wrap {
  position: absolute; z-index: 5;
  left: 50%; top: 30%; transform: translate(-50%,-50%);
  width: clamp(104px, 30vw, 168px);
  height: clamp(104px, 30vw, 168px);
}

.host-aura {
  position: absolute; inset: -8px; border-radius: 50%;
  background: conic-gradient(from 0deg, #A05AFF, #6A1ADF, #C890FF, #A05AFF);
  animation: aura-spin 5s linear infinite;
  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 4px));
  mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 4px));
  filter: drop-shadow(0 0 10px rgba(160,90,255,.55));
}
@keyframes aura-spin { to { transform: rotate(360deg); } }

.host-card-wrap.speaking .host-aura {
  animation-duration: 1.6s;
  filter: drop-shadow(0 0 18px rgba(160,90,255,.85)) drop-shadow(0 0 30px rgba(106,26,223,.4));
}
.host-card-wrap.speaking .host-frame { animation: host-pulse 1s ease-in-out infinite; }
@keyframes host-pulse {
  0%,100% { box-shadow: 0 0 0 0 rgba(160,90,255,.55); }
  50% { box-shadow: 0 0 0 8px rgba(160,90,255,0); }
}

.host-frame {
  position: absolute; inset: 0; border-radius: 50%; overflow: hidden;
  background: #120a1f; box-shadow: 0 10px 30px rgba(0,0,0,.55);
  border: 2px solid rgba(255,255,255,.12);
}
#stage-video {
  width: 100%; height: 100%; object-fit: cover; display: block;
}
.stage-offline {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 6px;
  background: #120a1f; color: rgba(255,255,255,.4); font-size: 10.5px; text-align: center; padding: 8px;
}
.stage-offline .icon { font-size: 26px; }

.host-online-dot {
  position: absolute; bottom: 3px; right: 3px; z-index: 6;
  width: 14px; height: 14px; border-radius: 50%;
  background: #00c864; border: 2px solid #08050F;
}

.stage-label {
  position: absolute; left: 50%; bottom: -22px; transform: translateX(-50%);
  z-index: 6; display: flex; align-items: center; gap: 5px;
  background: rgba(0,0,0,.55); backdrop-filter: blur(8px);
  border-radius: 20px; padding: 3px 10px;
  font-size: 10.5px; font-weight: 800; color: #fff; white-space: nowrap;
}
.stage-label .pulse-dot {
  width: 5px; height: 5px; border-radius: 50%; background: #A05AFF;
  animation: pulse-anim 1.4s infinite; flex: none;
}

.audio-mode-overlay {
  position: absolute; inset: 0; z-index: 4;
  display: none; flex-direction: column; align-items: center; justify-content: center;
  gap: 6px; background: radial-gradient(circle at 50% 40%, #1c0c33 0%, #120a1f 100%);
}
.audio-mode-overlay.show { display: flex; }
.pod-cover-art {
  width: clamp(44px, 15vw, 72px); height: clamp(44px, 15vw, 72px);
  border-radius: 15px;
  object-fit: cover; border: 2px solid rgba(160,90,255,.5);
  box-shadow: 0 6px 18px rgba(160,90,255,.3);
}



.pod-cover-fallback {
  width: clamp(44px, 15vw, 72px); height: clamp(44px, 15vw, 72px);
  border-radius: 15px;
  background: linear-gradient(135deg,#1c0c33,#2a0d4e);
  display: flex; align-items: center; justify-content: center;
  font-size: clamp(18px, 6vw, 30px); border: 2px solid rgba(160,90,255,.35);
}
.soundwave {
  display: flex; align-items: center; gap: 2px; height: 14px;
}
.sw-bar {
  width: 2px; border-radius: 2px;
  background: linear-gradient(to top, #A05AFF, #C890FF);
  animation: sw-anim .6s ease-in-out infinite alternate;
}
@keyframes sw-anim { from{height:2px} to{height:12px} }

/* ══════════════════════════
   MATCHMAKING GUEST FRAMES — clamp()-sized, shrink in step with
   the host card rather than staying a fixed size.
══════════════════════════ */
.guest-frames {
  position: absolute; z-index: 5;
  left: 50%; top: 54%; transform: translate(-50%,-50%);
  display: flex; align-items: center; gap: clamp(10px, 4vw, 18px);
}
.guest-frame {
  position: relative;
  width: clamp(68px, 21vw, 116px); height: clamp(68px, 21vw, 116px);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, rgba(160,90,255,.22), rgba(255,255,255,.05));
  border: 2px dashed rgba(160,90,255,.4);
  cursor: pointer; transition: border-color .2s, background .2s, transform .15s;
}
.guest-frame:active { transform: scale(.95); }
.guest-frame.occupied {
  border-style: solid; border-color: rgba(160,90,255,.55);
  background: transparent;
}
.guest-frame.occupied.speaking {
  border-color: #C890FF;
  box-shadow: 0 0 0 3px rgba(200,144,255,.25);
}
.guest-placeholder {
  font-size: clamp(20px, 7vw, 36px); color: rgba(255,255,255,.32); pointer-events: none;
}
.guest-frame.occupied .guest-placeholder { display: none; }
.guest-tag {
  position: absolute; bottom: -18px; left: 50%; transform: translateX(-50%);
  font-size: 9px; font-weight: 800; padding: 2px 8px; border-radius: 10px;
  background: rgba(0,0,0,.6); color: #fff; white-space: nowrap; pointer-events: none;
}
.guest-frame[data-slot="male"] .guest-tag { color: #6FC7FF; }
.guest-frame[data-slot="female"] .guest-tag { color: #FF8FD1; }
.guest-link {
  font-size: clamp(15px, 4.5vw, 22px); filter: drop-shadow(0 0 6px rgba(160,90,255,.6));
  animation: pulse-anim 1.8s ease-in-out infinite;
}

/* ══════════════════════════
   MIC SEAT ROW — the 8 permanent seat slots, created dynamically
   by js/live-mic-ring.js, live in their own flex-wrap row pinned
   to the bottom of the arena instead of a circle wrapped around
   the host. This is what actually fixes small-screen crowding
   AND is the CSS that was missing from the stale copy of this
   file — .seat-slot / .seat-slot-frame / .seat-plus /
   .seat-slot-num MUST be styled here or the elements
   live-mic-ring.js creates render as bare text.
══════════════════════════ */
#participants-strip {
  position: absolute;
  inset: 0;
  z-index: 4;
  pointer-events: none;
}
#participants-strip > * { pointer-events: auto; }

/* Left / right seat columns (seats 1-2 and 3-4) — flank the arena
   instead of stacking, so they can never get clipped by the
   overflow:hidden arena container. */
.seat-wing {
  position: absolute;
  top: 58%;
  transform: translateY(-50%);
  display: flex;
  flex-direction: column;
  gap: clamp(8px, 2.5vh, 16px);
  z-index: 4;
}
.seat-wing-left  { left: 4px; }
.seat-wing-right { right: 4px; }

/* Bottom seat row (seats 5-8) — pinned to the bottom edge, centered. */
.seat-row {
  position: absolute;
  left: 50%;
  bottom: 6px;
  transform: translateX(-50%);
  display: flex;
  flex-wrap: nowrap;
  justify-content: center;
  gap: clamp(6px, 2.5vw, 12px);
  width: max-content;
  max-width: calc(100% - 12px);
  z-index: 4;
}


#local-tile, .participant-tile {
  display: none;
  flex-direction: column; align-items: center; gap: 0;
  width: clamp(40px, 12vw, 58px);
  flex: 0 0 auto;
}
#local-tile.seated, .participant-tile.seated {
  display: flex;
  animation: seat-in .38s cubic-bezier(.34,1.4,.64,1);
}
@keyframes seat-in {
  from { opacity: 0; transform: scale(.5); }
  to   { opacity: 1; transform: scale(1); }
}

#local-tile.docked, .participant-tile.docked {
  width: 100%; height: 100%;
  animation: seat-in .32s cubic-bezier(.34,1.4,.64,1);
}
#local-tile.docked .seat-frame, .participant-tile.docked .seat-frame {
  width: 100%; height: 100%;
}

#local-tile.seat-docked, .participant-tile.seat-docked {
  /* intentionally no overrides — flow layout handles it */
}

.seat-frame {
  position: relative;
  width: clamp(34px, 10vw, 52px); height: clamp(34px, 10vw, 52px);
  border-radius: 50%;
  padding: 2px;
  background: linear-gradient(135deg, rgba(160,90,255,.5), rgba(255,255,255,.08));
}
#local-tile .seat-frame { background: linear-gradient(135deg, #C890FF, #A05AFF); }
.participant-tile.speaking .seat-frame,
#local-tile.speaking .seat-frame {
  background: conic-gradient(from 0deg, #A05AFF, #C890FF, #A05AFF);
  animation: aura-spin 1.4s linear infinite;
}

#local-video, .participant-tile video {
  width: 100%; height: 100%; border-radius: 50%;
  object-fit: cover; background: #120a1f; display: block;
  border: 2px solid #08050F;
}

.seat-num {
  position: absolute; top: -3px; left: -3px; z-index: 3;
  width: 15px; height: 15px; border-radius: 50%;
  background: #170B2E; border: 1.5px solid rgba(255,255,255,.25);
  color: rgba(255,255,255,.75); font-size: 8px; font-weight: 800;
  display: flex; align-items: center; justify-content: center;
}

.seat-mic-icon {
  position: absolute; bottom: -2px; right: -2px; z-index: 3;
  width: 16px; height: 16px; border-radius: 50%;
  background: #170B2E; border: 1.5px solid #08050F;
  display: flex; align-items: center; justify-content: center;
  font-size: 8px;
}

#local-name, .ptile-name {
  font-size: clamp(7px, 2vw, 8.5px); color: rgba(255,255,255,.7); font-weight: 700;
  text-align: center; max-width: clamp(40px, 12vw, 58px); margin-top: 3px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

.local-tile-controls {
  position: absolute; bottom: -3px; left: 50%; transform: translateX(-50%);
  display: flex; align-items: center; justify-content: center; gap: 3px;
  z-index: 5;
}
.local-ctrl-btn {
  width: 18px; height: 18px; border-radius: 50%;
  background: rgba(0,0,0,.8); backdrop-filter: blur(6px);
  border: 1px solid rgba(255,255,255,.2);
  display: flex; align-items: center; justify-content: center;
  color: #fff; cursor: pointer; font-size: 8px;
  transition: background .15s, transform .1s;
  padding: 0; line-height: 1;
}
.local-ctrl-btn:active { transform: scale(.85); }
.local-ctrl-btn.muted { background: rgba(160,90,255,.75); border-color: rgba(160,90,255,.5); }

.ptile-muted-badge {
  position: absolute; top: -3px; right: -3px; z-index: 4;
  width: 15px; height: 15px; border-radius: 50%;
  background: rgba(0,0,0,.8); backdrop-filter: blur(4px);
  display: none; align-items: center; justify-content: center;
  font-size: 8px; line-height: 1;
}

.strip-empty-hint { display: none; }

/* ══════════════════════════
   SEAT SLOTS — the 8 permanent mic-seat placeholders. Vacant
   slots are dashed and tappable ("+" + seat number); once
   occupied, the placeholder hides and the real tile fills the
   same flex slot. THIS is the block that must exist for every
   copy of this page — without it, seats render as plain numbers.
══════════════════════════ */
.seat-slot {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  width: clamp(40px, 12vw, 58px);
  flex: 0 0 auto;
}
.seat-slot-frame {
  width: clamp(34px, 10vw, 52px); height: clamp(34px, 10vw, 52px);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  border: 2px dashed rgba(160,90,255,.35);
  background: rgba(255,255,255,.04);
  cursor: pointer;
  transition: border-color .2s, background .2s, transform .15s;
}
.seat-slot:active .seat-slot-frame { transform: scale(.9); }
.seat-slot:not(.occupied):hover .seat-slot-frame {
  border-color: rgba(160,90,255,.7);
  background: rgba(160,90,255,.08);
}
.seat-plus {
  font-size: 18px; line-height: 1; font-weight: 300;
  color: rgba(255,255,255,.32); pointer-events: none;
}
.seat-slot-num {
  font-size: 8px; font-weight: 800; color: rgba(255,255,255,.35);
}
.seat-slot.occupied .seat-slot-frame,
.seat-slot.occupied .seat-slot-num {
  display: none;
}

.episode-meta-bar {
  flex: 0 0 auto; display: flex; flex-direction: column; gap: 2px;
  padding: 10px 14px; background: #0d0718;
  border-top: 1px solid rgba(160,90,255,.14);
  border-bottom: 1px solid rgba(160,90,255,.08);
}
.pod-episode-label {
  font-size: 9.5px; font-weight: 800; letter-spacing: .08em;
  text-transform: uppercase; color: rgba(160,90,255,.9);
}
.pod-title {
  font-size: 14px; font-weight: 900; color: #fff; line-height: 1.25;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.pod-show-name {
  font-size: 11px; color: rgba(255,255,255,.55); font-weight: 600;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

.lower-panel {
  flex: 1; position: relative; overflow: hidden; display: flex; flex-direction: column;
  background: linear-gradient(to bottom, #0d0718 0%, #08050F 100%);
}

.fx-layer {
  position: absolute; inset: 0; pointer-events: none; z-index: 6; overflow: hidden;
}
.fx-particle {
  position: absolute; bottom: 80px; font-size: 20px;
  animation: float-up 2.7s ease-out forwards; will-change: transform,opacity;
}
@keyframes float-up {
  0%{transform:translateY(0) rotate(0deg);opacity:1}
  60%{opacity:1}
  100%{transform:translateY(-180px) translateX(var(--drift)) rotate(var(--rot));opacity:0}
}

.gift-streak-layer {

}
.gift-banner {

.gift-banner-text { font-size: 11px; color: #fff; line-height: 1.4; }

@keyframes slide-in-left { from{transform:translateX(-16px);opacity:0} to{transform:translateX(0);opacity:1} }
@keyframes fade-out { 0%{opacity:1} 100%{opacity:0} }

.comments-wrap {
  flex: 1; overflow: hidden; position: relative;
  -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 22%);
  mask-image: linear-gradient(to bottom, transparent 0%, black 22%);
}
.comments-scroll {
  height: 100%; overflow-y: auto; display: flex; flex-direction: column;
  justify-content: flex-end; gap: 5px; padding: 8px 12px;
  scrollbar-width: none;
}
.comments-scroll::-webkit-scrollbar { display: none; }
.comment-row { display: flex; align-items: flex-start; gap: 6px; animation: comment-in .2s ease-out; }
@keyframes comment-in { from{opacity:0;transform:translateY(5px)} to{opacity:1;transform:translateY(0)} }
.comment-row img { width: 22px; height: 22px; border-radius: 50%; object-fit: cover; flex: none; margin-top: 2px; }
.comment-row .bubble {

}
.comment-row .uname { display: inline; font-weight: 800; color: #C890FF; margin-right: 4px; }
.comment-row.gift-row .bubble { background: rgba(160,90,255,.16); border: 1px solid rgba(160,90,255,.28); }
.comment-row.system .bubble { background: rgba(160,90,255,.12); color: rgba(255,255,255,.7); font-size: 10.5px; }

.live-controls {
  flex: 0 0 auto; display: flex; align-items: center; gap: 8px;
  padding: 8px 12px 20px;
  border-top: 1px solid rgba(160,90,255,.1);
}
.comment-bar {
  flex: 1; display: flex; align-items: center;
  background: rgba(255,255,255,.07); border: 1px solid rgba(160,90,255,.18);
  border-radius: 22px; padding: 0 12px; height: 40px; gap: 6px;
}
.comment-bar input {
  flex: 1; background: none; border: none; outline: none;
  color: #fff; font-size: 13px;
}
.comment-bar input::placeholder { color: rgba(255,255,255,.38); }
.comment-send {
  background: none; border: none; color: #A05AFF;
  font-size: 12px; font-weight: 800; cursor: pointer; flex: none;
}
.ctrl-icon {
  width: 40px; height: 40px; border-radius: 50%;
  background: rgba(255,255,255,.07); border: 1px solid rgba(160,90,255,.18);
  display: flex; align-items: center; justify-content: center;
  color: #fff; cursor: pointer; flex: none;
  transition: background .15s, transform .1s; font-size: 17px;
}
.ctrl-icon:active { transform: scale(.88); }

.sheet-backdrop {
  position: fixed; inset: 0; background: rgba(0,0,0,.6);
  backdrop-filter: blur(4px); z-index: 50;
  opacity: 0; pointer-events: none; transition: opacity .25s;
}
.sheet-backdrop.open { opacity: 1; pointer-events: auto; }
.gift-sheet {
  position: fixed; bottom: -100%; left: 0; right: 0;
  max-width: 480px; margin: 0 auto; z-index: 51;
  background: #100a1c; border-radius: 24px 24px 0 0;
  padding: 0 0 36px; transition: bottom .3s cubic-bezier(.34,1.56,.64,1);
  border-top: 1px solid rgba(160,90,255,.2);
}
.gift-sheet.open { bottom: 0; }
.sheet-handle { width: 36px; height: 4px; background: rgba(255,255,255,.2); border-radius: 2px; margin: 12px auto 0; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px 4px; }
.sheet-head h3 { font-size: 15px; font-weight: 800; color: #fff; }
.gift-target-row { padding: 0 18px 10px; font-size: 11.5px; color: rgba(255,255,255,.5); }
#gift-target-name { color: #A05AFF; font-weight: 700; }
.coin-pill-sm { display: flex; align-items: center; gap: 4px; background: rgba(160,90,255,.12); border: 1px solid rgba(160,90,255,.25); border-radius: 18px; padding: 4px 10px; font-size: 12px; font-weight: 700; color: #C890FF; }
.gift-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; padding: 0 14px 14px; max-height: 240px; overflow-y: auto; scrollbar-width: none; }
.gift-grid::-webkit-scrollbar { display: none; }
.gift-tile { display: flex; flex-direction: column; align-items: center; gap: 3px; background: rgba(255,255,255,.06); border: 1.5px solid transparent; border-radius: 14px; padding: 10px 5px; cursor: pointer; transition: border-color .15s, background .15s, transform .1s; }
.gift-tile:active { transform: scale(.92); }
.gift-tile.selected { border-color: #A05AFF; background: rgba(160,90,255,.15); }
.gift-tile .emoji { font-size: 20px; }
.gift-tile .name { font-size: 9.5px; font-weight: 700; color: rgba(255,255,255,.8); text-align: center; }
.gift-tile .price { font-size: 9.5px; font-weight: 800; color: #C890FF; background: rgba(160,90,255,.12); border-radius: 7px; padding: 2px 5px; }
.send-gift-btn { width: calc(100% - 28px); margin: 0 14px; height: 46px; border-radius: 14px; font-size: 13px; font-weight: 800; border: none; cursor: pointer; background: linear-gradient(135deg,#A05AFF,#6A1ADF); color: #fff; transition: opacity .2s; }
.send-gift-btn:disabled { opacity: .4; cursor: not-allowed; }
.insufficient-cta { display: none; margin: 0 14px 10px; padding: 9px 12px; background: rgba(200,144,255,.1); border: 1px solid rgba(200,144,255,.25); border-radius: 10px; font-size: 11.5px; color: #C890FF; align-items: center; justify-content: space-between; gap: 8px; }
.insufficient-cta.show { display: flex; }
.insufficient-cta button { background: #C890FF; color: #1a0a2e; border: none; border-radius: 8px; padding: 5px 10px; font-size: 11px; font-weight: 800; cursor: pointer; flex: none; }

.toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,.88); color: #fff; padding: 9px 18px; border-radius: 18px; font-size: 12.5px; font-weight: 600; z-index: 200; opacity: 0; pointer-events: none; transition: opacity .25s; white-space: nowrap; }
.toast.show { opacity: 1; }

@media (prefers-reduced-motion: reduce) {
  .arena-blob, .host-aura, .host-card-wrap.speaking .host-frame,
  .participant-tile.speaking .seat-frame, #local-tile.speaking .seat-frame,
  .stage-label .pulse-dot, .live-badge .dot, .sw-bar, .guest-link { animation: none !important; }
}




/* seat-slot needs a positioning context for the host-control overlay */
.seat-slot{
    position:relative;      /* ADD THIS */
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
    width:clamp(40px,12vw,58px);
    flex:0 0 auto;
}
/* ══════════════════════════
   HOST CONTROL OVERLAY — kick (✕) / mute (🔇) buttons that
   live-mic-ring.js injects into every occupied seat-slot and
   guest-frame. Only visible to the host (body.host-mode) and
   never on the host's own tile (.hidden-self).
══════════════════════════ */
.host-ctrl-overlay {
  position: absolute; inset: 0; z-index: 8;
  display: none;          /* hidden unless host-mode + occupied, below */
  pointer-events: none;   /* only the buttons themselves are clickable */
}
.host-mode .seat-slot.occupied .host-ctrl-overlay,
.host-mode .guest-frame.occupied .host-ctrl-overlay {
  display: block;
}
.host-ctrl-overlay.hidden-self {
  display: none !important; /* never show kick/mute on your own seat */
}

.host-ctrl-btn {
  position: absolute;
  width: 16px; height: 16px;
  border-radius: 50%;
  border: 1.5px solid rgba(255,255,255,.5);
  display: flex; align-items: center; justify-content: center;
  font-size: 8px; line-height: 1;
  background: rgba(0,0,0,.85);
  color: #fff;
  cursor: pointer;
  pointer-events: auto;
  padding: 0;
  transition: transform .1s, background .15s;
}
.host-ctrl-btn:active { transform: scale(.85); }

.host-ctrl-mute {
  top: -4px; left: -4px;
}
.host-ctrl-kick {
  top: -4px; right: -4px;
  background: rgba(255,61,127,.9);
  border-color: rgba(255,61,127,.6);
}

/* guest-frame is bigger, give the buttons a bit more room */
.guest-frame .host-ctrl-btn {
  width: 20px; height: 20px; font-size: 10px;
}
.guest-frame .host-ctrl-mute { top: -6px; left: -6px; }
.guest-frame .host-ctrl-kick { top: -6px; right: -6px; }
</style>
</head>
<body>
<div class="app-shell">
<div class="live-screen">

  <div class="stage-panel arena" id="arena">
    <canvas id="arena-particles"></canvas>
    <div class="arena-blob b1"></div>
    <div class="arena-blob b2"></div>
    <svg id="connection-lines"></svg>

    <div class="live-top">
      <div class="host-chip">
        <img id="host-avatar" src="" alt="">
        <div class="ht">
          <span class="name" id="host-name">Loading…</span>
          <span class="sub">Podcast · <span id="live-duration">00:00</span></span>
        </div>
        <button class="follow-btn" id="follow-btn">Follow</button>
      </div>

        <span class="viewer-chip">👁 <span id="viewer-count">0</span></span>
        <div class="live-badge"><span class="dot"></span>POD LIVE</div>
        <button class="close-btn" id="close-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" width="14" height="14">
            <path d="m6 6 12 12M18 6 6 18"/>

        </button>
      </div>
    </div>

    <div class="top-gifters" id="top-gifters">
      <span class="label">Top Gifters</span>
    </div>

    <div id="host-controls">
      <button class="h-ctrl" id="mic-btn" title="Mute mic">🎤</button>
      <button class="h-ctrl" id="camera-btn" title="Camera off">📷</button>

    <div class="host-card-wrap" id="host-card-wrap">
      <div class="host-aura"></div>
      <div class="host-frame">
        <video id="stage-video" autoplay playsinline></video>

        <div class="audio-mode-overlay" id="audio-mode-overlay">
          <img class="pod-cover-art" id="pod-cover-art" src="" alt="" onerror="this.style.display='none'">
          <div class="pod-cover-fallback" id="pod-cover-fallback">🎙️</div>

    </div>

    </div>

        </div>
        <div id="local-name">You</div>
      </div>
      <div class="strip-empty-hint" id="strip-hint">Nobody else here yet</div>
    </div>

    <span id="viewer-count-label" style="display:none;">0 online</span>
  </div>

  <div class="episode-meta-bar">
    <span class="pod-episode-label" id="pod-episode-label">● PODCAST LIVE</span>
    <div class="pod-title" id="pod-title">Loading…</div>
    <div class="pod-show-name" id="pod-show-name"></div>
  </div>

  <div class="lower-panel">
    <div class="fx-layer" id="fx-layer"></div>
    <div class="gift-streak-layer" id="gift-streak-layer"></div>

    <div class="comments-wrap">
      <div class="comments-scroll" id="comments-scroll"></div>
    </div>

    <div class="live-controls">
      <div class="comment-bar">
        <input type="text" id="comment-input" placeholder="Say something…" maxlength="200">
        <button class="comment-send" id="comment-send-btn">Send</button>
      </div>
      <button class="ctrl-icon" id="heart-btn">❤️</button>
      <button class="ctrl-icon" id="gift-btn">🎁</button>
      <button class="ctrl-icon" id="fire-btn">🔥</button>
    </div>
  </div>

</div>
</div>

<div class="sheet-backdrop" id="sheet-backdrop"></div>
<div class="gift-sheet" id="gift-sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-head">
    <h3>Support the Host</h3>
    <div class="coin-pill-sm">🪙 <span id="sheet-coin-balance">0</span></div>
  </div>
  <div class="gift-target-row">Gifting: <span id="gift-target-name">Host</span></div>
  <div class="insufficient-cta" id="insufficient-cta">
    <span>Not enough coins for this gift.</span>
    <button id="topup-btn">Top up</button>
  </div>

  <button class="send-gift-btn" id="send-gift-btn" disabled>Select a gift to send</button>
</div>

<div class="toast" id="toast"></div>

<div id="gift-engine-root"></div>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<script>
  const sw = document.getElementById("soundwave");
  for (let i = 0; i < 12; i++) {
    const b = document.createElement("div");
    b.className = "sw-bar";
    b.style.animationDelay = (i * 0.06) + "s";
    b.style.height = "2px";
    sw.appendChild(b);
  }

  const _params = new URLSearchParams(window.location.search);
  const _titleEl = document.getElementById("pod-title");
  const _showEl  = document.getElementById("pod-show-name");
  const _coverEl = document.getElementById("pod-cover-art");
  const _fallEl  = document.getElementById("pod-cover-fallback");

  const _titleParam = _params.get("title");
  const _showParam  = _params.get("show");
  const _coverParam = _params.get("cover");

  if (_titleParam) _titleEl.textContent = decodeURIComponent(_titleParam);
  if (_showParam)  _showEl.textContent  = decodeURIComponent(_showParam);
  if (_coverParam) {
    _coverEl.src = decodeURIComponent(_coverParam);
    _coverEl.style.display = "block";
    _fallEl.style.display  = "none";
  }

  const _stageVid = document.getElementById("stage-video");
  const _audioOverlay = document.getElementById("audio-mode-overlay");
  const _stageObserver = new MutationObserver(() => {
    const isAudioOnly = _stageVid.style.opacity === "0.15";
    _audioOverlay.classList.toggle("show", isAudioOnly);
  });
  _stageObserver.observe(_stageVid, { attributes: true, attributeFilter: ["style"] });
</script>

<script type="module" src="/js/live.js"></script>
<script type="module" src="/js/live-mic-ring.js"></script>

<script type="module">
  import { GiftAnimationManager } from "./gift-engine/GiftAnimationManager.js";
  window.__giftEngine = new GiftAnimationManager(document.getElementById("gift-engine-root"));
</script>
